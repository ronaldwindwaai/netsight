[build-system]
# Required so the package is a real installable distribution rather than a
# "virtual" project: without it `uv sync` cannot install netsight_api and both
# the test suite and the production service need a PYTHONPATH side-channel.
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "netsight-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143.1,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "jsonschema>=4.23,<5",
  "pyjwt[crypto]>=2.15.1,<3",
  "argon2-cffi>=23.1,<26",
  "qrcode>=8,<9",
  # IANA zone database for rule schedules; slim images and Windows have no system copy, and
  # without it scheduled rules fail closed (cannot be saved, approved or evaluated).
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-qrcode>=8.2.0.20260518,<9",
  "pyyaml>=6,<7",
  # Tests use the bundled CA file as a known-good PEM (also a transitive dependency of httpx).
  "certifi>=2024",
  # The untrusted-TLS SSRF test builds a throwaway server context and a CA. It arrives
  # transitively via `pyjwt[crypto]`, but is declared so the test environment is reproducible.
  "cryptography>=50,<51",
  # Lets the packaging test build the wheel in-process (no network, no uv).
  "hatchling>=1.32.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/netsight_api"]
# Rollback SQL is destructive (it drops tables) and must never ship in the production
# wheel; only the forward ``*.up.sql`` migrations are packaged.
exclude = ["**/*.down.sql"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
