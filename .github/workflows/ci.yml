name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/tests/dependency-security.test.cjs
      - run: pnpm run build:opencode
      - run: node --test scripts/tests/opencode-load.test.mjs
      - run: pnpm run lint:web
      - run: pnpm run typecheck:web
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # PostgreSQL 17 matches the compose target (infrastructure/compose/docker-compose.dev.yml).
        # Pinned by digest (multi-arch index for tag 17, read from the Docker Hub registry
        # 2026-10-20); bump tag and digest together.
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: netsight_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: netsight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netsight_test -d netsight_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway CI-only credential for the job-local service container; not a secret. The
      # POSTGRES_USER is the container superuser, which the live suites need to CREATE ROLE
      # (app / WAN collector roles) and CREATE SCHEMA themselves.
      # NETSIGHT_REQUIRE_PG=1 makes the suite fail if a live PostgreSQL test is skipped.
      NETSIGHT_REQUIRE_PG: '1'
      NETSIGHT_TEST_PG_DSN: postgresql://netsight_test:ci-only-password@localhost:5432/netsight_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --project apps/api --locked --extra dev
      - run: uv run --project apps/api --no-sync ruff check apps/api scripts/check-release-gates.py scripts/tests/*.py
      - run: uv run --project apps/api --no-sync mypy apps/api/src
      - run: uv run --project apps/api --no-sync pytest apps/api/tests scripts/tests
      - run: uv build --project apps/api --wheel

  workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:latest
        with:
          args: -color
