name: Deploy
# Deploys main only after CI, Security and CodeQL pass on the exact commit.
# Merging to main is the human approval gate: protect main (PR + CI required).
on:
  workflow_run:
    workflows: [CI, Security, CodeQL]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA on main to deploy (default: latest main)"
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  release-gates:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || 'main' }}
          fetch-depth: 0
      - name: Require reviewed main commit and all release checks
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$SHA" origin/main
          python scripts/check-release-gates.py --repository "$REPOSITORY" --sha "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: release-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: vps
      url: https://netsight.sadcpf.org
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-gates.outputs.sha }}

      - name: Resolve release SHA
        id: rel
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload release
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          SHA: ${{ steps.rel.outputs.sha }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          $SSH "$VPS_USER@$VPS_HOST" "mkdir -p ~/netsight/releases/$SHA"
          rsync -az --delete -e "$SSH" \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' --exclude '.env*' \
            --exclude '*.zip' --exclude 'Netsight_Development_Package' \
            ./ "$VPS_USER@$VPS_HOST:netsight/releases/$SHA/"

      - name: Build, switch and health-check on VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          SHA: ${{ steps.rel.outputs.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash -l ~/netsight/releases/$SHA/scripts/deploy-vps.sh $SHA"

      - name: Cleanup SSH material
        if: always()
        run: rm -f ~/.ssh/deploy_key
