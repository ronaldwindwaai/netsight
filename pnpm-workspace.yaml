packages:
  - "apps/web"
  - "packages/*"
# unrs-resolver ships prebuilt binaries via optional deps; its postinstall is not needed.
# msgpackr-extract (transitive via @opencode/plugin -> effect) ships prebuilt
# binaries via optional platform packages; its native postinstall is not needed here.
allowBuilds:
  unrs-resolver: false
  msgpackr-extract: false
  # esbuild (component-test bundler) ships its binary via optional platform packages.
  esbuild: false
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
  ecc-universal: patches/ecc-universal.patch

# GHSA-ch52-4w7c-c8xp: keep OpenCode cache handling on the fixed release.
overrides:
  http-cache-semantics@<4.3.0: 4.3.0
