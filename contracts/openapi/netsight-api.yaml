          properties:
            bytes:
              type: 'null'
    UserTraffic:
      type: object
      additionalProperties: false
      required:
      - state
      - basis
      - window
      - top_n
      - items
      properties:
        state:
          enum:
          - not-connected
          - unknown
          - ok
        basis:
          enum:
          - inferred
          - unknown
        window:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IdentityTimeWindow'
        top_n:
          type: integer
          minimum: 0
          maximum: 100
        items:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/UserTrafficItem'
      description: Traffic by address over a short window, attributed by IP and therefore inferred. Not-connected without a traffic source; a non-ok state carries no values.
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            basis:
              const: unknown
            window:
              type: 'null'
            top_n:
              const: 0
            items:
              maxItems: 0
      - if:
          properties:
            state:
              const: ok
          required:
          - state
        then:
          properties:
            basis:
              const: inferred
            window:
              $ref: '#/components/schemas/IdentityTimeWindow'
    UserSecurityItem:
      type: object
      additionalProperties: false
      required:
