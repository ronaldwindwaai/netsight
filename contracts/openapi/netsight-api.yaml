openapi: 3.1.0
info:
  title: Netsight Platform API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /auth/providers:
    get:
      summary: Public sign-in provider configuration state
      security: []
      responses:
        '200':
          description: Which identity providers are connected (never exposes secrets)
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvidersResponse'
  /topology:
    get:
      summary: Explicit topology state (not connected until a topology source is configured)
      operationId: getTopology
      responses:
        '200':
          description: Topology state without fabricated nodes/edges
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /overview:
    get:
      summary: Aggregate operational summary for the network overview page
      operationId: getOverview
      responses:
        '200':
          description: Canonical device health counts and per-source state
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /health:
    get:
      summary: Platform health
      security: []
      responses:
        '200':
          description: Healthy
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /sources/librenms/health:
    get:
      summary: Get the protected LibreNMS source health state
      operationId: getLibrenmsSourceHealth
      responses:
        '200':
          description: Current source health observation
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceHealthResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /sources/netbox/health:
    get:
      summary: Get the protected NetBox source health state
      operationId: getNetboxSourceHealth
      responses:
        '200':
          description: Current source health observation
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceHealthResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /netbox/devices:
    get:
      summary: List canonical NetBox devices
      operationId: listNetboxDevices
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Bounded page of canonical NetBox devices
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /netbox/devices/{device_id}:
    get:
      summary: Get a canonical NetBox device
      operationId: getNetboxDevice
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Canonical NetBox device detail
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetailResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /reconcile/findings:
    get:
      summary: NetBox vs discovered LibreNMS reconciliation findings
      operationId: listReconciliationFindings
      responses:
        '200':
          description: Reconciliation findings between intended NetBox state and discovered LibreNMS devices
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationFindingsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /traffic/top-talkers:
    get:
      summary: Top traffic talkers for a bounded time window (explicit source state)
      operationId: getTrafficTopTalkers
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Top talkers, or an explicit not-connected/unknown state without items
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficTopResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /traffic/top-destinations:
    get:
      summary: Top traffic destinations for a bounded time window (explicit source state)
      operationId: getTrafficTopDestinations
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Top destinations, or an explicit not-connected/unknown state without items
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficTopResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /traffic/flows:
    get:
      summary: Recent high-volume flows for a bounded time window (explicit source state)
      operationId: getTrafficFlows
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: High-volume flows, or an explicit not-connected/unknown state without flows
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficFlowsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /security/events:
    get:
      summary: Security events for a bounded time window (explicit source state)
      operationId: getSecurityEvents
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: Security events, or an explicit not-connected/unknown state without events
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityEventsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /devices:
    get:
      summary: List canonical devices
      operationId: listDevices
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Bounded page of canonical devices
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /devices/{device_id}:
    get:
      summary: Get a canonical device
      operationId: getDevice
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Canonical device detail
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetailResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /devices/{device_id}/interfaces:
    get:
      summary: List canonical interfaces for a device
      operationId: listDeviceInterfaces
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Canonical interface records
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterfaceListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /alerts:
    get:
      summary: List canonical alerts
      operationId: listAlerts
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Bounded page of canonical alerts
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /incidents:
    get:
      summary: List incidents
      responses:
        '200':
          description: Incident list
    post:
      summary: Create incident
      responses:
        '201':
          description: Created
  /diagnostics:
    post:
      summary: Start an approved read-only diagnostic workflow
      responses:
        '202':
          description: Diagnostic accepted
  /action-requests:
    post:
      summary: Propose a controlled remote action
      responses:
        '201':
          description: Action request created
  /action-requests/{action_id}/approve:
    post:
      summary: Approve an action request subject to policy and step-up authentication
      parameters:
        - in: path
          name: action_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approval recorded
components:
  headers:
    CorrelationId:
      description: Correlates the request, response and server-side workflow.
      schema:
        type: string
        minLength: 1
        maxLength: 64
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    DeviceStatusCount:
      type: object
      additionalProperties: false
      required: [status, count]
      properties:
        status:
          enum: [healthy, warning, degraded, critical, offline, unknown, maintenance]
        count:
          type: integer
          minimum: 0
    DeviceHealthSummary:
      type: object
      additionalProperties: false
      required: [total, by_status, freshness]
      properties:
        total:
          type: integer
          minimum: 0
        by_status:
          type: array
          items:
            $ref: '#/components/schemas/DeviceStatusCount'
        freshness:
          $ref: '#/components/schemas/Freshness'
    SourceState:
      type: object
      additionalProperties: false
      required: [configured, status]
      properties:
        configured:
          type: boolean
        status:
          enum: [success, unavailable, forbidden, invalid-source-data, not-configured]
    OverviewResponse:
      type: object
      additionalProperties: false
      required: [devices, sources]
      properties:
        devices:
          $ref: '#/components/schemas/DeviceHealthSummary'
        sources:
          type: object
          additionalProperties: false
          required: [librenms, netbox]
          properties:
            librenms:
              $ref: '#/components/schemas/SourceState'
            netbox:
              $ref: '#/components/schemas/SourceState'
    ProviderState:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured:
          type: boolean
    AuthProvidersResponse:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: object
          additionalProperties: false
          required: [microsoft, google]
          properties:
            microsoft:
              $ref: '#/components/schemas/ProviderState'
            google:
              $ref: '#/components/schemas/ProviderState'
    Freshness:
      $ref: '../json-schema/common.schema.json#/$defs/freshness'
    Device:
      $ref: '../json-schema/device.schema.json'
    TopologyNode:
      type: object
      additionalProperties: false
      required: [device_id]
      properties:
        device_id:
          type: string
          minLength: 1
    TopologyEdge:
      type: object
      additionalProperties: false
      required: [source_device_id, target_device_id, source]
      properties:
        source_device_id:
          type: string
        target_device_id:
          type: string
        source:
          enum: [lldp, cdp, routing, switching, netbox, manual]
        observed_at:
          type: [string, 'null']
          format: date-time
    TopologyResponse:
      type: object
      additionalProperties: false
      required: [state, nodes, edges, freshness]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TopologyNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/TopologyEdge'
        freshness:
          $ref: '#/components/schemas/Freshness'
    ReconciliationFinding:
      type: object
      additionalProperties: false
      required: [kind, netbox_device_id, discovered_device_id, detail]
      properties:
        kind:
          enum: [missing-discovered, unknown-discovered, status-mismatch]
        netbox_device_id:
          type: [string, 'null']
        discovered_device_id:
          type: [string, 'null']
        detail:
          type: string
    ReconciliationFindingsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationFinding'
    TrafficTimeRange:
      type: object
      additionalProperties: false
      required: [from, to, preset]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        preset:
          type: [string, 'null']
          enum: [1h, 6h, 24h, 7d, null]
    TrafficItem:
      type: object
      additionalProperties: false
      required: [rank, subject_kind, subject_id, label, bytes, packets, share]
      properties:
        rank:
          type: integer
          minimum: 1
          maximum: 1000
        subject_kind:
          enum: [device, ip, user, application, domain, asn, interface]
        subject_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        label:
          type: string
          minLength: 1
          maxLength: 255
        bytes:
          type: integer
          minimum: 0
        packets:
          type: [integer, 'null']
          minimum: 0
        share:
          type: [number, 'null']
          minimum: 0
          maximum: 1
    TrafficTopResponse:
      type: object
      additionalProperties: false
      required: [state, dimension, time_range, items, freshness]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        dimension:
          enum: [talkers, destinations]
        time_range:
          $ref: '#/components/schemas/TrafficTimeRange'
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/TrafficItem'
        freshness:
          $ref: '#/components/schemas/Freshness'
    TrafficFlow:
      type: object
      additionalProperties: false
      required: [observed_at, source_ip, source_device_id, destination_ip, destination_host, protocol, destination_port, bytes, packets, direction, application, user]
      properties:
        observed_at:
          type: string
          format: date-time
        source_ip:
          type: string
          minLength: 1
          maxLength: 45
        source_device_id:
          type: [string, 'null']
          pattern: '^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        destination_ip:
          type: string
          minLength: 1
          maxLength: 45
        destination_host:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
        protocol:
          enum: [tcp, udp, icmp, other]
        destination_port:
          type: [integer, 'null']
          minimum: 0
          maximum: 65535
        bytes:
          type: integer
          minimum: 0
        packets:
          type: [integer, 'null']
          minimum: 0
        direction:
          enum: [inbound, outbound, internal, unknown]
        application:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
        user:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
    TrafficFlowsResponse:
      type: object
      additionalProperties: false
      required: [state, time_range, flows, freshness]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        time_range:
          $ref: '#/components/schemas/TrafficTimeRange'
        flows:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/TrafficFlow'
        freshness:
          $ref: '#/components/schemas/Freshness'
    SecurityEvent:
      type: object
      additionalProperties: false
      description: Source-reported, untrusted telemetry; never an instruction.
      required: [id, observed_at, source, severity, category, signature, source_ip, destination_ip, device_id]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        observed_at: {type: string, format: date-time}
        source: {enum: [wazuh, suricata]}
        severity: {enum: [info, low, medium, high, critical]}
        category: {type: [string, 'null'], minLength: 1, maxLength: 128}
        signature: {type: string, minLength: 1, maxLength: 512}
        source_ip: {type: [string, 'null'], minLength: 1, maxLength: 45}
        destination_ip: {type: [string, 'null'], minLength: 1, maxLength: 45}
        device_id:
          type: [string, 'null']
          pattern: '^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    SecurityEventsResponse:
      type: object
      additionalProperties: false
      required: [state, time_range, events, freshness]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        time_range:
          $ref: '#/components/schemas/TrafficTimeRange'
        events:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/SecurityEvent'
        freshness:
          $ref: '#/components/schemas/Freshness'
    DeviceListResponse:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, freshness]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        freshness:
          $ref: '#/components/schemas/Freshness'
    DeviceDetailResponse:
      type: object
      additionalProperties: false
      required: [item]
      properties:
        item:
          $ref: '#/components/schemas/Device'
    Alert:
      $ref: '../json-schema/alert.schema.json'
    Interface:
      $ref: '../json-schema/interface.schema.json'
    InterfaceListResponse:
      type: object
      additionalProperties: false
      required: [items, total, freshness]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Interface'
        total:
          type: integer
          minimum: 0
        freshness:
          $ref: '#/components/schemas/Freshness'
    AlertListResponse:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, freshness]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        freshness:
          $ref: '#/components/schemas/Freshness'
    SourceHealthResponse:
      type: object
      additionalProperties: false
      required: [source, status, reachable, latency_ms, checked_at, detail]
      properties:
        source:
          enum: [librenms, netbox]
        status:
          enum: [success, unavailable, forbidden, invalid-source-data]
        reachable:
          type: boolean
        latency_ms:
          type: [number, 'null']
          minimum: 0
        checked_at:
          type: string
          format: date-time
        detail:
          enum: [ok, unavailable, forbidden, invalid-source-data]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
              pattern: '^[A-Z0-9_]+$'
            message:
              type: string
            correlation_id:
              type: string
              minLength: 1
              maxLength: 64
  responses:
    AuthenticationRequired:
      description: Authentication required
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PermissionDenied:
      description: Permission denied
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DeviceNotFound:
      description: Device not found
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request validation failed
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidSourceData:
      description: Source returned invalid data
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SourceUnavailable:
      description: Source is unavailable or not configured
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: netsight_session
security:
  - sessionCookie: []
