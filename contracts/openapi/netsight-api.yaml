openapi: 3.1.0
info:
  title: Netsight Platform API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /auth/providers:
    get:
      summary: Public sign-in provider configuration state
      security: []
      responses:
        '200':
          description: Which identity providers are connected (never exposes secrets)
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvidersResponse'
  /overview:
    get:
      summary: Aggregate operational summary for the network overview page
      operationId: getOverview
      responses:
        '200':
          description: Canonical device health counts and per-source state
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /health:
    get:
      summary: Platform health
      security: []
      responses:
        '200':
          description: Healthy
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /sources/librenms/health:
    get:
      summary: Get the protected LibreNMS source health state
      operationId: getLibrenmsSourceHealth
      responses:
        '200':
          description: Current source health observation
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceHealthResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /devices:
    get:
      summary: List canonical devices
      operationId: listDevices
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Bounded page of canonical devices
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /devices/{device_id}:
    get:
      summary: Get a canonical device
      operationId: getDevice
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Canonical device detail
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetailResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /devices/{device_id}/interfaces:
    get:
      summary: List canonical interfaces for a device
      operationId: listDeviceInterfaces
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Canonical interface records
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterfaceListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /alerts:
    get:
      summary: List canonical alerts
      operationId: listAlerts
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Bounded page of canonical alerts
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /incidents:
    get:
      summary: List incidents
      responses:
        '200':
          description: Incident list
    post:
      summary: Create incident
      responses:
        '201':
          description: Created
  /diagnostics:
    post:
      summary: Start an approved read-only diagnostic workflow
      responses:
        '202':
          description: Diagnostic accepted
  /action-requests:
    post:
      summary: Propose a controlled remote action
      responses:
        '201':
          description: Action request created
  /action-requests/{action_id}/approve:
    post:
      summary: Approve an action request subject to policy and step-up authentication
      parameters:
        - in: path
          name: action_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approval recorded
components:
  headers:
    CorrelationId:
      description: Correlates the request, response and server-side workflow.
      schema:
        type: string
        minLength: 1
        maxLength: 64
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    DeviceStatusCount:
      type: object
      additionalProperties: false
      required: [status, count]
      properties:
        status:
          enum: [healthy, warning, degraded, critical, offline, unknown, maintenance]
        count:
          type: integer
          minimum: 0
    DeviceHealthSummary:
      type: object
      additionalProperties: false
      required: [total, by_status, freshness]
      properties:
        total:
          type: integer
          minimum: 0
        by_status:
          type: array
          items:
            $ref: '#/components/schemas/DeviceStatusCount'
        freshness:
          $ref: '#/components/schemas/Freshness'
    SourceState:
      type: object
      additionalProperties: false
      required: [configured, status]
      properties:
        configured:
          type: boolean
        status:
          enum: [success, unavailable, forbidden, invalid-source-data, not-configured]
    OverviewResponse:
      type: object
      additionalProperties: false
      required: [devices, sources]
      properties:
        devices:
          $ref: '#/components/schemas/DeviceHealthSummary'
        sources:
          type: object
          additionalProperties: false
          required: [librenms]
          properties:
            librenms:
              $ref: '#/components/schemas/SourceState'
    ProviderState:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured:
          type: boolean
    AuthProvidersResponse:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: object
          additionalProperties: false
          required: [microsoft, google]
          properties:
            microsoft:
              $ref: '#/components/schemas/ProviderState'
            google:
              $ref: '#/components/schemas/ProviderState'
    Freshness:
      $ref: '../json-schema/common.schema.json#/$defs/freshness'
    Device:
      $ref: '../json-schema/device.schema.json'
    DeviceListResponse:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, freshness]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        freshness:
          $ref: '#/components/schemas/Freshness'
    DeviceDetailResponse:
      type: object
      additionalProperties: false
      required: [item]
      properties:
        item:
          $ref: '#/components/schemas/Device'
    Alert:
      $ref: '../json-schema/alert.schema.json'
    Interface:
      $ref: '../json-schema/interface.schema.json'
    InterfaceListResponse:
      type: object
      additionalProperties: false
      required: [items, total, freshness]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Interface'
        total:
          type: integer
          minimum: 0
        freshness:
          $ref: '#/components/schemas/Freshness'
    AlertListResponse:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, freshness]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        freshness:
          $ref: '#/components/schemas/Freshness'
    SourceHealthResponse:
      type: object
      additionalProperties: false
      required: [source, status, reachable, latency_ms, checked_at, detail]
      properties:
        source:
          const: librenms
        status:
          enum: [success, unavailable, forbidden, invalid-source-data]
        reachable:
          type: boolean
        latency_ms:
          type: [number, 'null']
          minimum: 0
        checked_at:
          type: string
          format: date-time
        detail:
          enum: [ok, unavailable, forbidden, invalid-source-data]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
              pattern: '^[A-Z0-9_]+$'
            message:
              type: string
            correlation_id:
              type: string
              minLength: 1
              maxLength: 64
  responses:
    AuthenticationRequired:
      description: Authentication required
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PermissionDenied:
      description: Permission denied
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DeviceNotFound:
      description: Device not found
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request validation failed
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidSourceData:
      description: Source returned invalid data
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SourceUnavailable:
      description: Source is unavailable or not configured
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: netsight_session
security:
  - sessionCookie: []
