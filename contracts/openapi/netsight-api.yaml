openapi: 3.1.0
info:
  title: Netsight Platform API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /auth/providers:
    get:
      summary: Public sign-in provider configuration state
      security: []
      responses:
        '200':
          description: Which identity providers are connected (never exposes secrets)
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvidersResponse'
  /topology:
    get:
      summary: Explicit topology state (not connected until a topology source is configured)
      operationId: getTopology
      responses:
        '200':
          description: Topology state without fabricated nodes/edges
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /overview:
    get:
      summary: Aggregate operational summary for the network overview page
      operationId: getOverview
      responses:
        '200':
          description: Canonical device health counts and per-source state
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /health:
    get:
      summary: Platform health
      security: []
      responses:
        '200':
          description: Healthy
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /sources/librenms/health:
    get:
      summary: Get the protected LibreNMS source health state
      operationId: getLibrenmsSourceHealth
      responses:
        '200':
          description: Current source health observation
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceHealthResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /sources/netbox/health:
    get:
      summary: Get the protected NetBox source health state
      operationId: getNetboxSourceHealth
      responses:
        '200':
          description: Current source health observation
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceHealthResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /netbox/devices:
    get:
      summary: List canonical NetBox devices
      operationId: listNetboxDevices
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Bounded page of canonical NetBox devices
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /netbox/devices/{device_id}:
    get:
      summary: Get a canonical NetBox device
      operationId: getNetboxDevice
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Canonical NetBox device detail
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetailResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /reconcile/findings:
    get:
      summary: NetBox vs discovered LibreNMS reconciliation findings
      operationId: listReconciliationFindings
      responses:
        '200':
          description: Reconciliation findings between intended NetBox state and discovered LibreNMS devices
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationFindingsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /traffic/top-talkers:
    get:
      summary: Top traffic talkers (source addresses) for a bounded time window (explicit source state; needs traffic:read-detail)
      operationId: getTrafficTopTalkers
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Top talkers, or an explicit not-connected/unknown state without items
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficTopResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /traffic/top-destinations:
    get:
      summary: Top traffic destinations for a bounded time window (explicit source state; needs traffic:read)
      operationId: getTrafficTopDestinations
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Top destinations, or an explicit not-connected/unknown state without items
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficTopResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /traffic/flows:
    get:
      summary: "Flow Explorer: filtered flows with bounded aggregations and attribution by basis (explicit source state)"
      operationId: getTrafficFlows
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - in: query
          name: source_ip
          description: Exact IPv4 or IPv6 address (endpoint-level; needs traffic:read-detail).
          schema: {type: string, minLength: 2, maxLength: 45}
        - in: query
          name: destination_ip
          description: Exact IPv4 or IPv6 address (endpoint-level; needs traffic:read-detail).
          schema: {type: string, minLength: 2, maxLength: 45}
        - in: query
          name: device
          description: The flow exporter (reporting router or switch) as the flow source names it (endpoint-level; needs traffic:read-detail).
          schema: {type: string, minLength: 1, maxLength: 128}
        - in: query
          name: vlan
          description: Matches the source or destination VLAN (endpoint-level; needs traffic:read-detail).
          schema: {type: integer, minimum: 0, maximum: 4094}
        - in: query
          name: application
          description: Exact application name as the flow source reports it.
          schema: {type: string, minLength: 1, maxLength: 128}
        - in: query
          name: protocol
          schema: {enum: [tcp, udp, icmp, other]}
        - in: query
          name: port
          description: Matches the destination port (and the source port when the source reports it).
          schema: {type: integer, minimum: 0, maximum: 65535}
        - in: query
          name: country
          description: ISO 3166-1 alpha-2 code, upper case; matches the source or destination country.
          schema: {type: string, pattern: '^[A-Z]{2}$'}
        - in: query
          name: asn
          description: Matches the source or destination autonomous system number.
          schema: {type: integer, minimum: 1, maximum: 4294967295}
        - in: query
          name: direction
          description: Derived only from the source's own interface boundary classification.
          schema: {enum: [inbound, outbound, internal]}
      responses:
        '200':
          description: "Filtered flows and aggregations, or an explicit not-connected/unknown state without rows. Rows need traffic:read-detail; a caller without it receives the aggregations only, and only when at least the minimum cohort of source addresses (cohort.minimum) stands behind them: otherwise they are withheld and cohort.state is too-few-sources."
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficFlowsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: The read budget is busy; retry shortly
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /traffic/applications:
    get:
      summary: "Applications by volume with trend and operator-policy approval and risk (explicit source state)"
      operationId: getTrafficApplications
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: "Application rows, or an explicit not-connected/unknown state without rows"
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficApplicationsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: The read budget is busy; retry shortly
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /traffic/destinations:
    get:
      summary: "Destinations by volume with first and last seen and operator allow/deny reputation (explicit source state)"
      operationId: getTrafficDestinations
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: "Destination rows, or an explicit not-connected/unknown state without rows"
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficDestinationsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: The read budget is busy; retry shortly
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /traffic/anomalies:
    get:
      summary: "Deterministic same-hour-of-week baseline comparison (explicit source state; no ML)"
      operationId: getTrafficAnomalies
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: "Anomalies with baseline, observed value, difference and confidence; nothing is reported without a sufficient baseline"
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficAnomaliesResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: The read budget is busy; retry shortly
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /security/events:
    get:
      summary: Security events for a bounded time window (explicit source state)
      operationId: getSecurityEvents
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: Security events, or an explicit not-connected/unknown state without events
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityEventsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /devices:
    get:
      summary: List canonical devices
      operationId: listDevices
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Bounded page of canonical devices
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /devices/{device_id}:
    get:
      summary: Get a canonical device
      operationId: getDevice
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Canonical device detail
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetailResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /devices/{device_id}/interfaces:
    get:
      summary: List canonical interfaces for a device
      operationId: listDeviceInterfaces
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Canonical interface records
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterfaceListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /alerts:
    get:
      summary: List canonical alerts
      operationId: listAlerts
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Bounded page of canonical alerts
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /incidents:
    get:
      summary: List incidents (newest first; explicit store state)
      operationId: listIncidents
      parameters:
      - in: query
        name: state
        schema:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
      - in: query
        name: severity
        schema:
          enum:
          - low
          - medium
          - high
          - critical
      - in: query
        name: assignee_id
        schema:
          type: string
          minLength: 1
          maxLength: 255
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      responses:
        '200':
          description: Incident page, or an explicit not-connected/unknown state without rows
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /incidents/summary:
    get:
      summary: List incident summaries (Management view, newest first; explicit store state)
      description: Reduced rows for incidents:read-summary. No evidence ids, resolution text, timeline or
        assignee identity are ever returned; assigned only says whether somebody holds the incident.
      operationId: listIncidentSummaries
      parameters:
      - in: query
        name: state
        schema:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
      - in: query
        name: severity
        schema:
          enum:
          - low
          - medium
          - high
          - critical
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      responses:
        '200':
          description: Summary page, or an explicit not-connected/unknown state without rows
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentSummaryListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /incidents/{incident_id}:
    get:
      summary: Get one incident (explicit store state)
      operationId: getIncident
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      responses:
        '200':
          description: The incident, or an explicit not-connected/unknown state without it
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetailResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /incidents/{incident_id}/timeline:
    get:
      summary: Append-only incident timeline (bounded page)
      operationId: getIncidentTimeline
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
