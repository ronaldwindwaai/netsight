openapi: 3.1.0
info:
  title: Netsight Platform API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /auth/providers:
    get:
      summary: Public sign-in provider configuration state
      security: []
      responses:
        '200':
          description: Which identity providers are connected (never exposes secrets)
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvidersResponse'
  /topology:
    get:
      summary: Explicit topology state (not connected until a topology source is configured)
      operationId: getTopology
      responses:
        '200':
          description: Topology state without fabricated nodes/edges
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /overview:
    get:
      summary: Aggregate operational summary for the network overview page
      operationId: getOverview
      responses:
        '200':
          description: Canonical device health counts and per-source state
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /health:
    get:
      summary: Platform health
      security: []
      responses:
        '200':
          description: Healthy
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /sources/librenms/health:
    get:
      summary: Get the protected LibreNMS source health state
      operationId: getLibrenmsSourceHealth
      responses:
        '200':
          description: Current source health observation
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceHealthResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /sources/netbox/health:
    get:
      summary: Get the protected NetBox source health state
      operationId: getNetboxSourceHealth
      responses:
        '200':
          description: Current source health observation
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceHealthResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /netbox/devices:
    get:
      summary: List canonical NetBox devices
      operationId: listNetboxDevices
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Bounded page of canonical NetBox devices
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /netbox/devices/{device_id}:
    get:
      summary: Get a canonical NetBox device
      operationId: getNetboxDevice
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Canonical NetBox device detail
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetailResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /reconcile/findings:
    get:
      summary: NetBox vs discovered LibreNMS reconciliation findings
      operationId: listReconciliationFindings
      responses:
        '200':
          description: Reconciliation findings between intended NetBox state and discovered LibreNMS devices
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationFindingsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /traffic/top-talkers:
    get:
      summary: Top traffic talkers for a bounded time window (explicit source state)
      operationId: getTrafficTopTalkers
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Top talkers, or an explicit not-connected/unknown state without items
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficTopResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /traffic/top-destinations:
    get:
      summary: Top traffic destinations for a bounded time window (explicit source state)
      operationId: getTrafficTopDestinations
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Top destinations, or an explicit not-connected/unknown state without items
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficTopResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /traffic/flows:
    get:
      summary: Recent high-volume flows for a bounded time window (explicit source state)
      operationId: getTrafficFlows
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: High-volume flows, or an explicit not-connected/unknown state without flows
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficFlowsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /security/events:
    get:
      summary: Security events for a bounded time window (explicit source state)
      operationId: getSecurityEvents
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: Security events, or an explicit not-connected/unknown state without events
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityEventsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /devices:
    get:
      summary: List canonical devices
      operationId: listDevices
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Bounded page of canonical devices
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /devices/{device_id}:
    get:
      summary: Get a canonical device
      operationId: getDevice
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Canonical device detail
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetailResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /devices/{device_id}/interfaces:
    get:
      summary: List canonical interfaces for a device
      operationId: listDeviceInterfaces
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Canonical interface records
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterfaceListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /alerts:
    get:
      summary: List canonical alerts
      operationId: listAlerts
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Bounded page of canonical alerts
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /incidents:
    get:
      summary: List incidents (newest first; explicit store state)
      operationId: listIncidents
      parameters:
      - in: query
        name: state
        schema:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
      - in: query
        name: severity
        schema:
          enum:
          - low
          - medium
          - high
          - critical
      - in: query
        name: assignee_id
        schema:
          type: string
          minLength: 1
          maxLength: 255
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      responses:
        '200':
          description: Incident page, or an explicit not-connected/unknown state without rows
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /incidents/{incident_id}:
    get:
      summary: Get one incident (explicit store state)
      operationId: getIncident
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      responses:
        '200':
          description: The incident, or an explicit not-connected/unknown state without it
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetailResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /incidents/{incident_id}/timeline:
    get:
      summary: Append-only incident timeline (bounded page)
      operationId: getIncidentTimeline
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - in: query
        name: after_seq
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
      responses:
        '200':
          description: Timeline page, or an explicit not-connected/unknown state without events
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentTimelineResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /incidents/{incident_id}/acknowledge:
    post:
      summary: Acknowledge an open incident
      operationId: acknowledgeIncident
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - in: header
        name: X-CSRF-Token
        required: true
        description: Session CSRF token from GET /auth/csrf. Required for cookie-authenticated writes.
        schema:
          type: string
      responses:
        '200':
          description: Updated incident
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '409':
          $ref: '#/components/responses/IncidentConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /incidents/{incident_id}/transition:
    post:
      summary: Progress an incident one step (not resolve or reopen)
      operationId: transitionIncident
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - in: header
        name: X-CSRF-Token
        required: true
        description: Session CSRF token from GET /auth/csrf. Required for cookie-authenticated writes.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentTransitionRequest'
      responses:
        '200':
          description: Updated incident
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '409':
          $ref: '#/components/responses/IncidentConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /incidents/{incident_id}/assign:
    post:
      summary: Assign or unassign an incident
      operationId: assignIncident
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - in: header
        name: X-CSRF-Token
        required: true
        description: Session CSRF token from GET /auth/csrf. Required for cookie-authenticated writes.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentAssignRequest'
      responses:
        '200':
          description: Updated incident
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '409':
          $ref: '#/components/responses/IncidentConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /incidents/{incident_id}/comment:
    post:
      summary: Append a comment to the incident timeline
      operationId: commentIncident
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - in: header
        name: X-CSRF-Token
        required: true
        description: Session CSRF token from GET /auth/csrf. Required for cookie-authenticated writes.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentCommentRequest'
      responses:
        '201':
          description: The appended timeline event
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentTimelineEvent'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '409':
          $ref: '#/components/responses/IncidentConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /incidents/{incident_id}/evidence:
    post:
      summary: Attach an evidence reference (idempotent)
      operationId: addIncidentEvidence
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - in: header
        name: X-CSRF-Token
        required: true
        description: Session CSRF token from GET /auth/csrf. Required for cookie-authenticated writes.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentEvidenceRequest'
      responses:
        '200':
          description: Updated incident
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '409':
          $ref: '#/components/responses/IncidentConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /incidents/{incident_id}/resolve:
    post:
      summary: Resolve an incident (human principals only)
      operationId: resolveIncident
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - in: header
        name: X-CSRF-Token
        required: true
        description: Session CSRF token from GET /auth/csrf. Required for cookie-authenticated writes.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentResolveRequest'
      responses:
        '200':
          description: Updated incident
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '409':
          $ref: '#/components/responses/IncidentConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /incidents/{incident_id}/reopen:
    post:
      summary: Reopen a resolved or closed incident with a reason (human principals only)
      operationId: reopenIncident
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - in: header
        name: X-CSRF-Token
        required: true
        description: Session CSRF token from GET /auth/csrf. Required for cookie-authenticated writes.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentReopenRequest'
      responses:
        '200':
          description: Updated incident
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '409':
          $ref: '#/components/responses/IncidentConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /diagnostics:
    post:
      summary: Start an approved read-only diagnostic workflow
      responses:
        '202':
          description: Diagnostic accepted
  /action-requests:
    post:
      summary: Propose a controlled remote action
      responses:
        '201':
          description: Action request created
  /action-requests/{action_id}/approve:
    post:
      summary: Approve an action request subject to policy and step-up authentication
      parameters:
        - in: path
          name: action_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approval recorded
components:
  headers:
    CorrelationId:
      description: Correlates the request, response and server-side workflow.
      schema:
        type: string
        minLength: 1
        maxLength: 64
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    DeviceStatusCount:
      type: object
      additionalProperties: false
      required: [status, count]
      properties:
        status:
          enum: [healthy, warning, degraded, critical, offline, unknown, maintenance]
        count:
          type: integer
          minimum: 0
    DeviceHealthSummary:
      type: object
      additionalProperties: false
      required: [total, by_status, freshness]
      properties:
        total:
          type: integer
          minimum: 0
        by_status:
          type: array
          items:
            $ref: '#/components/schemas/DeviceStatusCount'
        freshness:
          $ref: '#/components/schemas/Freshness'
    SourceState:
      type: object
      additionalProperties: false
      required: [configured, status]
      properties:
        configured:
          type: boolean
        status:
          enum: [success, unavailable, forbidden, invalid-source-data, not-configured]
    OverviewResponse:
      type: object
      additionalProperties: false
      required: [devices, sources]
      properties:
        devices:
          $ref: '#/components/schemas/DeviceHealthSummary'
        sources:
          type: object
          additionalProperties: false
          required: [librenms, netbox]
          properties:
            librenms:
              $ref: '#/components/schemas/SourceState'
            netbox:
              $ref: '#/components/schemas/SourceState'
    ProviderState:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured:
          type: boolean
    AuthProvidersResponse:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: object
          additionalProperties: false
          required: [microsoft, google]
          properties:
            microsoft:
              $ref: '#/components/schemas/ProviderState'
            google:
              $ref: '#/components/schemas/ProviderState'
    Freshness:
      $ref: '../json-schema/common.schema.json#/$defs/freshness'
    Device:
      $ref: '../json-schema/device.schema.json'
    TopologyNode:
      type: object
      additionalProperties: false
      required: [device_id]
      properties:
        device_id:
          type: string
          minLength: 1
    TopologyEdge:
      type: object
      additionalProperties: false
      required: [source_device_id, target_device_id, source]
      properties:
        source_device_id:
          type: string
        target_device_id:
          type: string
        source:
          enum: [lldp, cdp, routing, switching, netbox, manual]
        observed_at:
          type: [string, 'null']
          format: date-time
    TopologyResponse:
      type: object
      additionalProperties: false
      required: [state, nodes, edges, freshness]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TopologyNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/TopologyEdge'
        freshness:
          $ref: '#/components/schemas/Freshness'
    ReconciliationFinding:
      type: object
      additionalProperties: false
      required: [kind, netbox_device_id, discovered_device_id, detail]
      properties:
        kind:
          enum: [missing-discovered, unknown-discovered, status-mismatch]
        netbox_device_id:
          type: [string, 'null']
        discovered_device_id:
          type: [string, 'null']
        detail:
          type: string
    ReconciliationFindingsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationFinding'
    TrafficTimeRange:
      type: object
      additionalProperties: false
      required: [from, to, preset]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        preset:
          type: [string, 'null']
          enum: [1h, 6h, 24h, 7d, null]
    TrafficItem:
      type: object
      additionalProperties: false
      required: [rank, subject_kind, subject_id, label, bytes, packets, share]
      properties:
        rank:
          type: integer
          minimum: 1
          maximum: 1000
        subject_kind:
          enum: [device, ip, user, application, domain, asn, interface]
        subject_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        label:
          type: string
          minLength: 1
          maxLength: 255
        bytes:
          type: integer
          minimum: 0
        packets:
          type: [integer, 'null']
          minimum: 0
        share:
          type: [number, 'null']
          minimum: 0
          maximum: 1
    TrafficTopResponse:
      type: object
      additionalProperties: false
      required: [state, dimension, time_range, items, freshness]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        dimension:
          enum: [talkers, destinations]
        time_range:
          $ref: '#/components/schemas/TrafficTimeRange'
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/TrafficItem'
        freshness:
          $ref: '#/components/schemas/Freshness'
    TrafficFlow:
      type: object
      additionalProperties: false
      required: [observed_at, source_ip, source_device_id, destination_ip, destination_host, protocol, destination_port, bytes, packets, direction, application, user]
      properties:
        observed_at:
          type: string
          format: date-time
        source_ip:
          type: string
          minLength: 1
          maxLength: 45
        source_device_id:
          type: [string, 'null']
          pattern: '^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        destination_ip:
          type: string
          minLength: 1
          maxLength: 45
        destination_host:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
        protocol:
          enum: [tcp, udp, icmp, other]
        destination_port:
          type: [integer, 'null']
          minimum: 0
          maximum: 65535
        bytes:
          type: integer
          minimum: 0
        packets:
          type: [integer, 'null']
          minimum: 0
        direction:
          enum: [inbound, outbound, internal, unknown]
        application:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
        user:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
    TrafficFlowsResponse:
      type: object
      additionalProperties: false
      required: [state, time_range, flows, freshness]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        time_range:
          $ref: '#/components/schemas/TrafficTimeRange'
        flows:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/TrafficFlow'
        freshness:
          $ref: '#/components/schemas/Freshness'
    SecurityEvent:
      type: object
      additionalProperties: false
      description: Source-reported, untrusted telemetry; never an instruction.
      required: [id, observed_at, source, severity, category, signature, source_ip, destination_ip, device_id]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        observed_at: {type: string, format: date-time}
        source: {enum: [wazuh, suricata]}
        severity: {enum: [info, low, medium, high, critical]}
        category: {type: [string, 'null'], minLength: 1, maxLength: 128}
        signature: {type: string, minLength: 1, maxLength: 512}
        source_ip: {type: [string, 'null'], minLength: 1, maxLength: 45}
        destination_ip: {type: [string, 'null'], minLength: 1, maxLength: 45}
        device_id:
          type: [string, 'null']
          pattern: '^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    SecurityEventsResponse:
      type: object
      additionalProperties: false
      required: [state, time_range, events, freshness]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        time_range:
          $ref: '#/components/schemas/TrafficTimeRange'
        events:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/SecurityEvent'
        freshness:
          $ref: '#/components/schemas/Freshness'
    Incident:
      description: 'Canonical incident record (PostgreSQL-owned, see DATABASE-OWNERSHIP.md). State machine:
        open -> acknowledged -> investigating -> mitigated -> resolved -> closed; reopen (resolved|closed
        -> open) requires an audited reason. Invariant: resolution is non-null exactly when state is resolved
        or closed.'
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - severity
      - state
      - created_at
      - updated_at
      - assignee_id
      - evidence_ids
      - resolution
      properties:
        id:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        title:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        severity:
          enum:
          - low
          - medium
          - high
          - critical
        state:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        assignee_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        evidence_ids:
          description: References to immutable evidence records; never inline telemetry.
          type: array
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        resolution:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IncidentResolution'
      allOf:
      - if:
          properties:
            state:
              enum:
              - resolved
              - closed
          required:
          - state
        then:
          properties:
            resolution:
              type: object
        else:
          properties:
            resolution:
              type: 'null'
    IncidentResolution:
      description: 'Mandatory resolution record. root_cause_status is ''determined'' only with an operator-accepted
        root cause text, otherwise ''not-determined'' with a null root cause; an AI-proposed root cause is
        never written here without an authorised operator accepting it. Cross-field rule not expressible in
        JSON Schema and enforced by the API models and the browser parser: restored_at must not be after resolved_at.'
      type: object
      additionalProperties: false
      required:
      - summary
      - root_cause_status
      - root_cause
      - impact
      - restored_at
      - resolved_at
      - resolved_by
      - follow_up_actions
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        root_cause_status:
          enum:
          - determined
          - not-determined
        root_cause:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 2000
          pattern: \S
        impact:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        restored_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        resolved_by:
          type: string
          minLength: 1
          maxLength: 255
        follow_up_actions:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: \S
      allOf:
      - if:
          properties:
            root_cause_status:
              const: determined
          required:
          - root_cause_status
        then:
          properties:
            root_cause:
              type: string
        else:
          properties:
            root_cause:
              type: 'null'
    IncidentTimelineEvent:
      description: 'One append-only timeline entry. The store exposes no update or delete path and the database
        rejects them. Rules: state_from/state_to are present exactly for state-changed; a transition to ''open''
        (reopen) requires reason; comment and resolution require message; every other kind except assignee-changed
        (null subject_id means unassigned) requires subject_id.'
      type: object
      additionalProperties: false
      required:
      - id
      - incident_id
      - seq
      - occurred_at
      - actor_id
      - kind
      - state_from
      - state_to
      - reason
      - message
      - subject_id
      properties:
        id:
          type: string
          minLength: 51
          maxLength: 51
          pattern: ^incident-event-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        incident_id:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        seq:
          type: integer
          minimum: 1
          maximum: 1000000
        occurred_at:
          type: string
          format: date-time
        actor_id:
          type: string
          minLength: 1
          maxLength: 255
        kind:
          enum:
          - alert-linked
          - alert-unlinked
          - assignee-changed
          - comment
          - diagnostic
          - action-proposed
          - action-approved
          - action-executed
          - evidence-added
          - state-changed
          - resolution
        state_from:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
          - null
        state_to:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
          - null
        reason:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 1000
          pattern: \S
        message:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 4000
          pattern: \S
        subject_id:
          description: 'Opaque reference: alert, diagnostic, action request, evidence record or (assignee-changed)
            the new assignee identity.'
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
      allOf:
      - if:
          properties:
            kind:
              const: state-changed
          required:
          - kind
        then:
          properties:
            state_from:
              type: string
            state_to:
              type: string
        else:
          properties:
            state_from:
              type: 'null'
            state_to:
              type: 'null'
      - if:
          properties:
            kind:
              const: state-changed
            state_to:
              const: open
          required:
          - kind
          - state_to
        then:
          properties:
            reason:
              type: string
      - if:
          properties:
            kind:
              enum:
              - comment
              - resolution
          required:
          - kind
        then:
          properties:
            message:
              type: string
      - if:
          properties:
            kind:
              enum:
              - alert-linked
              - alert-unlinked
              - diagnostic
              - action-proposed
              - action-approved
              - action-executed
              - evidence-added
          required:
          - kind
        then:
          properties:
            subject_id:
              type: string
    IncidentListResponse:
      description: One page of incidents, newest first. Paging is a server-capped offset (limit 1-100, offset
        0-10000); next_offset is null on the last page.
      type: object
      additionalProperties: false
      required:
      - state
      - incidents
      - limit
      - offset
      - next_offset
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        incidents:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Incident'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 10000
        next_offset:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            incidents:
              maxItems: 0
            next_offset:
              type: 'null'
    IncidentDetailResponse:
      description: One incident. incident is non-null exactly when state is ok; an unknown id is a 404, not
        a state.
      type: object
      additionalProperties: false
      required:
      - state
      - incident
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        incident:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Incident'
      allOf:
      - if:
          properties:
            state:
              const: ok
          required:
          - state
        then:
          properties:
            incident:
              type: object
        else:
          properties:
            incident:
              type: 'null'
    IncidentTimelineResponse:
      description: One page of an incident's append-only timeline in ascending seq order. Continue with after_seq
        = next_after_seq; next_after_seq is null on the last page.
      type: object
      additionalProperties: false
      required:
      - state
      - incident_id
      - events
      - after_seq
      - next_after_seq
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        incident_id:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        events:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/IncidentTimelineEvent'
        after_seq:
          type: integer
          minimum: 0
          maximum: 1000000
        next_after_seq:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            events:
              maxItems: 0
            next_after_seq:
              type: 'null'
    IncidentTransitionRequest:
      description: Progress an incident one step. Resolving and reopening have their own operations (resolve,
        reopen) because they need human-only permissions and mandatory fields.
      type: object
      additionalProperties: false
      required:
      - to_state
      properties:
        to_state:
          enum:
          - acknowledged
          - investigating
          - mitigated
          - closed
        reason:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 1000
          pattern: \S
    IncidentAssignRequest:
      description: Assign the incident to an identity, or null to unassign.
      type: object
      additionalProperties: false
      required:
      - assignee_id
      properties:
        assignee_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
    IncidentCommentRequest:
      description: Append a comment to the timeline. The text is stored and returned verbatim and is never
        interpreted.
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: \S
    IncidentEvidenceRequest:
      description: Attach an immutable evidence record reference. Idempotent.
      type: object
      additionalProperties: false
      required:
      - evidence_id
      properties:
        evidence_id:
          type: string
          minLength: 1
          maxLength: 128
    IncidentResolveRequest:
      description: Operator-supplied resolution (INCIDENT-ENGINE.md, Resolution). Human principals only. root_cause_status
        is 'determined' only with an operator-accepted root_cause text, otherwise 'not-determined' with a
        null root_cause. The server adds who and when; restored_at must not be after the server's resolved_at
        (not expressible in JSON Schema).
      type: object
      additionalProperties: false
      required:
      - summary
      - root_cause_status
      - root_cause
      - impact
      - restored_at
      - follow_up_actions
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        root_cause_status:
          enum:
          - determined
          - not-determined
        root_cause:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 2000
          pattern: \S
        impact:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        restored_at:
          type: string
          format: date-time
        follow_up_actions:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: \S
      allOf:
      - if:
          properties:
            root_cause_status:
              const: determined
          required:
          - root_cause_status
        then:
          properties:
            root_cause:
              type: string
        else:
          properties:
            root_cause:
              type: 'null'
    IncidentReopenRequest:
      description: Reopen a resolved or closed incident. A reason is mandatory and audited. Human principals
        only.
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
    AlertRule:
      description: 'Alert rule independent of any upstream alert product (ALERT-ENGINE.md). PostgreSQL-owned.
        A rule is created as a draft and becomes active only through explicit approval (natural-language or
        otherwise): status ''active'' requires approved_by and approved_at, ''draft'' forbids them, and approved_by/approved_at
        are always both set or both null. condition.operator ''matches'' takes a pattern (threshold null);
        every other operator takes a numeric threshold (pattern null).'
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - status
      - scope
      - condition
      - baseline_mode
      - window_seconds
      - for_seconds
      - cooldown_seconds
      - schedule
      - exceptions
      - severity
      - labels
      - actions
      - incident_policy
      - created_by
      - created_at
      - updated_at
      - approved_by
      - approved_at
      - version
      properties:
        id:
          type: string
          minLength: 47
          maxLength: 47
          pattern: ^alert-rule-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        status:
          enum:
          - draft
          - active
          - disabled
        scope:
          $ref: '#/components/schemas/AlertScope'
        condition:
          $ref: '#/components/schemas/AlertCondition'
        baseline_mode:
          description: 'none: compare against the threshold only; otherwise compare against the baseline detector
            output (AnomalySignal) in the given direction.'
          enum:
          - none
          - above-baseline
          - below-baseline
          - outside-baseline
        window_seconds:
          description: Aggregation window the condition is evaluated over.
          type: integer
          minimum: 60
          maximum: 86400
        for_seconds:
          description: Duration the condition must hold before firing (debounce); 0 fires immediately.
          type: integer
          minimum: 0
          maximum: 86400
        cooldown_seconds:
          type: integer
          minimum: 0
          maximum: 604800
        schedule:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AlertSchedule'
        exceptions:
          $ref: '#/components/schemas/AlertExceptions'
        severity:
          enum:
          - info
          - low
          - medium
          - high
          - critical
        labels:
          type: object
          maxProperties: 32
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,62}$
          additionalProperties:
            type: string
            maxLength: 128
        actions:
          description: Rule actions. These only create alerts and notifications; remote write actions go through
            the action framework, never through a rule.
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            enum:
            - create_alert
            - email
            - push
        incident_policy:
          enum:
          - none
          - create
          - group
        created_by:
          type: string
          minLength: 1
          maxLength: 255
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        approved_by:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        approved_at:
          type:
          - string
          - 'null'
          format: date-time
        version:
          description: Increments on every change; supports optimistic concurrency.
          type: integer
          minimum: 1
          maximum: 1000000
      allOf:
      - if:
          properties:
            status:
              const: active
          required:
          - status
        then:
          properties:
            approved_by:
              type: string
            approved_at:
              type: string
      - if:
          properties:
            status:
              const: draft
          required:
          - status
        then:
          properties:
            approved_by:
              type: 'null'
            approved_at:
              type: 'null'
      - if:
          properties:
            approved_by:
              type: string
          required:
          - approved_by
        then:
          properties:
            approved_at:
              type: string
        else:
          properties:
            approved_at:
              type: 'null'
    AlertScope:
      type: object
      additionalProperties: false
      required:
      - kind
      - ref
      properties:
        kind:
          enum:
          - organisation
          - site
          - device
          - device_group
          - vlan
          - user
          - service
        ref:
          description: Canonical identifier or group name of the scoped entity.
          type: string
          minLength: 1
          maxLength: 255
    AlertCondition:
      type: object
      additionalProperties: false
      required:
      - metric
      - operator
      - threshold
      - pattern
      properties:
        metric:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$
        operator:
          enum:
          - gt
          - gte
          - lt
          - lte
          - eq
          - ne
          - matches
        threshold:
          type:
          - number
          - 'null'
          minimum: -1000000000000000
          maximum: 1000000000000000
        pattern:
          description: Pattern for the 'matches' operator. Must be evaluated with a linear-time matcher, never
            a backtracking engine.
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
      allOf:
      - if:
          properties:
            operator:
              const: matches
          required:
          - operator
        then:
          properties:
            threshold:
              type: 'null'
            pattern:
              type: string
        else:
          properties:
            threshold:
              type: number
            pattern:
              type: 'null'
    AlertSchedule:
      description: Times of day when the rule is active, in the given IANA timezone. A window whose 'to' is
        earlier than 'from' crosses midnight; equal values mean the whole day.
      type: object
      additionalProperties: false
      required:
      - timezone
      - active
      properties:
        timezone:
          type: string
          maxLength: 64
          pattern: ^(UTC|[A-Za-z][A-Za-z0-9_+-]*(/[A-Za-z][A-Za-z0-9_+-]*){1,2})$
        active:
          type: array
          minItems: 1
          maxItems: 14
          items:
            $ref: '#/components/schemas/AlertScheduleEntry'
    AlertScheduleEntry:
      type: object
      additionalProperties: false
      required:
      - weekdays
      - from
      - to
      properties:
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            enum:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
        from:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        to:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    AlertExceptions:
      type: object
      additionalProperties: false
      required:
      - destinations
      - device_groups
      properties:
        destinations:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        device_groups:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    MaintenanceWindow:
      description: 'Maintenance suppresses notifications and actions for the scope but keeps evaluating and
        retaining evidence unless evaluation is ''disable''. Status is scheduled|cancelled; active/expired
        are derived from the clock and never stored. status ''cancelled'' requires cancelled_by and cancelled_at,
        ''scheduled'' forbids them. Cross-field rules not expressible in JSON Schema and enforced by the API
        models, the store and the browser parser: ends_at must be after starts_at and at most 30 days later.'
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - scope
      - starts_at
      - ends_at
      - evaluation
      - status
      - reason
      - created_by
      - created_at
      - cancelled_by
      - cancelled_at
      properties:
        id:
          type: string
          minLength: 48
          maxLength: 48
          pattern: ^maintenance-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        scope:
          $ref: '#/components/schemas/AlertScope'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        evaluation:
          enum:
          - retain
          - disable
        status:
          enum:
          - scheduled
          - cancelled
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
        created_by:
          type: string
          minLength: 1
          maxLength: 255
        created_at:
          type: string
          format: date-time
        cancelled_by:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        cancelled_at:
          type:
          - string
          - 'null'
          format: date-time
      allOf:
      - if:
          properties:
            status:
              const: cancelled
          required:
          - status
        then:
          properties:
            cancelled_by:
              type: string
            cancelled_at:
              type: string
        else:
          properties:
            cancelled_by:
              type: 'null'
            cancelled_at:
              type: 'null'
    DeviceListResponse:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, freshness]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        freshness:
          $ref: '#/components/schemas/Freshness'
    DeviceDetailResponse:
      type: object
      additionalProperties: false
      required: [item]
      properties:
        item:
          $ref: '#/components/schemas/Device'
    Alert:
      $ref: '../json-schema/alert.schema.json'
    Interface:
      $ref: '../json-schema/interface.schema.json'
    InterfaceListResponse:
      type: object
      additionalProperties: false
      required: [items, total, freshness]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Interface'
        total:
          type: integer
          minimum: 0
        freshness:
          $ref: '#/components/schemas/Freshness'
    AlertListResponse:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, freshness]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        freshness:
          $ref: '#/components/schemas/Freshness'
    SourceHealthResponse:
      type: object
      additionalProperties: false
      required: [source, status, reachable, latency_ms, checked_at, detail]
      properties:
        source:
          enum: [librenms, netbox]
        status:
          enum: [success, unavailable, forbidden, invalid-source-data]
        reachable:
          type: boolean
        latency_ms:
          type: [number, 'null']
          minimum: 0
        checked_at:
          type: string
          format: date-time
        detail:
          enum: [ok, unavailable, forbidden, invalid-source-data]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
              pattern: '^[A-Z0-9_]+$'
            message:
              type: string
            correlation_id:
              type: string
              minLength: 1
              maxLength: 64
  responses:
    AuthenticationRequired:
      description: Authentication required
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PermissionDenied:
      description: Permission denied
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DeviceNotFound:
      description: Device not found
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request validation failed
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidSourceData:
      description: Source returned invalid data
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SourceUnavailable:
      description: Source is unavailable or not configured
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IncidentNotFound:
      description: Incident not found
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IncidentConflict:
      description: The incident is not in a state that allows this change, or was changed concurrently
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    StoreUnavailable:
      description: Incident storage is not connected or temporarily unavailable
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: netsight_session
security:
  - sessionCookie: []
