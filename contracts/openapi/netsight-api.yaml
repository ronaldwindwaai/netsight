components:
  headers:
    CorrelationId:
      description: Correlates the request, response and server-side workflow.
      schema:
        type: string
        minLength: 1
        maxLength: 64
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    DeviceStatusCount:
      type: object
      additionalProperties: false
      required: [status, count]
      properties:
        status:
          enum: [healthy, warning, degraded, critical, offline, unknown, maintenance]
        count:
          type: integer
          minimum: 0
    DeviceHealthSummary:
      type: object
      additionalProperties: false
      required: [total, by_status, freshness]
      properties:
        total:
          type: integer
          minimum: 0
        by_status:
          type: array
          items:
            $ref: '#/components/schemas/DeviceStatusCount'
        freshness:
          $ref: '#/components/schemas/Freshness'
    SourceState:
      type: object
      additionalProperties: false
      required: [configured, status]
      properties:
        configured:
          type: boolean
        status:
          enum: [success, unavailable, forbidden, invalid-source-data, not-configured]
    OverviewResponse:
      type: object
      additionalProperties: false
      required: [devices, sources]
      properties:
        devices:
          $ref: '#/components/schemas/DeviceHealthSummary'
        sources:
          type: object
          additionalProperties: false
          required: [librenms, netbox]
          properties:
            librenms:
              $ref: '#/components/schemas/SourceState'
            netbox:
              $ref: '#/components/schemas/SourceState'
    ProviderState:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured:
          type: boolean
    AuthProvidersResponse:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: object
          additionalProperties: false
          required: [microsoft, google]
          properties:
            microsoft:
              $ref: '#/components/schemas/ProviderState'
            google:
              $ref: '#/components/schemas/ProviderState'
    Freshness:
      $ref: '../json-schema/common.schema.json#/$defs/freshness'
    Device:
      $ref: '../json-schema/device.schema.json'
    TopologyNode:
      type: object
      additionalProperties: false
      required: [device_id]
      properties:
        device_id:
          type: string
          minLength: 1
    TopologyEdge:
      type: object
      additionalProperties: false
      required: [source_device_id, target_device_id, source]
      properties:
        source_device_id:
          type: string
        target_device_id:
          type: string
        source:
          enum: [lldp, cdp, routing, switching, netbox, manual]
        observed_at:
          type: [string, 'null']
          format: date-time
    TopologyResponse:
      type: object
      additionalProperties: false
      required: [state, nodes, edges, freshness]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TopologyNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/TopologyEdge'
        freshness:
          $ref: '#/components/schemas/Freshness'
    ReconciliationFinding:
      type: object
      additionalProperties: false
      required: [kind, netbox_device_id, discovered_device_id, detail]
      properties:
        kind:
          enum: [missing-discovered, unknown-discovered, status-mismatch]
        netbox_device_id:
          type: [string, 'null']
        discovered_device_id:
          type: [string, 'null']
        detail:
          type: string
    ReconciliationFindingsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationFinding'
    TrafficTimeRange:
      type: object
      additionalProperties: false
      required: [from, to, preset]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        preset:
          type: [string, 'null']
          enum: [1h, 6h, 24h, 7d, null]
    TrafficItem:
      type: object
      additionalProperties: false
      required: [rank, subject_kind, subject_id, label, bytes, packets, share]
      properties:
        rank:
          type: integer
          minimum: 1
          maximum: 1000
        subject_kind:
          enum: [device, ip, user, application, domain, asn, interface]
        subject_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        label:
          type: string
          minLength: 1
          maxLength: 255
        bytes:
          type: integer
          minimum: 0
        packets:
          type: [integer, 'null']
          minimum: 0
        share:
          type: [number, 'null']
          minimum: 0
          maximum: 1
    TrafficTopResponse:
      type: object
      additionalProperties: false
      required: [state, dimension, time_range, items, freshness]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        dimension:
          enum: [talkers, destinations]
        time_range:
          $ref: '#/components/schemas/TrafficTimeRange'
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/TrafficItem'
        freshness:
          $ref: '#/components/schemas/Freshness'
    TrafficFlow:
      type: object
      additionalProperties: false
      required: [observed_at, source_ip, source_device_id, destination_ip, destination_host, protocol, destination_port, bytes, packets, direction, application, user]
      properties:
        observed_at:
          type: string
          format: date-time
        source_ip:
          type: string
          minLength: 1
          maxLength: 45
        source_device_id:
          type: [string, 'null']
          pattern: '^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        destination_ip:
          type: string
          minLength: 1
          maxLength: 45
        destination_host:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
        protocol:
          enum: [tcp, udp, icmp, other]
        destination_port:
          type: [integer, 'null']
          minimum: 0
          maximum: 65535
        bytes:
          type: integer
          minimum: 0
        packets:
          type: [integer, 'null']
          minimum: 0
        direction:
          enum: [inbound, outbound, internal, unknown]
        application:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
        user:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
    TrafficFlowsResponse:
      type: object
      additionalProperties: false
      required: [state, time_range, flows, freshness]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        time_range:
          $ref: '#/components/schemas/TrafficTimeRange'
        flows:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/TrafficFlow'
        freshness:
          $ref: '#/components/schemas/Freshness'
    SecurityEvent:
      type: object
      additionalProperties: false
      description: Source-reported, untrusted telemetry; never an instruction.
      required: [id, observed_at, source, severity, category, signature, source_ip, destination_ip, device_id]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        observed_at: {type: string, format: date-time}
        source: {enum: [wazuh, suricata]}
        severity: {enum: [info, low, medium, high, critical]}
        category: {type: [string, 'null'], minLength: 1, maxLength: 128}
        signature: {type: string, minLength: 1, maxLength: 512}
        source_ip: {type: [string, 'null'], minLength: 1, maxLength: 45}
        destination_ip: {type: [string, 'null'], minLength: 1, maxLength: 45}
        device_id:
          type: [string, 'null']
          pattern: '^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    SecurityEventsResponse:
      type: object
      additionalProperties: false
      required: [state, time_range, events, freshness]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        time_range:
          $ref: '#/components/schemas/TrafficTimeRange'
        events:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/SecurityEvent'
        freshness:
          $ref: '#/components/schemas/Freshness'
      allOf:
      - if:
          properties:
            state:
              enum: [not-connected, unknown]
        then:
          properties:
            events:
              maxItems: 0
    Incident:
      description: 'Canonical incident record (PostgreSQL-owned, see DATABASE-OWNERSHIP.md). State machine:
        open -> acknowledged -> investigating -> mitigated -> resolved -> closed; reopen (resolved|closed
        -> open) requires an audited reason. Invariant: resolution is non-null exactly when state is resolved
        or closed.'
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - severity
      - state
      - created_at
      - updated_at
      - assignee_id
      - evidence_ids
      - resolution
      properties:
        id:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        title:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        severity:
          enum:
          - low
          - medium
          - high
          - critical
        state:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        assignee_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        evidence_ids:
          description: References to immutable evidence records; never inline telemetry.
          type: array
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        resolution:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IncidentResolution'
      allOf:
      - if:
          properties:
            state:
              enum:
              - resolved
              - closed
          required:
          - state
        then:
          properties:
            resolution:
              type: object
        else:
          properties:
            resolution:
              type: 'null'
    IncidentResolution:
      description: 'Mandatory resolution record. root_cause_status is ''determined'' only with an operator-accepted
        root cause text, otherwise ''not-determined'' with a null root cause; an AI-proposed root cause is
        never written here without an authorised operator accepting it. Cross-field rule not expressible in
        JSON Schema and enforced by the API models and the browser parser: restored_at must not be after resolved_at.'
      type: object
      additionalProperties: false
      required:
      - summary
      - root_cause_status
      - root_cause
      - impact
      - restored_at
      - resolved_at
      - resolved_by
      - follow_up_actions
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        root_cause_status:
          enum:
          - determined
          - not-determined
        root_cause:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 2000
          pattern: \S
        impact:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        restored_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        resolved_by:
          type: string
          minLength: 1
          maxLength: 255
        follow_up_actions:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: \S
      allOf:
      - if:
          properties:
            root_cause_status:
              const: determined
          required:
          - root_cause_status
        then:
          properties:
            root_cause:
              type: string
        else:
          properties:
            root_cause:
              type: 'null'
    IncidentTimelineEvent:
      description: 'One append-only timeline entry. The store exposes no update or delete path and the database
        rejects them. Rules: state_from/state_to are present exactly for state-changed; a transition to ''open''
        (reopen) requires reason; comment and resolution require message; every other kind except assignee-changed
        (null subject_id means unassigned) requires subject_id.'
      type: object
      additionalProperties: false
      required:
      - id
      - incident_id
      - seq
      - occurred_at
      - actor_id
      - kind
      - state_from
      - state_to
      - reason
      - message
      - subject_id
      properties:
        id:
          type: string
          minLength: 51
          maxLength: 51
          pattern: ^incident-event-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        incident_id:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        seq:
          type: integer
          minimum: 1
          maximum: 1000000
        occurred_at:
          type: string
          format: date-time
        actor_id:
          type: string
          minLength: 1
          maxLength: 255
        kind:
          enum:
          - alert-linked
          - alert-unlinked
          - assignee-changed
          - comment
          - diagnostic
          - action-proposed
          - action-approved
          - action-executed
          - evidence-added
          - state-changed
          - resolution
        state_from:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
          - null
        state_to:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
          - null
        reason:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 1000
          pattern: \S
        message:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 4000
          pattern: \S
        subject_id:
          description: 'Opaque reference: alert, diagnostic, action request, evidence record or (assignee-changed)
            the new assignee identity.'
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
      allOf:
      - if:
          properties:
            kind:
              const: state-changed
          required:
          - kind
        then:
          properties:
            state_from:
              type: string
            state_to:
              type: string
        else:
          properties:
            state_from:
              type: 'null'
            state_to:
              type: 'null'
      - if:
          properties:
            kind:
              const: state-changed
            state_to:
              const: open
          required:
          - kind
          - state_to
        then:
          properties:
            reason:
              type: string
      - if:
          properties:
            kind:
              enum:
              - comment
              - resolution
          required:
          - kind
        then:
          properties:
            message:
              type: string
      - if:
          properties:
            kind:
              enum:
              - alert-linked
              - alert-unlinked
              - diagnostic
              - action-proposed
              - action-approved
              - action-executed
              - evidence-added
          required:
          - kind
        then:
          properties:
            subject_id:
              type: string
    IncidentListResponse:
      description: One page of incidents, newest first. Paging is a server-capped offset (limit 1-100, offset
        0-10000); next_offset is null on the last page.
      type: object
      additionalProperties: false
      required:
      - state
      - incidents
      - limit
      - offset
      - next_offset
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        incidents:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Incident'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 10000
        next_offset:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            incidents:
              maxItems: 0
            next_offset:
              type: 'null'
    IncidentSummary:
      description: Reduced incident view for the Management role. Omits evidence_ids, the resolution record
        (free text and resolver identity) and assignee_id by design; assigned only says whether somebody
        holds the incident. resolved_at is non-null exactly when state is resolved or closed.
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - severity
      - state
      - created_at
      - updated_at
      - assigned
      - resolved_at
      properties:
        id:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        title:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        severity:
          enum:
          - low
          - medium
          - high
          - critical
        state:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        assigned:
          type: boolean
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
      allOf:
      - if:
          properties:
            state:
              enum:
              - resolved
              - closed
          required:
          - state
        then:
          properties:
            resolved_at:
              type: string
        else:
          properties:
            resolved_at:
              type: 'null'
    IncidentSummaryListResponse:
      description: One page of incident summaries, newest first (the Management view, incidents:read-summary).
        Same paging and degraded-state rules as IncidentListResponse; rows carry no evidence ids, resolution
        text, timeline or assignee identity.
      type: object
      additionalProperties: false
      required:
      - state
      - incidents
      - limit
      - offset
      - next_offset
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        incidents:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/IncidentSummary'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 10000
        next_offset:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            incidents:
              maxItems: 0
            next_offset:
              type: 'null'
    IncidentDetailResponse:
      description: One incident. incident is non-null exactly when state is ok; an unknown id is a 404, not
        a state.
      type: object
      additionalProperties: false
      required:
      - state
      - incident
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        incident:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Incident'
      allOf:
      - if:
          properties:
            state:
              const: ok
          required:
          - state
        then:
          properties:
            incident:
              type: object
        else:
          properties:
            incident:
              type: 'null'
    IncidentTimelineResponse:
      description: One page of an incident's append-only timeline in ascending seq order. Continue with after_seq
        = next_after_seq; next_after_seq is null on the last page.
      type: object
      additionalProperties: false
      required:
      - state
      - incident_id
      - events
      - after_seq
      - next_after_seq
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        incident_id:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        events:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/IncidentTimelineEvent'
        after_seq:
          type: integer
          minimum: 0
          maximum: 1000000
        next_after_seq:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            events:
              maxItems: 0
            next_after_seq:
              type: 'null'
    IncidentTransitionRequest:
      description: Progress an incident one step. Resolving and reopening have their own operations (resolve,
        reopen) because they need human-only permissions and mandatory fields.
      type: object
      additionalProperties: false
      required:
      - to_state
      properties:
        to_state:
          enum:
          - acknowledged
          - investigating
          - mitigated
          - closed
        reason:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 1000
          pattern: \S
    IncidentAssignRequest:
      description: Assign the incident to an identity, or null to unassign.
      type: object
      additionalProperties: false
      required:
      - assignee_id
      properties:
        assignee_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
    IncidentCommentRequest:
      description: Append a comment to the timeline. The text is stored and returned verbatim and is never
        interpreted.
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: \S
    IncidentEvidenceRequest:
      description: Attach an immutable evidence record reference. Idempotent.
      type: object
      additionalProperties: false
      required:
      - evidence_id
      properties:
        evidence_id:
          type: string
          minLength: 1
          maxLength: 128
    IncidentResolveRequest:
      description: Operator-supplied resolution (INCIDENT-ENGINE.md, Resolution). Human principals only. root_cause_status
        is 'determined' only with an operator-accepted root_cause text, otherwise 'not-determined' with a
        null root_cause. The server adds who and when; restored_at must not be after the server's resolved_at
        (not expressible in JSON Schema).
      type: object
      additionalProperties: false
      required:
      - summary
      - root_cause_status
      - root_cause
      - impact
      - restored_at
      - follow_up_actions
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        root_cause_status:
          enum:
          - determined
          - not-determined
        root_cause:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 2000
          pattern: \S
        impact:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        restored_at:
          type: string
          format: date-time
        follow_up_actions:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: \S
      allOf:
      - if:
          properties:
            root_cause_status:
              const: determined
          required:
          - root_cause_status
        then:
          properties:
            root_cause:
              type: string
        else:
          properties:
            root_cause:
              type: 'null'
    IncidentReopenRequest:
      description: Reopen a resolved or closed incident. A reason is mandatory and audited. Human principals
        only.
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
    AlertRule:
      description: 'Alert rule independent of any upstream alert product (ALERT-ENGINE.md). PostgreSQL-owned.
        A rule is created as a draft and becomes active only through explicit approval (natural-language or
        otherwise): status ''active'' requires approved_by and approved_at, ''draft'' forbids them, and approved_by/approved_at
        are always both set or both null. condition.operator ''matches'' takes a pattern (threshold null);
        every other operator takes a numeric threshold (pattern null).'
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - status
      - scope
      - condition
      - baseline_mode
      - window_seconds
      - for_seconds
      - cooldown_seconds
      - schedule
      - exceptions
      - severity
      - labels
      - actions
      - incident_policy
      - created_by
      - created_at
      - updated_at
      - approved_by
      - approved_at
      - version
      properties:
        id:
          type: string
          minLength: 47
          maxLength: 47
          pattern: ^alert-rule-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        status:
          enum:
          - draft
          - active
          - disabled
        scope:
          $ref: '#/components/schemas/AlertScope'
        condition:
          $ref: '#/components/schemas/AlertCondition'
        baseline_mode:
          description: 'none: compare against the threshold only; otherwise compare against the baseline detector
            output (AnomalySignal) in the given direction.'
          enum:
          - none
          - above-baseline
          - below-baseline
          - outside-baseline
        window_seconds:
          description: Aggregation window the condition is evaluated over.
          type: integer
          minimum: 60
          maximum: 86400
        for_seconds:
          description: Duration the condition must hold before firing (debounce); 0 fires immediately.
          type: integer
          minimum: 0
          maximum: 86400
        cooldown_seconds:
          type: integer
          minimum: 0
          maximum: 604800
        schedule:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AlertSchedule'
        exceptions:
          $ref: '#/components/schemas/AlertExceptions'
        severity:
          enum:
          - info
          - low
          - medium
          - high
          - critical
        labels:
          type: object
          maxProperties: 32
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,62}$
          additionalProperties:
            type: string
            maxLength: 128
        actions:
          description: Rule actions. These only create alerts and notifications; remote write actions go through
            the action framework, never through a rule.
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            enum:
            - create_alert
            - email
            - push
        incident_policy:
          enum:
          - none
          - create
          - group
        created_by:
          type: string
          minLength: 1
          maxLength: 255
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        approved_by:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        approved_at:
          type:
          - string
          - 'null'
          format: date-time
        version:
          description: Increments on every change; supports optimistic concurrency.
          type: integer
          minimum: 1
          maximum: 1000000
      allOf:
      - if:
          properties:
            status:
              const: active
          required:
          - status
        then:
          properties:
            approved_by:
              type: string
            approved_at:
              type: string
      - if:
          properties:
            status:
              const: draft
          required:
          - status
        then:
          properties:
            approved_by:
              type: 'null'
            approved_at:
              type: 'null'
      - if:
          properties:
            approved_by:
              type: string
          required:
          - approved_by
        then:
          properties:
            approved_at:
              type: string
        else:
          properties:
            approved_at:
              type: 'null'
    AlertScope:
      type: object
      additionalProperties: false
      required:
      - kind
      - ref
      properties:
        kind:
          enum:
          - organisation
          - site
          - device
          - device_group
          - vlan
          - user
          - service
        ref:
          description: Canonical identifier or group name of the scoped entity.
          type: string
          minLength: 1
          maxLength: 255
    AlertCondition:
      type: object
      additionalProperties: false
      required:
      - metric
      - operator
      - threshold
      - pattern
      properties:
        metric:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$
        operator:
          enum:
          - gt
          - gte
          - lt
          - lte
          - eq
          - ne
          - matches
        threshold:
          type:
          - number
          - 'null'
          minimum: -1000000000000000
          maximum: 1000000000000000
        pattern:
          description: Pattern for the 'matches' operator. Must be evaluated with a linear-time matcher, never
            a backtracking engine.
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
      allOf:
      - if:
          properties:
            operator:
              const: matches
          required:
          - operator
        then:
          properties:
            threshold:
              type: 'null'
            pattern:
              type: string
        else:
          properties:
            threshold:
              type: number
            pattern:
              type: 'null'
    AlertSchedule:
      description: Times of day when the rule is active, in the given IANA timezone. A window whose 'to' is
        earlier than 'from' crosses midnight; equal values mean the whole day.
      type: object
      additionalProperties: false
      required:
      - timezone
      - active
      properties:
        timezone:
          type: string
          maxLength: 64
          pattern: ^(UTC|[A-Za-z][A-Za-z0-9_+-]*(/[A-Za-z][A-Za-z0-9_+-]*){1,2})$
        active:
          type: array
          minItems: 1
          maxItems: 14
          items:
            $ref: '#/components/schemas/AlertScheduleEntry'
    AlertScheduleEntry:
      type: object
      additionalProperties: false
      required:
      - weekdays
      - from
      - to
      properties:
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            enum:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
        from:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        to:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    AlertExceptions:
      type: object
      additionalProperties: false
      required:
      - destinations
      - device_groups
      properties:
        destinations:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        device_groups:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    MaintenanceWindow:
      description: 'Maintenance suppresses notifications and actions for the scope but keeps evaluating and
        retaining evidence unless evaluation is ''disable''. Status is scheduled|cancelled; active/expired
        are derived from the clock and never stored. status ''cancelled'' requires cancelled_by and cancelled_at,
        ''scheduled'' forbids them. Cross-field rules not expressible in JSON Schema and enforced by the API
        models, the store and the browser parser: ends_at must be after starts_at and at most 30 days later.'
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - scope
      - starts_at
      - ends_at
      - evaluation
      - status
      - reason
      - created_by
      - created_at
      - cancelled_by
      - cancelled_at
      properties:
        id:
          type: string
          minLength: 48
          maxLength: 48
          pattern: ^maintenance-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        scope:
          $ref: '#/components/schemas/AlertScope'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        evaluation:
          enum:
          - retain
          - disable
        status:
          enum:
          - scheduled
          - cancelled
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
        created_by:
          type: string
          minLength: 1
          maxLength: 255
        created_at:
          type: string
          format: date-time
        cancelled_by:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        cancelled_at:
          type:
          - string
          - 'null'
          format: date-time
      allOf:
      - if:
          properties:
            status:
              const: cancelled
          required:
          - status
        then:
          properties:
            cancelled_by:
              type: string
            cancelled_at:
              type: string
        else:
          properties:
            cancelled_by:
              type: 'null'
            cancelled_at:
              type: 'null'
    AlertRuleDefinition:
      description: 'Operator-editable rule fields: the body of a create request and the definition of an update
        or dry-run. Lifecycle and audit fields (id, status, version, created_*, approved_*) are server-owned
        and rejected here. A new rule is always a draft; it becomes active only through the approve operation.'
      type: object
      additionalProperties: false
      required:
      - name
      - scope
      - condition
      - baseline_mode
      - window_seconds
      - for_seconds
      - cooldown_seconds
      - schedule
      - exceptions
      - severity
      - labels
      - actions
      - incident_policy
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        scope:
          $ref: '#/components/schemas/AlertScope'
        condition:
          $ref: '#/components/schemas/AlertCondition'
        baseline_mode:
          description: 'none: compare against the threshold only; otherwise compare against the baseline detector
            output (AnomalySignal) in the given direction.'
          enum:
          - none
          - above-baseline
          - below-baseline
          - outside-baseline
        window_seconds:
          description: Aggregation window the condition is evaluated over.
          type: integer
          minimum: 60
          maximum: 86400
        for_seconds:
          description: Duration the condition must hold before firing (debounce); 0 fires immediately.
          type: integer
          minimum: 0
          maximum: 86400
        cooldown_seconds:
          type: integer
          minimum: 0
          maximum: 604800
        schedule:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AlertSchedule'
        exceptions:
          $ref: '#/components/schemas/AlertExceptions'
        severity:
          enum:
          - info
          - low
          - medium
          - high
          - critical
        labels:
          type: object
          maxProperties: 32
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,62}$
          additionalProperties:
            type: string
            maxLength: 128
        actions:
          description: Rule actions. These only create alerts and notifications; remote write actions go through
            the action framework, never through a rule.
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            enum:
            - create_alert
            - email
            - push
        incident_policy:
          enum:
          - none
          - create
          - group
    AlertRuleListResponse:
      description: One page of alert rules, newest first. Paging is a server-capped offset (limit 1-100, offset
        0-10000); next_offset is null on the last page. not-connected and unknown never carry rows or a cursor.
      type: object
      additionalProperties: false
      required:
      - state
      - rules
      - limit
      - offset
      - next_offset
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        rules:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AlertRule'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 10000
        next_offset:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            rules:
              maxItems: 0
            next_offset:
              type: 'null'
    AlertRuleDetailResponse:
      description: One alert rule. rule is non-null exactly when state is ok; an unknown id is a 404, not
        a state.
      type: object
      additionalProperties: false
      required:
      - state
      - rule
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        rule:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AlertRule'
      allOf:
      - if:
          properties:
            state:
              const: ok
          required:
          - state
        then:
          properties:
            rule:
              type: object
        else:
          properties:
            rule:
              type: 'null'
    AlertRuleUpdateRequest:
      description: 'Replace the definition of a draft or disabled rule. expected_version is the version the
        editor loaded; the edit is refused with 409 when the stored version differs, and an active rule must
        be disabled first. An edit always returns the rule to draft: it must be approved again.'
      type: object
      additionalProperties: false
      required:
      - expected_version
      - definition
      properties:
        expected_version:
          type: integer
          minimum: 1
          maximum: 1000000
        definition:
          $ref: '#/components/schemas/AlertRuleDefinition'
    AlertRuleApproveRequest:
      description: Approve (activate) exactly the version the reviewer saw. A rule changed since then is refused
        with 409; an invalid rule is refused with 422 and stays inactive.
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version:
          type: integer
          minimum: 1
          maximum: 1000000
    MaintenanceWindowListResponse:
      description: One page of maintenance windows ordered by start time. Same paging and not-connected/unknown
        rules as the rule list.
      type: object
      additionalProperties: false
      required:
      - state
      - windows
      - limit
      - offset
      - next_offset
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        windows:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MaintenanceWindow'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 10000
        next_offset:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            windows:
              maxItems: 0
            next_offset:
              type: 'null'
    MaintenanceWindowDetailResponse:
      description: One maintenance window. window is non-null exactly when state is ok.
      type: object
      additionalProperties: false
      required:
      - state
      - window
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        window:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MaintenanceWindow'
      allOf:
      - if:
          properties:
            state:
              const: ok
          required:
          - state
        then:
          properties:
            window:
              type: object
        else:
          properties:
            window:
              type: 'null'
    MaintenanceWindowCreateRequest:
      description: 'Schedule a maintenance window. Cross-field rules not expressible in JSON Schema and enforced
        by the API models and the browser parser: ends_at must be after starts_at, at most 30 days later,
        ends_at must be in the future and starts_at at most one year ahead. A window with organisation scope
        needs a separate permission.'
      type: object
      additionalProperties: false
      required:
      - name
      - scope
      - starts_at
      - ends_at
      - evaluation
      - reason
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        scope:
          $ref: '#/components/schemas/AlertScope'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        evaluation:
          enum:
          - retain
          - disable
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
    AlertRuleEvaluateObservation:
      description: One reading of one monitored entity. All text is untrusted data used only for comparison.
      type: object
      additionalProperties: false
      required:
      - at
      - entity
      - scopes
      - value
      - text
      - anomaly
      - destination
      - device_groups
      properties:
        at:
          type: string
          format: date-time
        entity:
          type: string
          minLength: 1
          maxLength: 255
        scopes:
          description: Every scope the entity belongs to; the rule only sees entities inside its own scope.
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AlertScope'
        value:
          type:
          - number
          - 'null'
          minimum: -1000000000000000
          maximum: 1000000000000000
        text:
          type:
          - string
          - 'null'
          maxLength: 4096
        anomaly:
          enum:
          - above
          - below
          - normal
          - null
        destination:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        device_groups:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    AlertRuleEvaluateWindow:
      description: A sample maintenance window supplied for the dry-run (nothing is read from the store).
        ends_at must be after starts_at and at most 30 days later (API models and parser).
      type: object
      additionalProperties: false
      required:
      - scope
      - starts_at
      - ends_at
      - evaluation
      - status
      properties:
        scope:
          $ref: '#/components/schemas/AlertScope'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        evaluation:
          enum:
          - retain
          - disable
        status:
          enum:
          - scheduled
          - cancelled
    AlertRuleEvaluateRequest:
      description: 'Replay observations through a rule definition at fixed times, with no external effect:
        nothing is stored, sent or created. Observations must be in strictly ascending time order (API models
        and parser); each is judged at its own timestamp, so schedules, maintenance windows, for and cooldown
        are all derived from the supplied times. The combined length of all observation text is at most 262144
        characters (API models and parser).'
      type: object
      additionalProperties: false
      required:
      - definition
      - observations
      - windows
      properties:
        definition:
          $ref: '#/components/schemas/AlertRuleDefinition'
        observations:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/AlertRuleEvaluateObservation'
        windows:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AlertRuleEvaluateWindow'
    AlertRuleEvaluateProblem:
      description: A static configuration problem code and the contract field it concerns.
      type: object
      additionalProperties: false
      required:
      - code
      - field
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Z0-9_]+$
        field:
          type: string
          minLength: 1
          maxLength: 64
    AlertRuleEvaluateResult:
      description: The engine decision for one observation. notify means a notification would be released;
        blocked_by says why a firing alert was not notified. maintenance_windows are indexes into the supplied
        windows.
      type: object
      additionalProperties: false
      required:
      - at
      - outcome
      - phase
      - transition
      - notify
      - blocked_by
      - maintenance_windows
      properties:
        at:
          type: string
          format: date-time
        outcome:
          enum:
          - firing
          - pending
          - not-met
          - excepted
          - outside-schedule
          - no-data
          - out-of-scope
          - stale
          - future
          - maintenance-disabled
          - invalid-config
          - rule-not-active
        phase:
          enum:
          - inactive
          - pending
          - firing
        transition:
          enum:
          - fired
          - resolved
          - null
        notify:
          type: boolean
        blocked_by:
          enum:
          - maintenance
          - cooldown
          - null
        maintenance_windows:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 19
    AlertRuleEvaluateResponse:
      description: 'Dry-run verdict. valid is false when the definition cannot be evaluated here (fail closed):
        problems then lists why and results is empty. Otherwise problems is empty and results holds one decision
        per observation, in order. The dry-run is read-only.'
      type: object
      additionalProperties: false
      required:
      - valid
      - problems
      - results
      properties:
        valid:
          type: boolean
        problems:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/AlertRuleEvaluateProblem'
        results:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AlertRuleEvaluateResult'
      allOf:
      - if:
          properties:
            valid:
              const: true
          required:
          - valid
        then:
          properties:
            problems:
              maxItems: 0
        else:
          properties:
            problems:
              minItems: 1
            results:
              maxItems: 0
    DeviceListResponse:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, freshness]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        freshness:
          $ref: '#/components/schemas/Freshness'
    DeviceDetailResponse:
      type: object
      additionalProperties: false
      required: [item]
      properties:
        item:
          $ref: '#/components/schemas/Device'
    Alert:
      $ref: '../json-schema/alert.schema.json'
    Interface:
      $ref: '../json-schema/interface.schema.json'
    InterfaceListResponse:
      type: object
      additionalProperties: false
      required: [items, total, freshness]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Interface'
        total:
          type: integer
          minimum: 0
        freshness:
          $ref: '#/components/schemas/Freshness'
    AlertListResponse:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, freshness]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        freshness:
          $ref: '#/components/schemas/Freshness'
    SourceHealthResponse:
      type: object
      additionalProperties: false
      required: [source, status, reachable, latency_ms, checked_at, detail]
      properties:
        source:
          enum: [librenms, netbox]
        status:
          enum: [success, unavailable, forbidden, invalid-source-data]
        reachable:
          type: boolean
        latency_ms:
          type: [number, 'null']
          minimum: 0
        checked_at:
          type: string
          format: date-time
        detail:
          enum: [ok, unavailable, forbidden, invalid-source-data]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
              pattern: '^[A-Z0-9_]+$'
            message:
              type: string
            correlation_id:
              type: string
              minLength: 1
              maxLength: 64
    DiagnosticFinding:
      type: object
      additionalProperties: false
      required: [statement, evidence_ids]
      properties:
        statement:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '\S'
        evidence_ids:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 128
    DiagnosticProbeResult:
      type: object
      additionalProperties: false
      required: [id, kind, label, status, vantage, location, port, latency_ms, detail, observed_at, evidence_id]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        kind:
          enum: [identity, source-freshness, target-health, dns, icmp, tcp, http, https, service, dependencies, recent-changes, baseline]
        label: {type: string, minLength: 1, maxLength: 255, pattern: \S}
        status:
          enum: [pass, fail, unknown]
        vantage:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          pattern: \S
        location:
          enum: [cloud-external, user-lan, server-vlan, branch, wifi, remote-site, null]
        port:
          type: [integer, 'null']
          minimum: 1
          maximum: 65535
        latency_ms:
          type: [number, 'null']
          minimum: 0
          maximum: 3600000
        detail:
          type: [string, 'null']
          minLength: 1
          maxLength: 1000
          pattern: \S
        observed_at:
          type: [string, 'null']
          format: date-time
        evidence_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
      allOf:
      - if:
          properties:
            kind:
              not:
                enum: [tcp, http, https]
          required: [kind]
        then:
          properties:
            port: {type: 'null'}
    DiagnosticRun:
      type: object
      additionalProperties: false
      required: [id, target, target_id, symptom, vantage, started_at, completed_at, checks, facts, contradictions, unknowns, probable_fault_domain, confidence, alternative_hypotheses, recommended_next_checks, evidence_ids]
      properties:
        id:
          type: string
          minLength: 47
          maxLength: 47
          pattern: '^diagnostic-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        target:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
        target_id:
          type: [string, 'null']
          minLength: 43
          maxLength: 43
          pattern: '^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        symptom:
          type: [string, 'null']
          minLength: 1
          maxLength: 1000
          pattern: '\S'
        vantage:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          pattern: '\S'
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        checks:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/DiagnosticProbeResult'
        facts:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/DiagnosticFinding'
        contradictions:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/DiagnosticFinding'
        unknowns:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/DiagnosticFinding'
        probable_fault_domain:
          enum: [target, service, host, interface, access-device, core, firewall, wan-dns-external, null]
        confidence:
          enum: [low, medium, high, unknown]
        alternative_hypotheses:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/DiagnosticFinding'
        recommended_next_checks:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/DiagnosticFinding'
        evidence_ids:
          type: array
          maxItems: 256
          items:
            type: string
            minLength: 1
            maxLength: 128
    DiagnosticRunRequest:
      type: object
      additionalProperties: false
      required: [target, symptom, vantage, requested_checks]
      properties:
        target:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
        symptom:
          type: [string, 'null']
          minLength: 1
          maxLength: 1000
          pattern: '\S'
        vantage:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          pattern: '\S'
        requested_checks:
          type: array
          minItems: 1
          maxItems: 12
          items:
            enum: [identity, source-freshness, target-health, dns, icmp, tcp, http, https, service, dependencies, recent-changes, baseline]
    DiagnosticRunResponse:
      type: object
      additionalProperties: false
      required: [state, run, stored]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        run:
          oneOf:
          - {type: 'null'}
          - {$ref: '#/components/schemas/DiagnosticRun'}
        stored: {type: boolean}
      allOf:
      - if:
          properties:
            state: {const: ok}
          required: [state]
        then:
          properties:
            run: {type: object}
        else:
          properties:
            run: {type: 'null'}
      - if:
          properties:
            state: {const: ok}
          required: [state]
        else:
          properties:
            stored: {const: false}
    DiagnosticSession:
      type: object
      additionalProperties: false
      required: [run, locations, probable_cause, recent_changes, path]
      properties:
        run: {$ref: '#/components/schemas/DiagnosticRun'}
        locations:
          type: array
          minItems: 6
          maxItems: 6
          items: {$ref: '#/components/schemas/DiagnosticLocationResult'}
        probable_cause: {$ref: '#/components/schemas/DiagnosticProbableCause'}
        recent_changes: {$ref: '#/components/schemas/DiagnosticRecentChanges'}
        path: {$ref: '#/components/schemas/DiagnosticPath'}
    DiagnosticLocationResult:
      type: object
      additionalProperties: false
      required: [location, state, status, passed, failed, unknown_checks, check_ids]
      properties:
        location:
          enum: [cloud-external, user-lan, server-vlan, branch, wifi, remote-site]
        state:
          enum: [observed, unknown, not-connected]
        status:
          enum: [pass, fail, null]
        passed: {type: integer, minimum: 0, maximum: 64}
        failed: {type: integer, minimum: 0, maximum: 64}
        unknown_checks: {type: integer, minimum: 0, maximum: 64}
        check_ids:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 128}
    DiagnosticEvidenceItem:
      type: object
      additionalProperties: false
      required: [basis, statement, check_ids]
      properties:
        basis:
          enum: [observed, inferred, unknown]
        statement: {type: string, minLength: 1, maxLength: 1000, pattern: \S}
        check_ids:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 128}
    DiagnosticProbableCause:
      type: object
      additionalProperties: false
      required: [domain, confidence, basis, pattern, summary, evidence]
      properties:
        domain:
          enum: [target, service, host, interface, access-device, core, firewall, wan-dns-external, null]
        confidence:
          enum: [low, medium, high, unknown]
        basis:
          enum: [inferred, unknown]
        pattern:
          enum: [external-only-failure, service-failure, other, none]
        summary: {type: string, minLength: 1, maxLength: 1000, pattern: \S}
        evidence:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/DiagnosticEvidenceItem'}
    DiagnosticChangeSource:
      type: object
      additionalProperties: false
      required: [source, state]
      properties:
        source:
          enum: [incidents, alerts, configuration-changes]
        state:
          enum: [not-connected, ok, unknown]
    DiagnosticChangeItem:
      type: object
      additionalProperties: false
      required: [kind, ref_id, severity, title, title_redacted, occurred_at, scope, relation]
      properties:
        kind:
          enum: [incident, alert]
        ref_id: {type: string, minLength: 1, maxLength: 128}
        severity:
          enum: [low, medium, high, critical, null]
        title: {type: string, minLength: 1, maxLength: 255, pattern: \S}
        title_redacted: {type: boolean}
        occurred_at: {type: string, format: date-time}
        scope:
          enum: [target, time-window]
        relation: {const: may-correlate}
      description: >-
        An incident carries its severity; its title is never stored with the session. It is joined
        at read time only for a caller holding incidents:read, otherwise title is a fixed
        placeholder and title_redacted is true. An alert has no severity and a stored title.
      allOf:
      - if:
          properties:
            kind: {const: incident}
          required: [kind]
        then:
          properties:
            severity: {type: string}
        else:
          properties:
            severity: {type: 'null'}
            title_redacted: {const: false}
    DiagnosticRecentChanges:
      type: object
      additionalProperties: false
      required: [state, window_start, window_end, sources, items]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        sources:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: '#/components/schemas/DiagnosticChangeSource'}
        items:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/DiagnosticChangeItem'}
      allOf:
      - if:
          properties:
            state: {const: ok}
          required: [state]
        else:
          properties:
            items: {maxItems: 0}
    DiagnosticPathHop:
      type: object
      additionalProperties: false
      required: [tier, state, device_id, name, highlight]
      properties:
        tier:
          enum: [user, access-point, access-switch, core, firewall, server]
        state:
          enum: [known, unknown]
        device_id:
          type: [string, 'null']
          minLength: 43
          maxLength: 43
          pattern: ^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
          pattern: \S
        highlight:
          enum: [suspected, null]
    DiagnosticPathLink:
      type: object
      additionalProperties: false
      required: [from_tier, to_tier, state]
      properties:
        from_tier:
          enum: [user, access-point, access-switch, core, firewall, server]
        to_tier:
          enum: [user, access-point, access-switch, core, firewall, server]
        state:
          enum: [known, unknown]
    DiagnosticPath:
      type: object
      additionalProperties: false
      required: [state, observed_at, hops, links]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        observed_at:
          type: [string, 'null']
          format: date-time
        hops:
          type: array
          maxItems: 6
          items: {$ref: '#/components/schemas/DiagnosticPathHop'}
        links:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/DiagnosticPathLink'}
      allOf:
      - if:
          properties:
            state: {const: ok}
          required: [state]
        then:
          properties:
            observed_at: {type: string}
            hops: {minItems: 6}
            links: {minItems: 5}
        else:
          properties:
            observed_at: {type: 'null'}
            hops: {maxItems: 0}
            links: {maxItems: 0}
    DiagnosticSessionSummary:
      type: object
      additionalProperties: false
      required: [id, target, started_at, completed_at, probable_fault_domain, confidence]
      properties:
        id: {type: string, minLength: 47, maxLength: 47, pattern: '^diagnostic-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
        target: {type: string, minLength: 1, maxLength: 255, pattern: \S}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        probable_fault_domain:
          enum: [target, service, host, interface, access-device, core, firewall, wan-dns-external, null]
        confidence:
          enum: [low, medium, high, unknown]
    DiagnosticSessionResponse:
      type: object
      additionalProperties: false
      required: [state, session]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        session:
          oneOf:
          - {type: 'null'}
          - {$ref: '#/components/schemas/DiagnosticSession'}
      allOf:
      - if:
          properties:
            state: {const: ok}
          required: [state]
        then:
          properties:
            session: {type: object}
        else:
          properties:
            session: {type: 'null'}
    DiagnosticSessionListResponse:
      type: object
      additionalProperties: false
      required: [state, sessions, limit, offset, next_offset]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        sessions:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/DiagnosticSessionSummary'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 10000}
        next_offset:
          type: [integer, 'null']
          minimum: 1
          maximum: 10100
      allOf:
      - if:
          properties:
            state: {const: ok}
          required: [state]
        else:
          properties:
            sessions: {maxItems: 0}
            next_offset: {type: 'null'}
    InternetResponse:
      description: GET /api/v1/internet. A non-ok state carries no links; per-link blocks carry their own state so a missing source never reads as a healthy link.
      type: object
      additionalProperties: false
      required:
      - state
      - generated_at
      - links
      - failover
      - detail_redacted
      properties:
        state:
          enum:
          - not-connected
          - unknown
          - ok
        generated_at:
          type: string
          format: date-time
        links:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/WanLink'
        failover:
          $ref: '#/components/schemas/WanFailover'
        detail_redacted:
          type: boolean
          description: "True when the caller lacks internet:read_detail: the ISP name, gateway, public IP and per-link throughput are withheld (null). A null there then means restricted, not 'not reported' (cross-field: a redacted response carries none of them)."
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            links:
              maxItems: 0
            failover:
              properties:
                state:
                  const: unknown
    WanConfigured:
      type: object
      additionalProperties: false
      required:
      - isp
      - gateway
      - probe_location
      properties:
        isp:
          minLength: 1
          maxLength: 128
          type:
          - string
          - 'null'
        gateway:
          minLength: 1
          maxLength: 45
          type:
          - string
          - 'null'
        probe_location:
          oneOf:
          - type: 'null'
          - enum:
            - cloud-external
            - user-lan
            - server-vlan
            - branch
            - wifi
            - remote-site
      description: Operator declarations (not telemetry); the UI labels them as configured.
    WanInterfaceReading:
      type: object
      additionalProperties: false
      required:
      - state
      - oper_status
      - capacity_bps
      - rx_bps
      - tx_bps
      - utilisation_pct
      - public_ip
      - freshness
      properties:
        state:
          enum:
          - not-connected
          - unknown
          - ok
        oper_status:
          oneOf:
          - type: 'null'
          - enum:
            - up
            - down
            - testing
            - dormant
            - notPresent
            - lowerLayerDown
            - unknown
        capacity_bps:
          minimum: 0
          type:
          - integer
          - 'null'
        rx_bps:
          minimum: 0
          type:
          - integer
          - 'null'
        tx_bps:
          minimum: 0
          type:
          - integer
          - 'null'
        utilisation_pct:
          minimum: 0
          maximum: 1000
          type:
          - number
          - 'null'
        public_ip:
          minLength: 1
          maxLength: 45
          type:
          - string
          - 'null'
        freshness:
          $ref: '#/components/schemas/Freshness'
      description: LibreNMS interface metrics for the declared WAN port. Every value is reported or null; utilisation_pct is derived (larger of rx/tx over capacity) and only when all are known.
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            oper_status:
              type: 'null'
            capacity_bps:
              type: 'null'
            rx_bps:
              type: 'null'
            tx_bps:
              type: 'null'
            utilisation_pct:
              type: 'null'
            public_ip:
              type: 'null'
    WanQuality:
      type: object
      additionalProperties: false
      required:
      - state
      - latency_ms
      - jitter_ms
      - loss_pct
      - dns_status
      - dns_latency_ms
      - sample_count
      - window_seconds
      - freshness
      properties:
        state:
          enum:
          - not-connected
          - unknown
          - ok
        latency_ms:
          minimum: 0
          maximum: 3600000
          type:
          - number
          - 'null'
        jitter_ms:
          minimum: 0
          maximum: 3600000
          type:
          - number
          - 'null'
        loss_pct:
          minimum: 0
          maximum: 100
          type:
          - number
          - 'null'
        dns_status:
          oneOf:
          - type: 'null'
          - enum:
            - pass
            - fail
            - unknown
        dns_latency_ms:
          minimum: 0
          maximum: 3600000
          type:
          - number
          - 'null'
        sample_count:
          type: integer
          minimum: 0
          maximum: 100000
        window_seconds:
          type: integer
          minimum: 0
          maximum: 10000000
        freshness:
          $ref: '#/components/schemas/Freshness'
      description: Latency, jitter, loss and DNS computed from the stored probe samples of the window.
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            latency_ms:
              type: 'null'
            jitter_ms:
              type: 'null'
            loss_pct:
              type: 'null'
            dns_status:
              type: 'null'
            dns_latency_ms:
              type: 'null'
            sample_count:
              const: 0
    WanAvailability:
      type: object
      additionalProperties: false
      required:
      - state
      - period_start
      - period_end
      - uptime_pct
      - coverage_pct
      - current_outage_started_at
      - current_outage_seconds
      - freshness
      properties:
        state:
          enum:
          - not-connected
          - unknown
          - ok
        period_start:
          format: date-time
          type:
          - string
          - 'null'
        period_end:
          format: date-time
          type:
          - string
          - 'null'
        uptime_pct:
          minimum: 0
          maximum: 100
          type:
          - number
          - 'null'
        coverage_pct:
          minimum: 0
          maximum: 100
          type:
          - number
          - 'null'
        current_outage_started_at:
          format: date-time
          type:
          - string
          - 'null'
        current_outage_seconds:
          minimum: 0
          maximum: 10000000
          type:
          - integer
          - 'null'
        freshness:
          $ref: '#/components/schemas/Freshness'
      description: Month-to-date availability and the outage in progress, from stored probe cycles. current_outage_started_at and current_outage_seconds are both set or both null (cross-field, not expressible here).
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            period_start:
              type: 'null'
            period_end:
              type: 'null'
            uptime_pct:
              type: 'null'
            coverage_pct:
              type: 'null'
            current_outage_started_at:
              type: 'null'
            current_outage_seconds:
              type: 'null'
    WanLink:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - role
      - configured
      - status
      - interface
      - quality
      - availability
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,47}$
          minLength: 1
          maxLength: 48
        name:
          type: string
          minLength: 1
          maxLength: 128
        role:
          enum:
          - primary
          - backup
        configured:
          $ref: '#/components/schemas/WanConfigured'
        status:
          enum:
          - up
          - degraded
          - down
          - unknown
        interface:
          $ref: '#/components/schemas/WanInterfaceReading'
        quality:
          $ref: '#/components/schemas/WanQuality'
        availability:
          $ref: '#/components/schemas/WanAvailability'
      description: status is inferred from the interface state and the latest probe round; unknown when a source is silent.
    WanFailover:
      type: object
      additionalProperties: false
      required:
      - state
      - basis
      properties:
        state:
          enum:
          - single-link
          - normal
          - failed-over
          - all-down
          - unknown
        basis:
          enum:
          - inferred
          - unknown
      description: Derived from link status only (routing is not read); basis says so.
      allOf:
      - if:
          properties:
            state:
              const: unknown
        then:
          properties:
            basis:
              const: unknown
        else:
          properties:
            basis:
              const: inferred
    InternetSlaResponse:
      description: GET /api/v1/internet/sla?month=YYYY-MM. Server-bounded months; a non-ok state carries no links.
      type: object
      additionalProperties: false
      required:
      - state
      - month
      - period_start
      - period_end
      - generated_at
      - links
      properties:
        state:
          enum:
          - not-connected
          - unknown
          - ok
        month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          minLength: 7
          maxLength: 7
        period_start:
          format: date-time
          type:
          - string
          - 'null'
        period_end:
          format: date-time
          type:
          - string
          - 'null'
        generated_at:
          type: string
          format: date-time
        links:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/InternetSlaLink'
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            links:
              maxItems: 0
            period_start:
              type: 'null'
            period_end:
              type: 'null'
        else:
          properties:
            period_start:
              type: string
            period_end:
              type: string
    InternetSlaViolation:
      type: object
      additionalProperties: false
      required:
      - kind
      - target_pct
      - actual_pct
      properties:
        kind:
          const: uptime-below-target
        target_pct:
          type: number
          minimum: 0
          maximum: 100
        actual_pct:
          type: number
          minimum: 0
          maximum: 100
    InternetSlaLink:
      type: object
      additionalProperties: false
      required:
      - link_id
      - name
      - state
      - uptime_target_pct
      - total_seconds
      - up_seconds
      - degraded_seconds
      - down_seconds
      - unknown_seconds
      - uptime_pct
      - coverage_pct
      - outage_count
      - longest_outage_seconds
      - cycle_count
      - windows_truncated
      - violations
      properties:
        link_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,47}$
          minLength: 1
          maxLength: 48
        name:
          type: string
          minLength: 1
          maxLength: 128
        state:
          enum:
          - not-connected
          - unknown
          - ok
        uptime_target_pct:
          exclusiveMinimum: 0
          maximum: 100
          type:
          - number
          - 'null'
        total_seconds:
          minimum: 0
          maximum: 10000000
          type:
          - integer
          - 'null'
        up_seconds:
          minimum: 0
          maximum: 10000000
          type:
          - integer
          - 'null'
        degraded_seconds:
          minimum: 0
          maximum: 10000000
          type:
          - integer
          - 'null'
        down_seconds:
          minimum: 0
          maximum: 10000000
          type:
          - integer
          - 'null'
        unknown_seconds:
          minimum: 0
          maximum: 10000000
          type:
          - integer
          - 'null'
        uptime_pct:
          minimum: 0
          maximum: 100
          type:
          - number
          - 'null'
        coverage_pct:
          minimum: 0
          maximum: 100
          type:
          - number
          - 'null'
        outage_count:
          minimum: 0
          maximum: 1000000
          type:
          - integer
          - 'null'
        longest_outage_seconds:
          minimum: 0
          maximum: 10000000
          type:
          - integer
          - 'null'
        cycle_count:
          minimum: 0
          maximum: 1000000
          type:
          - integer
          - 'null'
        windows_truncated:
          type:
          - boolean
          - 'null'
          description: "True when the evidence export lists fewer windows than the month holds; the figures are never truncated. Null when the link is not ok."
        violations:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/InternetSlaViolation'
      description: Deterministic month figures from stored probe cycles. up + degraded + down + unknown seconds equal total_seconds (cross-field). uptime_pct is (up + degraded) over known time and null when nothing was known. Time with no probe round is unknown, never up or down.
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            total_seconds:
              type: 'null'
            up_seconds:
              type: 'null'
            degraded_seconds:
              type: 'null'
            down_seconds:
              type: 'null'
            unknown_seconds:
              type: 'null'
            uptime_pct:
              type: 'null'
            coverage_pct:
              type: 'null'
            outage_count:
              type: 'null'
            longest_outage_seconds:
              type: 'null'
            cycle_count:
              type: 'null'
            windows_truncated:
              type: 'null'
            violations:
              maxItems: 0
        else:
          properties:
            total_seconds:
              type: integer
            up_seconds:
              type: integer
            degraded_seconds:
              type: integer
            down_seconds:
              type: integer
            unknown_seconds:
              type: integer
            coverage_pct:
              type: number
            outage_count:
              type: integer
            longest_outage_seconds:
              type: integer
            cycle_count:
              type: integer
            windows_truncated:
              type: boolean
    InternetSlaExportWindow:
      type: object
      additionalProperties: false
      required:
      - kind
      - started_at
      - ended_at
      - duration_seconds
      - sample_count
      properties:
        kind:
          enum:
          - down
          - degraded
          - unknown
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer
          minimum: 0
          maximum: 10000000
        sample_count:
          type: integer
          minimum: 0
          maximum: 1000000
      description: ended_at is after started_at (cross-field). sample_count 0 is a gap in sampling.
    InternetSlaExportSource:
      type: object
      additionalProperties: false
      required:
      - probe
      - target
      - location
      properties:
        probe:
          enum:
          - icmp
          - tcp
          - dns
        target:
          type: string
          minLength: 1
          maxLength: 253
        location:
          oneOf:
          - type: 'null'
          - enum:
            - cloud-external
            - user-lan
            - server-vlan
            - branch
            - wifi
            - remote-site
    InternetSlaExportLink:
      type: object
      additionalProperties: false
      required:
      - link
      - isp
      - sources
      - windows
      - windows_truncated
      properties:
        link:
          $ref: '#/components/schemas/InternetSlaLink'
        isp:
          minLength: 1
          maxLength: 128
          type:
          - string
          - 'null'
        sources:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/InternetSlaExportSource'
        windows:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/InternetSlaExportWindow'
        windows_truncated:
          type: boolean
      allOf:
      - if:
          properties:
            link:
              properties:
                state:
                  enum:
                  - not-connected
                  - unknown
        then:
          properties:
            sources:
              maxItems: 0
            windows:
              maxItems: 0
            windows_truncated:
              const: false
    InternetSlaExport:
      description: GET /api/v1/internet/sla/export?format=json. Outage, degraded and unknown windows with probe sources and round counts; nothing is inferred beyond the samples.
      type: object
      additionalProperties: false
      required:
      - state
      - month
      - period_start
      - period_end
      - generated_at
      - basis
      - detail_redacted
      - links
      properties:
        state:
          enum:
          - not-connected
          - unknown
          - ok
        month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          minLength: 7
          maxLength: 7
        period_start:
          format: date-time
          type:
          - string
          - 'null'
        period_end:
          format: date-time
          type:
          - string
          - 'null'
        generated_at:
          type: string
          format: date-time
        basis:
          type: string
          minLength: 1
          maxLength: 1000
        detail_redacted:
          type: boolean
          description: "True when the caller lacks internet:read_detail: the ISP name is withheld (null)."
        links:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/InternetSlaExportLink'
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            links:
              maxItems: 0
            period_start:
              type: 'null'
            period_end:
              type: 'null'
        else:
          properties:
            period_start:
              type: string
            period_end:
              type: string
  responses:
    AuthenticationRequired:
      description: Authentication required
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PermissionDenied:
      description: Permission denied
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DeviceNotFound:
      description: Device not found
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request validation failed
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidSourceData:
      description: Source returned invalid data
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SourceUnavailable:
      description: Source is unavailable or not configured
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IncidentNotFound:
      description: Incident not found
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IncidentConflict:
      description: The incident is not in a state that allows this change, or was changed concurrently
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    StoreUnavailable:
      description: Incident storage is not connected or temporarily unavailable
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AlertingNotFound:
      description: Alert rule or maintenance window not found
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AlertingConflict:
      description: The record was changed concurrently, is in a state that does not allow this change, the
        supplied version is stale, or a configuration limit was reached (code LIMIT_REACHED, fixed message)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AlertingBusy:
      description: Too many dry-runs are in progress (code EVALUATE_BUSY, fixed message); retry shortly
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AlertingStoreUnavailable:
      description: Alert-rule storage is not connected or temporarily unavailable
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Write rate limit exceeded
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: netsight_session
security:
  - sessionCookie: []
