          - ok
          - unknown
        time_range:
          $ref: '#/components/schemas/TrafficTimeRange'
        filters:
          $ref: '#/components/schemas/TrafficFlowFilters'
        unsupported:
          description: Filters the request used that the flow source does not report; the read is unknown, never silently unfiltered.
          type: array
          uniqueItems: true
          maxItems: 10
          items:
            enum:
            - source_ip
            - destination_ip
            - device
            - vlan
            - application
            - protocol
            - port
            - country
            - asn
            - direction
        flows_restricted:
          type: boolean
        attribution:
          $ref: '#/components/schemas/TrafficAttributionStatus'
        flows:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/TrafficFlow'
        aggregations:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TrafficAggregations'
        cohort:
          $ref: '#/components/schemas/TrafficCohort'
        freshness:
          $ref: '#/components/schemas/Freshness'
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            flows:
              maxItems: 0
            aggregations:
              type: 'null'
      - if:
          properties:
            flows_restricted:
              const: true
          required:
          - flows_restricted
        then:
          properties:
            flows:
              maxItems: 0
            attribution:
              properties:
                level:
                  const: none
      - if:
          properties:
            unsupported:
              minItems: 1
          required:
          - unsupported
        then:
          properties:
            state:
              const: unknown
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then: &id001
          properties:
            cohort:
              properties:
                state:
                  const: not-applied
      - if:
          properties:
            cohort:
              properties:
                state:
                  const: too-few-sources
          required:
          - cohort
        then:
          properties:
            flows:
              maxItems: 0
            aggregations:
              type: 'null'
      - if:
          properties:
            state:
              const: ok
            flows_restricted:
              const: false
          required:
          - state
          - flows_restricted
        then: *id001
      - if:
          properties:
            state:
              const: ok
            flows_restricted:
              const: true
          required:
          - state
          - flows_restricted
        then:
          properties:
            cohort:
              properties:
                state:
                  enum:
                  - sufficient
                  - too-few-sources
            aggregations:
              anyOf:
              - type: 'null'
              - properties:
                  destinations:
                    items:
                      properties:
                        scope:
                          const: external
    TrafficPolicy:
      description: Whether an operator policy file classified approval, risk and reputation. Without one they are unknown.
      type: object
      additionalProperties: false
      required:
      - state
      properties:
        state:
          enum:
          - not-configured
          - configured
          - invalid
    TrafficAppTrend:
      description: Change against the immediately preceding window of equal length; flat is within 10 percent.
      type: object
      additionalProperties: false
      required:
      - state
      - previous_bytes
      - change_ratio
      properties:
        state:
          enum:
          - up
          - down
          - flat
          - new
          - unknown
        previous_bytes:
          type:
          - integer
          - 'null'
          minimum: 0
        change_ratio:
          type:
          - number
          - 'null'
          minimum: -1
      allOf:
      - if:
          properties:
            state:
              const: unknown
          required:
          - state
        then:
          properties:
            previous_bytes:
              type: 'null'
            change_ratio:
              type: 'null'
      - if:
          properties:
            state:
              const: new
          required:
          - state
        then:
          properties:
            previous_bytes:
              const: 0
            change_ratio:
              type: 'null'
      - if:
          properties:
            state:
              enum:
              - up
              - down
              - flat
          required:
          - state
        then:
          properties:
            previous_bytes:
              type: integer
              minimum: 1
            change_ratio:
              type: number
      - if:
          properties:
            state:
              const: up
          required:
          - state
        then:
          properties:
            change_ratio:
              exclusiveMinimum: 0.1
      - if:
          properties:
            state:
              const: down
          required:
          - state
        then:
          properties:
            change_ratio:
              exclusiveMaximum: -0.1
      - if:
          properties:
            state:
              const: flat
          required:
          - state
        then:
          properties:
            change_ratio:
              minimum: -0.1
              maximum: 0.1
    TrafficApplication:
      description: Application name and category are source-reported and untrusted; risk and approval come only from the operator policy.
      type: object
      additionalProperties: false
      required:
      - rank
      - application
      - category
      - bytes
      - packets
      - share
      - endpoints
      - users
      - trend
      - risk
      - approval
      properties:
        rank:
          type: integer
          minimum: 1
          maximum: 100
        application:
          type: string
          minLength: 1
          maxLength: 255
        category:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
        bytes:
          type: integer
          minimum: 0
        packets:
          type:
          - integer
          - 'null'
          minimum: 0
        share:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        endpoints:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Distinct source addresses seen using the application (not people, not inventory devices).
        users:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 'Null: counting people needs per-flow identity attribution, which this surface does not do.'
        trend:
          $ref: '#/components/schemas/TrafficAppTrend'
        risk:
          enum:
          - low
          - medium
          - high
          - unknown
        approval:
          enum:
          - approved
          - unapproved
          - unknown
    TrafficApplicationsResponse:
      type: object
      required:
      - state
      - time_range
      - previous_range
      - policy
      - unsupported
      - total_bytes
      - items
      - cohort
      - freshness
      additionalProperties: false
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        time_range:
          $ref: '#/components/schemas/TrafficTimeRange'
        previous_range:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TrafficTimeRange'
        policy:
          $ref: '#/components/schemas/TrafficPolicy'
        unsupported:
          type: array
          uniqueItems: true
          maxItems: 1
          items:
            enum:
            - application
        total_bytes:
          type:
          - integer
          - 'null'
          minimum: 0
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TrafficApplication'
        cohort:
          $ref: '#/components/schemas/TrafficCohort'
        freshness:
          $ref: '#/components/schemas/Freshness'
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            items:
              maxItems: 0
            total_bytes:
              type: 'null'
            previous_range:
              type: 'null'
      - if:
          properties:
            unsupported:
              minItems: 1
          required:
          - unsupported
        then:
          properties:
            state:
              const: unknown
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            cohort:
              properties:
                state:
                  const: not-applied
      - if:
          properties:
            cohort:
              properties:
                state:
                  const: too-few-sources
          required:
          - cohort
        then:
          properties:
            items:
              contains:
                properties:
                  endpoints:
                    type: 'null'
                required:
                - endpoints
    TrafficDestination:
      description: Domain, ASN and country are source-reported; reputation comes only from the operator allow/deny list.
      type: object
      additionalProperties: false
      required:
      - rank
      - address
      - scope
      - domain
      - asn
      - country
      - first_seen
      - last_seen
      - bytes
      - packets
      - share
      - endpoints
      - users
      - reputation
      properties:
        rank:
          type: integer
          minimum: 1
          maximum: 100
        address:
          type: string
          minLength: 1
          maxLength: 45
        scope:
          enum:
          - external
          - internal
          description: 'internal: a private, loopback, link-local, shared or multicast address. The aggregate tier is never told about internal destinations.'
        domain:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        asn:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 4294967295
        country:
          type:
          - string
          - 'null'
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
        first_seen:
          type:
          - string
          - 'null'
          format: date-time
          description: Earliest time seen within the look-back (first_seen_since); null when not determined.
        last_seen:
          type: string
          format: date-time
        bytes:
          type: integer
          minimum: 0
        packets:
          type:
          - integer
          - 'null'
          minimum: 0
        share:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        endpoints:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Distinct source addresses that sent to the destination.
        users:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 'Null: counting people needs per-flow identity attribution, which this surface does not do.'
        reputation:
          enum:
          - allow-listed
          - deny-listed
          - unknown
    TrafficDestinationsResponse:
      type: object
      required:
      - state
      - time_range
      - first_seen_since
      - policy
      - total_bytes
      - items
      - cohort
      - freshness
      additionalProperties: false
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        time_range:
          $ref: '#/components/schemas/TrafficTimeRange'
        first_seen_since:
          type:
          - string
          - 'null'
          format: date-time
        policy:
          $ref: '#/components/schemas/TrafficPolicy'
        total_bytes:
          type:
          - integer
          - 'null'
          minimum: 0
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TrafficDestination'
        cohort:
          $ref: '#/components/schemas/TrafficCohort'
        freshness:
          $ref: '#/components/schemas/Freshness'
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            items:
              maxItems: 0
            total_bytes:
              type: 'null'
            first_seen_since:
              type: 'null'
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            cohort:
              properties:
                state:
                  const: not-applied
      - if:
          properties:
            cohort:
              properties:
                state:
                  const: too-few-sources
          required:
          - cohort
        then:
          properties:
            items:
              contains:
                properties:
                  endpoints:
                    type: 'null'
                required:
                - endpoints
      - if:
          properties:
            cohort:
              properties:
                state:
                  enum:
                  - sufficient
                  - too-few-sources
          required:
          - cohort
        then:
          properties:
            items:
              items:
                properties:
                  scope:
                    const: external
    TrafficBaselineMethod:
      description: The deterministic comparison; see docs/12-implementation/TRAFFIC-BASELINES.md.
      type: object
      additionalProperties: false
      required:
      - algorithm
      - weeks
      - min_weeks
      - threshold
      - min_difference_bytes
      properties:
        algorithm:
          const: same-hour-of-week-median-mad
        weeks:
          type: integer
          minimum: 1
          maximum: 8
        min_weeks:
          type: integer
          minimum: 1
          maximum: 8
        threshold:
          type: number
          exclusiveMinimum: 0
        min_difference_bytes:
          type: integer
          minimum: 0
    TrafficWorkingHours:
      description: 'Operator-configured working hours. Not configured: outside_working_hours is unknown, never assumed.'
      type: object
      additionalProperties: false
      required:
      - state
      - timezone
      properties:
        state:
          enum:
          - not-configured
          - configured
          - invalid
        timezone:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 64
      allOf:
      - if:
          properties:
            state:
              const: configured
          required:
          - state
        then:
          properties:
            timezone:
              type: string
      - if:
          properties:
            state:
              enum:
              - not-configured
              - invalid
          required:
          - state
        then:
          properties:
            timezone:
              type: 'null'
    TrafficEvaluation:
      description: 'How much of the window could be judged. insufficient-baseline means fewer than min_weeks comparable weeks: nothing is flagged. Counts add up to the buckets; the status follows from them.'
      type: object
      additionalProperties: false
      required:
      - status
      - series
      - buckets
      - evaluated
      - insufficient_baseline
      - no_data
      - anomalies_total
      - application_series
      - daylight_saving
      properties:
        status:
          enum:
          - evaluated
          - partial
          - insufficient-baseline
          - no-data
        series:
          type: integer
          minimum: 0
        buckets:
          type: integer
          minimum: 0
        evaluated:
          type: integer
          minimum: 0
        insufficient_baseline:
          type: integer
          minimum: 0
        no_data:
          type: integer
          minimum: 0
        anomalies_total:
          type: integer
          minimum: 0
        application_series:
          enum:
          - evaluated
          - not-reported
        daylight_saving:
          enum:
          - not-applicable
          - none
          - crossed
          description: 'Whether the policy time zone changed its UTC offset between the first baseline week and the end of the evaluated range. The weeks compared are fixed 168-hour UTC weeks, so a change shifts the local hour of the earlier weeks. not-applicable: no time zone is configured.'
    TrafficFirstSeenStatus:
      description: First-seen flags need history before the window; without it everything would look new, so none are raised.
      type: object
      additionalProperties: false
      required:
      - state
      - required_days
      - oldest
      properties:
        state:
          enum:
          - sufficient
          - insufficient
          - unknown
        required_days:
          type: integer
          minimum: 1
          maximum: 31
        oldest:
          type:
          - string
          - 'null'
          format: date-time
      allOf:
      - if:
          properties:
            state:
              const: unknown
          required:
          - state
        then:
          properties:
            oldest:
              type: 'null'
    TrafficAnomalyContext:
      description: 'Context, not a verdict: outside working hours is not malicious. The patterns are common legitimate causes.'
      type: object
      additionalProperties: false
      required:
      - outside_working_hours
      - common_legitimate_patterns
      properties:
        outside_working_hours:
          type:
          - boolean
          - 'null'
        common_legitimate_patterns:
          type: array
          uniqueItems: true
          maxItems: 8
          items:
            enum:
            - backup
            - cloud-sync
            - cctv-or-nvr
            - patching-or-updates
            - replication
            - scheduled-maintenance
            - antivirus-update
            - authorised-remote-work
    TrafficAnomalySubject:
      type: object
      additionalProperties: false
      required:
      - kind
      - label
      properties:
        kind:
          enum:
          - total
          - application
        label:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
      allOf:
      - if:
          properties:
            kind:
              const: total
          required:
          - kind
        then:
          properties:
            label:
              type: 'null'
      - if:
          properties:
            kind:
              const: application
          required:
          - kind
        then:
          properties:
            label:
              type: string
    TrafficAnomaly:
      description: An hourly volume that differs from the median of the same hour in prior weeks. Evidence, not a verdict.
      type: object
      additionalProperties: false
      required:
      - kind
      - subject
      - bucket_start
      - bucket_end
      - direction
      - observed
      - baseline
      - baseline_samples
      - difference
      - ratio
      - score
      - confidence
      - context
      properties:
        kind:
          const: volume-deviation
        subject:
          $ref: '#/components/schemas/TrafficAnomalySubject'
        bucket_start:
          type: string
          format: date-time
        bucket_end:
          type: string
          format: date-time
        direction:
          enum:
          - above
          - below
        observed:
          type: integer
          minimum: 0
        baseline:
          type: integer
          minimum: 0
        baseline_samples:
          type: integer
          minimum: 1
          maximum: 8
        difference:
          type: integer
        ratio:
          type:
          - number
          - 'null'
          minimum: 0
        score:
          type: number
        confidence:
          enum:
          - low
          - medium
          - high
        context:
          $ref: '#/components/schemas/TrafficAnomalyContext'
    TrafficFirstSeen:
      description: An ASN or destination not seen in the look-back before the window. Context, not a verdict.
      type: object
      additionalProperties: false
      required:
      - kind
      - asn
      - address
      - domain
      - first_seen
      - bytes
      - context
      properties:
        kind:
          enum:
          - first-seen-asn
          - first-seen-destination
        asn:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 4294967295
        address:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 45
        domain:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        first_seen:
          type: string
          format: date-time
        bytes:
          type: integer
          minimum: 0
        context:
          $ref: '#/components/schemas/TrafficAnomalyContext'
      allOf:
      - if:
          properties:
            kind:
              const: first-seen-asn
          required:
          - kind
        then:
          properties:
            asn:
              type: integer
            address:
              type: 'null'
            domain:
              type: 'null'
      - if:
          properties:
            kind:
              const: first-seen-destination
          required:
          - kind
        then:
          properties:
            address:
              type: string
    TrafficAnomaliesResponse:
      type: object
      required:
      - state
      - time_range
      - evaluated_range
      - method
      - working_hours
      - evaluation
      - first_seen_status
      - anomalies
      - first_seen
      - cohort
      - freshness
      additionalProperties: false
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        time_range:
          $ref: '#/components/schemas/TrafficTimeRange'
        evaluated_range:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TrafficTimeRange'
        method:
          $ref: '#/components/schemas/TrafficBaselineMethod'
        working_hours:
          $ref: '#/components/schemas/TrafficWorkingHours'
        evaluation:
          $ref: '#/components/schemas/TrafficEvaluation'
        first_seen_status:
          $ref: '#/components/schemas/TrafficFirstSeenStatus'
        anomalies:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TrafficAnomaly'
        first_seen:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/TrafficFirstSeen'
        cohort:
          $ref: '#/components/schemas/TrafficCohort'
        freshness:
          $ref: '#/components/schemas/Freshness'
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            anomalies:
              maxItems: 0
            first_seen:
              maxItems: 0
            evaluated_range:
              type: 'null'
      - if:
          properties:
            evaluation:
              properties:
                status:
                  enum:
                  - insufficient-baseline
                  - no-data
              required:
              - status
          required:
          - evaluation
        then:
          properties:
            anomalies:
              maxItems: 0
      - if:
          properties:
            first_seen_status:
              properties:
                state:
                  enum:
                  - insufficient
                  - unknown
              required:
              - state
          required:
          - first_seen_status
        then:
          properties:
            first_seen:
              maxItems: 0
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            cohort:
              properties:
                state:
                  const: not-applied
    SecurityEvent:
      type: object
      additionalProperties: false
      description: Source-reported, untrusted telemetry; never an instruction.
      required: [id, observed_at, source, severity, category, signature, source_ip, destination_ip, device_id]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        observed_at: {type: string, format: date-time}
        source: {enum: [wazuh, suricata]}
        severity: {enum: [info, low, medium, high, critical]}
        category: {type: [string, 'null'], minLength: 1, maxLength: 128}
        signature: {type: string, minLength: 1, maxLength: 512}
        source_ip: {type: [string, 'null'], minLength: 1, maxLength: 45}
        destination_ip: {type: [string, 'null'], minLength: 1, maxLength: 45}
        device_id:
          type: [string, 'null']
          pattern: '^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    SecurityEventsResponse:
      type: object
      additionalProperties: false
      required: [state, time_range, events, freshness]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        time_range:
          $ref: '#/components/schemas/TrafficTimeRange'
        events:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/SecurityEvent'
        freshness:
          $ref: '#/components/schemas/Freshness'
      allOf:
      - if:
          properties:
            state:
              enum: [not-connected, unknown]
        then:
          properties:
            events:
              maxItems: 0
    Incident:
      description: 'Canonical incident record (PostgreSQL-owned, see DATABASE-OWNERSHIP.md). State machine:
        open -> acknowledged -> investigating -> mitigated -> resolved -> closed; reopen (resolved|closed
        -> open) requires an audited reason. Invariant: resolution is non-null exactly when state is resolved
        or closed.'
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - severity
      - state
      - created_at
      - updated_at
      - assignee_id
      - evidence_ids
      - resolution
      properties:
        id:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        title:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        severity:
          enum:
          - low
          - medium
          - high
          - critical
        state:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        assignee_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        evidence_ids:
          description: References to immutable evidence records; never inline telemetry.
          type: array
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        resolution:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IncidentResolution'
      allOf:
      - if:
          properties:
            state:
              enum:
              - resolved
              - closed
          required:
          - state
        then:
          properties:
            resolution:
              type: object
        else:
          properties:
            resolution:
              type: 'null'
    IncidentResolution:
      description: 'Mandatory resolution record. root_cause_status is ''determined'' only with an operator-accepted
        root cause text, otherwise ''not-determined'' with a null root cause; an AI-proposed root cause is
        never written here without an authorised operator accepting it. Cross-field rule not expressible in
        JSON Schema and enforced by the API models and the browser parser: restored_at must not be after resolved_at.'
      type: object
      additionalProperties: false
      required:
      - summary
      - root_cause_status
      - root_cause
      - impact
      - restored_at
      - resolved_at
      - resolved_by
      - follow_up_actions
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        root_cause_status:
          enum:
          - determined
          - not-determined
        root_cause:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 2000
          pattern: \S
        impact:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        restored_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        resolved_by:
          type: string
          minLength: 1
          maxLength: 255
        follow_up_actions:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: \S
      allOf:
      - if:
          properties:
            root_cause_status:
              const: determined
          required:
          - root_cause_status
        then:
          properties:
            root_cause:
              type: string
        else:
          properties:
            root_cause:
              type: 'null'
    IncidentTimelineEvent:
      description: 'One append-only timeline entry. The store exposes no update or delete path and the database
        rejects them. Rules: state_from/state_to are present exactly for state-changed; a transition to ''open''
        (reopen) requires reason; comment and resolution require message; every other kind except assignee-changed
        (null subject_id means unassigned) requires subject_id.'
      type: object
      additionalProperties: false
      required:
      - id
      - incident_id
      - seq
      - occurred_at
      - actor_id
      - kind
      - state_from
      - state_to
      - reason
      - message
      - subject_id
      properties:
        id:
          type: string
          minLength: 51
          maxLength: 51
          pattern: ^incident-event-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        incident_id:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        seq:
          type: integer
          minimum: 1
          maximum: 1000000
        occurred_at:
          type: string
          format: date-time
        actor_id:
          type: string
          minLength: 1
          maxLength: 255
        kind:
          enum:
          - alert-linked
          - alert-unlinked
          - assignee-changed
          - comment
          - diagnostic
          - action-proposed
          - action-approved
          - action-executed
          - evidence-added
          - state-changed
          - resolution
        state_from:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
          - null
        state_to:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
          - null
        reason:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 1000
          pattern: \S
        message:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 4000
          pattern: \S
        subject_id:
          description: 'Opaque reference: alert, diagnostic, action request, evidence record or (assignee-changed)
            the new assignee identity.'
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
      allOf:
      - if:
          properties:
            kind:
              const: state-changed
          required:
          - kind
        then:
          properties:
            state_from:
              type: string
            state_to:
              type: string
        else:
          properties:
            state_from:
              type: 'null'
            state_to:
              type: 'null'
      - if:
          properties:
            kind:
              const: state-changed
            state_to:
              const: open
          required:
          - kind
          - state_to
        then:
          properties:
            reason:
              type: string
      - if:
          properties:
            kind:
              enum:
              - comment
              - resolution
          required:
          - kind
        then:
          properties:
            message:
              type: string
      - if:
          properties:
            kind:
              enum:
              - alert-linked
              - alert-unlinked
              - diagnostic
              - action-proposed
              - action-approved
              - action-executed
              - evidence-added
          required:
          - kind
        then:
          properties:
            subject_id:
              type: string
    IncidentListResponse:
      description: One page of incidents, newest first. Paging is a server-capped offset (limit 1-100, offset
        0-10000); next_offset is null on the last page.
      type: object
      additionalProperties: false
      required:
      - state
      - incidents
      - limit
      - offset
      - next_offset
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        incidents:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Incident'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 10000
        next_offset:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            incidents:
              maxItems: 0
            next_offset:
              type: 'null'
    IncidentSummary:
      description: Reduced incident view for the Management role. Omits evidence_ids, the resolution record
        (free text and resolver identity) and assignee_id by design; assigned only says whether somebody
        holds the incident. resolved_at is non-null exactly when state is resolved or closed.
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - severity
      - state
      - created_at
      - updated_at
      - assigned
      - resolved_at
      properties:
        id:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        title:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        severity:
          enum:
          - low
          - medium
          - high
          - critical
        state:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        assigned:
          type: boolean
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
      allOf:
      - if:
          properties:
            state:
              enum:
              - resolved
              - closed
          required:
          - state
        then:
          properties:
            resolved_at:
              type: string
        else:
          properties:
            resolved_at:
              type: 'null'
    IncidentSummaryListResponse:
      description: One page of incident summaries, newest first (the Management view, incidents:read-summary).
        Same paging and degraded-state rules as IncidentListResponse; rows carry no evidence ids, resolution
        text, timeline or assignee identity.
      type: object
      additionalProperties: false
      required:
      - state
      - incidents
      - limit
      - offset
      - next_offset
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        incidents:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/IncidentSummary'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 10000
        next_offset:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            incidents:
              maxItems: 0
            next_offset:
              type: 'null'
    IncidentDetailResponse:
      description: One incident. incident is non-null exactly when state is ok; an unknown id is a 404, not
        a state.
      type: object
      additionalProperties: false
      required:
      - state
      - incident
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        incident:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Incident'
      allOf:
      - if:
          properties:
            state:
              const: ok
          required:
          - state
        then:
          properties:
            incident:
              type: object
        else:
          properties:
            incident:
              type: 'null'
    IncidentTimelineResponse:
      description: One page of an incident's append-only timeline in ascending seq order. Continue with after_seq
        = next_after_seq; next_after_seq is null on the last page.
      type: object
      additionalProperties: false
      required:
      - state
      - incident_id
      - events
      - after_seq
      - next_after_seq
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        incident_id:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        events:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/IncidentTimelineEvent'
        after_seq:
          type: integer
          minimum: 0
          maximum: 1000000
        next_after_seq:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            events:
              maxItems: 0
            next_after_seq:
              type: 'null'
    IncidentTransitionRequest:
      description: Progress an incident one step. Resolving and reopening have their own operations (resolve,
        reopen) because they need human-only permissions and mandatory fields.
      type: object
      additionalProperties: false
      required:
      - to_state
      properties:
        to_state:
          enum:
          - acknowledged
          - investigating
          - mitigated
          - closed
        reason:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 1000
          pattern: \S
    IncidentAssignRequest:
      description: Assign the incident to an identity, or null to unassign.
      type: object
      additionalProperties: false
      required:
      - assignee_id
      properties:
        assignee_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
    IncidentCommentRequest:
      description: Append a comment to the timeline. The text is stored and returned verbatim and is never
        interpreted.
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: \S
    IncidentEvidenceRequest:
      description: Attach an immutable evidence record reference. Idempotent.
      type: object
      additionalProperties: false
      required:
      - evidence_id
      properties:
        evidence_id:
          type: string
          minLength: 1
          maxLength: 128
    IncidentResolveRequest:
      description: Operator-supplied resolution (INCIDENT-ENGINE.md, Resolution). Human principals only. root_cause_status
        is 'determined' only with an operator-accepted root_cause text, otherwise 'not-determined' with a
        null root_cause. The server adds who and when; restored_at must not be after the server's resolved_at
        (not expressible in JSON Schema).
      type: object
      additionalProperties: false
      required:
      - summary
      - root_cause_status
      - root_cause
      - impact
      - restored_at
      - follow_up_actions
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        root_cause_status:
          enum:
          - determined
          - not-determined
        root_cause:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 2000
          pattern: \S
        impact:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        restored_at:
          type: string
          format: date-time
        follow_up_actions:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: \S
      allOf:
      - if:
          properties:
            root_cause_status:
              const: determined
          required:
          - root_cause_status
        then:
          properties:
            root_cause:
              type: string
        else:
          properties:
            root_cause:
              type: 'null'
    IncidentReopenRequest:
      description: Reopen a resolved or closed incident. A reason is mandatory and audited. Human principals
        only.
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
    AlertRule:
      description: 'Alert rule independent of any upstream alert product (ALERT-ENGINE.md). PostgreSQL-owned.
        A rule is created as a draft and becomes active only through explicit approval (natural-language or
        otherwise): status ''active'' requires approved_by and approved_at, ''draft'' forbids them, and approved_by/approved_at
        are always both set or both null. condition.operator ''matches'' takes a pattern (threshold null);
        every other operator takes a numeric threshold (pattern null).'
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - status
      - scope
      - condition
      - baseline_mode
      - window_seconds
      - for_seconds
      - cooldown_seconds
      - schedule
      - exceptions
      - severity
      - labels
      - actions
      - incident_policy
      - created_by
      - created_at
      - updated_at
      - approved_by
      - approved_at
      - version
      properties:
        id:
          type: string
          minLength: 47
          maxLength: 47
          pattern: ^alert-rule-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        status:
          enum:
          - draft
          - active
          - disabled
        scope:
          $ref: '#/components/schemas/AlertScope'
        condition:
          $ref: '#/components/schemas/AlertCondition'
        baseline_mode:
          description: 'none: compare against the threshold only; otherwise compare against the baseline detector
            output (AnomalySignal) in the given direction.'
          enum:
          - none
          - above-baseline
          - below-baseline
          - outside-baseline
        window_seconds:
          description: Aggregation window the condition is evaluated over.
          type: integer
          minimum: 60
          maximum: 86400
        for_seconds:
          description: Duration the condition must hold before firing (debounce); 0 fires immediately.
          type: integer
          minimum: 0
          maximum: 86400
        cooldown_seconds:
          type: integer
          minimum: 0
          maximum: 604800
        schedule:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AlertSchedule'
        exceptions:
          $ref: '#/components/schemas/AlertExceptions'
        severity:
          enum:
          - info
          - low
          - medium
          - high
          - critical
        labels:
          type: object
          maxProperties: 32
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,62}$
          additionalProperties:
            type: string
            maxLength: 128
        actions:
          description: Rule actions. These only create alerts and notifications; remote write actions go through
            the action framework, never through a rule.
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            enum:
            - create_alert
            - email
            - push
        incident_policy:
          enum:
          - none
          - create
          - group
        created_by:
          type: string
          minLength: 1
          maxLength: 255
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        approved_by:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        approved_at:
          type:
          - string
          - 'null'
          format: date-time
        version:
          description: Increments on every change; supports optimistic concurrency.
          type: integer
          minimum: 1
          maximum: 1000000
      allOf:
      - if:
          properties:
            status:
              const: active
          required:
          - status
        then:
          properties:
            approved_by:
              type: string
            approved_at:
              type: string
      - if:
          properties:
            status:
              const: draft
          required:
          - status
        then:
          properties:
            approved_by:
              type: 'null'
            approved_at:
              type: 'null'
      - if:
          properties:
            approved_by:
              type: string
          required:
          - approved_by
        then:
          properties:
            approved_at:
              type: string
        else:
          properties:
            approved_at:
              type: 'null'
    AlertScope:
      type: object
      additionalProperties: false
      required:
      - kind
      - ref
      properties:
        kind:
          enum:
          - organisation
          - site
          - device
          - device_group
          - vlan
          - user
          - service
        ref:
          description: Canonical identifier or group name of the scoped entity.
          type: string
          minLength: 1
          maxLength: 255
    AlertCondition:
      type: object
      additionalProperties: false
      required:
      - metric
      - operator
      - threshold
      - pattern
      properties:
        metric:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$
        operator:
          enum:
          - gt
          - gte
          - lt
          - lte
          - eq
          - ne
          - matches
        threshold:
          type:
          - number
          - 'null'
          minimum: -1000000000000000
          maximum: 1000000000000000
        pattern:
          description: Pattern for the 'matches' operator. Must be evaluated with a linear-time matcher, never
            a backtracking engine.
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
      allOf:
      - if:
          properties:
            operator:
              const: matches
          required:
          - operator
        then:
          properties:
            threshold:
              type: 'null'
            pattern:
              type: string
        else:
          properties:
            threshold:
              type: number
            pattern:
              type: 'null'
    AlertSchedule:
      description: Times of day when the rule is active, in the given IANA timezone. A window whose 'to' is
        earlier than 'from' crosses midnight; equal values mean the whole day.
      type: object
      additionalProperties: false
      required:
      - timezone
      - active
      properties:
        timezone:
          type: string
          maxLength: 64
          pattern: ^(UTC|[A-Za-z][A-Za-z0-9_+-]*(/[A-Za-z][A-Za-z0-9_+-]*){1,2})$
        active:
          type: array
          minItems: 1
          maxItems: 14
          items:
            $ref: '#/components/schemas/AlertScheduleEntry'
    AlertScheduleEntry:
      type: object
      additionalProperties: false
      required:
      - weekdays
      - from
      - to
      properties:
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            enum:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
        from:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        to:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    AlertExceptions:
      type: object
      additionalProperties: false
      required:
      - destinations
      - device_groups
      properties:
        destinations:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        device_groups:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    MaintenanceWindow:
      description: 'Maintenance suppresses notifications and actions for the scope but keeps evaluating and
        retaining evidence unless evaluation is ''disable''. Status is scheduled|cancelled; active/expired
        are derived from the clock and never stored. status ''cancelled'' requires cancelled_by and cancelled_at,
        ''scheduled'' forbids them. Cross-field rules not expressible in JSON Schema and enforced by the API
        models, the store and the browser parser: ends_at must be after starts_at and at most 30 days later.'
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - scope
      - starts_at
      - ends_at
      - evaluation
      - status
      - reason
      - created_by
      - created_at
      - cancelled_by
      - cancelled_at
      properties:
        id:
          type: string
          minLength: 48
          maxLength: 48
          pattern: ^maintenance-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        scope:
          $ref: '#/components/schemas/AlertScope'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        evaluation:
          enum:
          - retain
          - disable
        status:
          enum:
          - scheduled
          - cancelled
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
        created_by:
          type: string
          minLength: 1
          maxLength: 255
        created_at:
          type: string
          format: date-time
        cancelled_by:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        cancelled_at:
          type:
          - string
          - 'null'
          format: date-time
      allOf:
      - if:
          properties:
            status:
              const: cancelled
          required:
          - status
        then:
          properties:
            cancelled_by:
              type: string
            cancelled_at:
              type: string
        else:
          properties:
            cancelled_by:
              type: 'null'
            cancelled_at:
              type: 'null'
    AlertRuleDefinition:
      description: 'Operator-editable rule fields: the body of a create request and the definition of an update
        or dry-run. Lifecycle and audit fields (id, status, version, created_*, approved_*) are server-owned
        and rejected here. A new rule is always a draft; it becomes active only through the approve operation.'
      type: object
      additionalProperties: false
      required:
      - name
      - scope
      - condition
      - baseline_mode
      - window_seconds
      - for_seconds
      - cooldown_seconds
      - schedule
      - exceptions
      - severity
      - labels
      - actions
      - incident_policy
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        scope:
          $ref: '#/components/schemas/AlertScope'
        condition:
          $ref: '#/components/schemas/AlertCondition'
        baseline_mode:
          description: 'none: compare against the threshold only; otherwise compare against the baseline detector
            output (AnomalySignal) in the given direction.'
          enum:
          - none
          - above-baseline
          - below-baseline
          - outside-baseline
        window_seconds:
          description: Aggregation window the condition is evaluated over.
          type: integer
          minimum: 60
          maximum: 86400
        for_seconds:
          description: Duration the condition must hold before firing (debounce); 0 fires immediately.
          type: integer
          minimum: 0
          maximum: 86400
        cooldown_seconds:
          type: integer
          minimum: 0
          maximum: 604800
        schedule:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AlertSchedule'
        exceptions:
          $ref: '#/components/schemas/AlertExceptions'
        severity:
          enum:
          - info
          - low
          - medium
          - high
          - critical
        labels:
          type: object
          maxProperties: 32
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,62}$
          additionalProperties:
            type: string
            maxLength: 128
        actions:
          description: Rule actions. These only create alerts and notifications; remote write actions go through
            the action framework, never through a rule.
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            enum:
            - create_alert
            - email
            - push
        incident_policy:
          enum:
          - none
          - create
          - group
    AlertRuleListResponse:
      description: One page of alert rules, newest first. Paging is a server-capped offset (limit 1-100, offset
        0-10000); next_offset is null on the last page. not-connected and unknown never carry rows or a cursor.
      type: object
      additionalProperties: false
      required:
      - state
      - rules
      - limit
      - offset
      - next_offset
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        rules:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AlertRule'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 10000
        next_offset:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            rules:
              maxItems: 0
            next_offset:
              type: 'null'
    AlertRuleDetailResponse:
      description: One alert rule. rule is non-null exactly when state is ok; an unknown id is a 404, not
        a state.
      type: object
      additionalProperties: false
      required:
      - state
      - rule
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        rule:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AlertRule'
      allOf:
      - if:
          properties:
            state:
              const: ok
          required:
          - state
        then:
          properties:
            rule:
              type: object
        else:
          properties:
            rule:
              type: 'null'
    AlertRuleUpdateRequest:
      description: 'Replace the definition of a draft or disabled rule. expected_version is the version the
        editor loaded; the edit is refused with 409 when the stored version differs, and an active rule must
        be disabled first. An edit always returns the rule to draft: it must be approved again.'
      type: object
      additionalProperties: false
      required:
      - expected_version
      - definition
      properties:
        expected_version:
          type: integer
          minimum: 1
          maximum: 1000000
        definition:
          $ref: '#/components/schemas/AlertRuleDefinition'
    AlertRuleApproveRequest:
      description: Approve (activate) exactly the version the reviewer saw. A rule changed since then is refused
        with 409; an invalid rule is refused with 422 and stays inactive.
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version:
          type: integer
          minimum: 1
          maximum: 1000000
    MaintenanceWindowListResponse:
      description: One page of maintenance windows ordered by start time. Same paging and not-connected/unknown
        rules as the rule list.
      type: object
      additionalProperties: false
      required:
      - state
      - windows
      - limit
      - offset
      - next_offset
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        windows:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MaintenanceWindow'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 10000
        next_offset:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            windows:
              maxItems: 0
            next_offset:
              type: 'null'
    MaintenanceWindowDetailResponse:
      description: One maintenance window. window is non-null exactly when state is ok.
      type: object
      additionalProperties: false
      required:
      - state
      - window
      properties:
        state:
          enum:
          - not-connected
          - ok
          - unknown
        window:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MaintenanceWindow'
      allOf:
      - if:
          properties:
            state:
              const: ok
          required:
          - state
        then:
          properties:
            window:
              type: object
        else:
          properties:
            window:
              type: 'null'
    MaintenanceWindowCreateRequest:
      description: 'Schedule a maintenance window. Cross-field rules not expressible in JSON Schema and enforced
        by the API models and the browser parser: ends_at must be after starts_at, at most 30 days later,
        ends_at must be in the future and starts_at at most one year ahead. A window with organisation scope
        needs a separate permission.'
      type: object
      additionalProperties: false
      required:
      - name
      - scope
      - starts_at
      - ends_at
      - evaluation
      - reason
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        scope:
          $ref: '#/components/schemas/AlertScope'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        evaluation:
          enum:
          - retain
          - disable
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
    AlertRuleEvaluateObservation:
      description: One reading of one monitored entity. All text is untrusted data used only for comparison.
      type: object
      additionalProperties: false
      required:
      - at
      - entity
      - scopes
      - value
      - text
      - anomaly
      - destination
      - device_groups
      properties:
        at:
          type: string
          format: date-time
        entity:
          type: string
          minLength: 1
          maxLength: 255
        scopes:
          description: Every scope the entity belongs to; the rule only sees entities inside its own scope.
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AlertScope'
        value:
          type:
          - number
          - 'null'
          minimum: -1000000000000000
          maximum: 1000000000000000
        text:
          type:
          - string
          - 'null'
          maxLength: 4096
        anomaly:
          enum:
          - above
          - below
          - normal
          - null
        destination:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        device_groups:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    AlertRuleEvaluateWindow:
      description: A sample maintenance window supplied for the dry-run (nothing is read from the store).
        ends_at must be after starts_at and at most 30 days later (API models and parser).
      type: object
      additionalProperties: false
      required:
      - scope
      - starts_at
      - ends_at
      - evaluation
      - status
      properties:
        scope:
          $ref: '#/components/schemas/AlertScope'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        evaluation:
          enum:
          - retain
          - disable
        status:
          enum:
          - scheduled
          - cancelled
    AlertRuleEvaluateRequest:
      description: 'Replay observations through a rule definition at fixed times, with no external effect:
        nothing is stored, sent or created. Observations must be in strictly ascending time order (API models
        and parser); each is judged at its own timestamp, so schedules, maintenance windows, for and cooldown
        are all derived from the supplied times. The combined length of all observation text is at most 262144
        characters (API models and parser).'
      type: object
      additionalProperties: false
      required:
      - definition
      - observations
      - windows
      properties:
        definition:
          $ref: '#/components/schemas/AlertRuleDefinition'
        observations:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/AlertRuleEvaluateObservation'
        windows:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AlertRuleEvaluateWindow'
    AlertRuleEvaluateProblem:
      description: A static configuration problem code and the contract field it concerns.
      type: object
      additionalProperties: false
      required:
      - code
      - field
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Z0-9_]+$
        field:
          type: string
          minLength: 1
          maxLength: 64
    AlertRuleEvaluateResult:
      description: The engine decision for one observation. notify means a notification would be released;
        blocked_by says why a firing alert was not notified. maintenance_windows are indexes into the supplied
        windows.
      type: object
      additionalProperties: false
      required:
      - at
      - outcome
      - phase
      - transition
      - notify
      - blocked_by
      - maintenance_windows
      properties:
        at:
          type: string
          format: date-time
        outcome:
          enum:
          - firing
          - pending
          - not-met
          - excepted
          - outside-schedule
          - no-data
          - out-of-scope
          - stale
          - future
          - maintenance-disabled
          - invalid-config
          - rule-not-active
        phase:
          enum:
          - inactive
          - pending
          - firing
        transition:
          enum:
          - fired
          - resolved
          - null
        notify:
          type: boolean
        blocked_by:
          enum:
          - maintenance
          - cooldown
          - null
        maintenance_windows:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 19
    AlertRuleEvaluateResponse:
      description: 'Dry-run verdict. valid is false when the definition cannot be evaluated here (fail closed):
        problems then lists why and results is empty. Otherwise problems is empty and results holds one decision
        per observation, in order. The dry-run is read-only.'
      type: object
      additionalProperties: false
      required:
      - valid
      - problems
      - results
      properties:
        valid:
          type: boolean
        problems:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/AlertRuleEvaluateProblem'
        results:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AlertRuleEvaluateResult'
      allOf:
      - if:
          properties:
            valid:
              const: true
          required:
          - valid
        then:
          properties:
            problems:
              maxItems: 0
        else:
          properties:
            problems:
              minItems: 1
            results:
              maxItems: 0
    DeviceListResponse:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, freshness]
      properties:
        items:
          type: array
