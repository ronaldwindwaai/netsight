      properties:
        state:
          enum: [not-connected, ok, unknown]
        observed_at:
          type: [string, 'null']
          format: date-time
        hops:
          type: array
          maxItems: 6
          items: {$ref: '#/components/schemas/DiagnosticPathHop'}
        links:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/DiagnosticPathLink'}
      allOf:
      - if:
          properties:
            state: {const: ok}
          required: [state]
        then:
          properties:
            observed_at: {type: string}
            hops: {minItems: 6}
            links: {minItems: 5}
        else:
          properties:
            observed_at: {type: 'null'}
            hops: {maxItems: 0}
            links: {maxItems: 0}
    DiagnosticSessionSummary:
      type: object
      additionalProperties: false
      required: [id, target, started_at, completed_at, probable_fault_domain, confidence]
      properties:
        id: {type: string, minLength: 47, maxLength: 47, pattern: '^diagnostic-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
        target: {type: string, minLength: 1, maxLength: 255, pattern: \S}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        probable_fault_domain:
          enum: [target, service, host, interface, access-device, core, firewall, wan-dns-external, null]
        confidence:
          enum: [low, medium, high, unknown]
    DiagnosticSessionResponse:
      type: object
      additionalProperties: false
      required: [state, session]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        session:
          oneOf:
          - {type: 'null'}
          - {$ref: '#/components/schemas/DiagnosticSession'}
      allOf:
      - if:
          properties:
            state: {const: ok}
          required: [state]
        then:
          properties:
            session: {type: object}
        else:
          properties:
            session: {type: 'null'}
    DiagnosticSessionListResponse:
      type: object
      additionalProperties: false
      required: [state, sessions, limit, offset, next_offset]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        sessions:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/DiagnosticSessionSummary'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 10000}
        next_offset:
          type: [integer, 'null']
          minimum: 1
          maximum: 10100
      allOf:
      - if:
          properties:
            state: {const: ok}
          required: [state]
        else:
          properties:
            sessions: {maxItems: 0}
            next_offset: {type: 'null'}
    InternetResponse:
      description: GET /api/v1/internet. A non-ok state carries no links; per-link blocks carry their own state so a missing source never reads as a healthy link.
      type: object
      additionalProperties: false
      required:
      - state
      - generated_at
      - links
      - failover
      - detail_redacted
      properties:
        state:
          enum:
          - not-connected
          - unknown
          - ok
        generated_at:
          type: string
          format: date-time
        links:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/WanLink'
        failover:
          $ref: '#/components/schemas/WanFailover'
        detail_redacted:
          type: boolean
          description: "True when the caller lacks internet:read_detail: the ISP name, gateway, public IP and per-link throughput are withheld (null). A null there then means restricted, not 'not reported' (cross-field: a redacted response carries none of them)."
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            links:
              maxItems: 0
            failover:
              properties:
                state:
                  const: unknown
    WanConfigured:
      type: object
      additionalProperties: false
      required:
      - isp
      - gateway
      - probe_location
      properties:
        isp:
          minLength: 1
          maxLength: 128
          type:
          - string
          - 'null'
        gateway:
          minLength: 1
          maxLength: 45
          type:
          - string
          - 'null'
        probe_location:
          oneOf:
          - type: 'null'
          - enum:
            - cloud-external
            - user-lan
            - server-vlan
            - branch
            - wifi
            - remote-site
      description: Operator declarations (not telemetry); the UI labels them as configured.
    WanInterfaceReading:
      type: object
      additionalProperties: false
      required:
      - state
      - oper_status
      - capacity_bps
      - rx_bps
      - tx_bps
      - utilisation_pct
      - public_ip
      - freshness
      properties:
        state:
          enum:
          - not-connected
          - unknown
          - ok
        oper_status:
          oneOf:
          - type: 'null'
          - enum:
            - up
            - down
            - testing
            - dormant
            - notPresent
            - lowerLayerDown
            - unknown
        capacity_bps:
          minimum: 0
          type:
          - integer
          - 'null'
        rx_bps:
          minimum: 0
          type:
          - integer
          - 'null'
        tx_bps:
          minimum: 0
          type:
          - integer
          - 'null'
        utilisation_pct:
          minimum: 0
          maximum: 1000
          type:
          - number
          - 'null'
        public_ip:
          minLength: 1
          maxLength: 45
          type:
          - string
          - 'null'
        freshness:
          $ref: '#/components/schemas/Freshness'
      description: LibreNMS interface metrics for the declared WAN port. Every value is reported or null; utilisation_pct is derived (larger of rx/tx over capacity) and only when all are known.
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            oper_status:
              type: 'null'
            capacity_bps:
              type: 'null'
            rx_bps:
              type: 'null'
            tx_bps:
              type: 'null'
            utilisation_pct:
              type: 'null'
            public_ip:
              type: 'null'
    WanQuality:
      type: object
      additionalProperties: false
      required:
      - state
      - latency_ms
      - jitter_ms
      - loss_pct
      - dns_status
      - dns_latency_ms
      - sample_count
      - window_seconds
      - freshness
      properties:
        state:
          enum:
          - not-connected
          - unknown
          - ok
        latency_ms:
          minimum: 0
          maximum: 3600000
          type:
          - number
          - 'null'
        jitter_ms:
          minimum: 0
          maximum: 3600000
          type:
          - number
          - 'null'
        loss_pct:
          minimum: 0
          maximum: 100
          type:
          - number
          - 'null'
        dns_status:
          oneOf:
          - type: 'null'
          - enum:
            - pass
            - fail
            - unknown
        dns_latency_ms:
          minimum: 0
          maximum: 3600000
          type:
          - number
          - 'null'
        sample_count:
          type: integer
          minimum: 0
          maximum: 100000
        window_seconds:
          type: integer
          minimum: 0
          maximum: 10000000
        freshness:
          $ref: '#/components/schemas/Freshness'
      description: Latency, jitter, loss and DNS computed from the stored probe samples of the window.
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            latency_ms:
              type: 'null'
            jitter_ms:
              type: 'null'
            loss_pct:
              type: 'null'
            dns_status:
              type: 'null'
            dns_latency_ms:
              type: 'null'
            sample_count:
              const: 0
    WanAvailability:
      type: object
      additionalProperties: false
      required:
      - state
      - period_start
      - period_end
      - uptime_pct
      - coverage_pct
      - current_outage_started_at
      - current_outage_seconds
      - freshness
      properties:
        state:
          enum:
          - not-connected
          - unknown
          - ok
        period_start:
          format: date-time
          type:
          - string
          - 'null'
        period_end:
          format: date-time
          type:
          - string
          - 'null'
        uptime_pct:
          minimum: 0
          maximum: 100
          type:
          - number
          - 'null'
        coverage_pct:
          minimum: 0
          maximum: 100
          type:
          - number
          - 'null'
        current_outage_started_at:
          format: date-time
          type:
          - string
          - 'null'
        current_outage_seconds:
          minimum: 0
          maximum: 10000000
          type:
          - integer
          - 'null'
        freshness:
          $ref: '#/components/schemas/Freshness'
      description: Month-to-date availability and the outage in progress, from stored probe cycles. current_outage_started_at and current_outage_seconds are both set or both null (cross-field, not expressible here).
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            period_start:
              type: 'null'
            period_end:
              type: 'null'
            uptime_pct:
              type: 'null'
            coverage_pct:
              type: 'null'
            current_outage_started_at:
              type: 'null'
            current_outage_seconds:
              type: 'null'
    WanLink:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - role
      - configured
      - status
      - interface
      - quality
      - availability
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,47}$
          minLength: 1
          maxLength: 48
        name:
          type: string
          minLength: 1
          maxLength: 128
        role:
          enum:
          - primary
          - backup
        configured:
          $ref: '#/components/schemas/WanConfigured'
        status:
          enum:
          - up
          - degraded
          - down
          - unknown
        interface:
          $ref: '#/components/schemas/WanInterfaceReading'
        quality:
          $ref: '#/components/schemas/WanQuality'
        availability:
          $ref: '#/components/schemas/WanAvailability'
      description: status is inferred from the interface state and the latest probe round; unknown when a source is silent.
    WanFailover:
      type: object
      additionalProperties: false
      required:
      - state
      - basis
      properties:
        state:
          enum:
          - single-link
          - normal
          - failed-over
          - all-down
          - unknown
        basis:
          enum:
          - inferred
          - unknown
      description: Derived from link status only (routing is not read); basis says so.
      allOf:
      - if:
          properties:
            state:
              const: unknown
        then:
          properties:
            basis:
              const: unknown
        else:
          properties:
            basis:
              const: inferred
    InternetSlaResponse:
      description: GET /api/v1/internet/sla?month=YYYY-MM. Server-bounded months; a non-ok state carries no links.
      type: object
      additionalProperties: false
      required:
      - state
      - month
      - period_start
      - period_end
      - generated_at
      - links
      properties:
        state:
          enum:
          - not-connected
          - unknown
          - ok
        month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          minLength: 7
          maxLength: 7
        period_start:
          format: date-time
          type:
          - string
          - 'null'
        period_end:
          format: date-time
          type:
          - string
          - 'null'
        generated_at:
          type: string
          format: date-time
        links:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/InternetSlaLink'
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            links:
              maxItems: 0
            period_start:
              type: 'null'
            period_end:
              type: 'null'
        else:
          properties:
            period_start:
              type: string
            period_end:
              type: string
    InternetSlaViolation:
      type: object
      additionalProperties: false
      required:
      - kind
      - target_pct
      - actual_pct
      properties:
        kind:
          const: uptime-below-target
        target_pct:
          type: number
          minimum: 0
          maximum: 100
        actual_pct:
          type: number
          minimum: 0
          maximum: 100
    InternetSlaLink:
      type: object
      additionalProperties: false
      required:
      - link_id
      - name
      - state
      - uptime_target_pct
      - total_seconds
      - up_seconds
      - degraded_seconds
      - down_seconds
      - unknown_seconds
      - uptime_pct
      - coverage_pct
      - outage_count
      - longest_outage_seconds
      - cycle_count
      - windows_truncated
      - violations
      properties:
        link_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,47}$
          minLength: 1
          maxLength: 48
        name:
          type: string
          minLength: 1
          maxLength: 128
        state:
          enum:
          - not-connected
          - unknown
          - ok
        uptime_target_pct:
          exclusiveMinimum: 0
          maximum: 100
          type:
          - number
          - 'null'
        total_seconds:
          minimum: 0
          maximum: 10000000
          type:
          - integer
          - 'null'
        up_seconds:
          minimum: 0
          maximum: 10000000
          type:
          - integer
          - 'null'
        degraded_seconds:
          minimum: 0
          maximum: 10000000
          type:
          - integer
          - 'null'
        down_seconds:
          minimum: 0
          maximum: 10000000
          type:
          - integer
          - 'null'
        unknown_seconds:
          minimum: 0
          maximum: 10000000
          type:
          - integer
          - 'null'
        uptime_pct:
          minimum: 0
          maximum: 100
          type:
          - number
          - 'null'
        coverage_pct:
          minimum: 0
          maximum: 100
          type:
          - number
          - 'null'
        outage_count:
          minimum: 0
          maximum: 1000000
          type:
          - integer
          - 'null'
        longest_outage_seconds:
          minimum: 0
          maximum: 10000000
          type:
          - integer
          - 'null'
        cycle_count:
          minimum: 0
          maximum: 1000000
          type:
          - integer
          - 'null'
        windows_truncated:
          type:
          - boolean
          - 'null'
          description: "True when the evidence export lists fewer windows than the month holds; the figures are never truncated. Null when the link is not ok."
        violations:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/InternetSlaViolation'
      description: Deterministic month figures from stored probe cycles. up + degraded + down + unknown seconds equal total_seconds (cross-field). uptime_pct is (up + degraded) over known time and null when nothing was known. Time with no probe round is unknown, never up or down.
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            total_seconds:
              type: 'null'
            up_seconds:
              type: 'null'
            degraded_seconds:
              type: 'null'
            down_seconds:
              type: 'null'
            unknown_seconds:
              type: 'null'
            uptime_pct:
              type: 'null'
            coverage_pct:
              type: 'null'
            outage_count:
              type: 'null'
            longest_outage_seconds:
              type: 'null'
            cycle_count:
              type: 'null'
            windows_truncated:
              type: 'null'
            violations:
              maxItems: 0
        else:
          properties:
            total_seconds:
              type: integer
            up_seconds:
              type: integer
            degraded_seconds:
              type: integer
            down_seconds:
              type: integer
            unknown_seconds:
              type: integer
            coverage_pct:
              type: number
            outage_count:
              type: integer
            longest_outage_seconds:
              type: integer
            cycle_count:
              type: integer
            windows_truncated:
              type: boolean
    InternetSlaExportWindow:
      type: object
      additionalProperties: false
      required:
      - kind
      - started_at
      - ended_at
      - duration_seconds
      - sample_count
      properties:
        kind:
          enum:
          - down
          - degraded
          - unknown
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer
          minimum: 0
          maximum: 10000000
        sample_count:
          type: integer
          minimum: 0
          maximum: 1000000
      description: ended_at is after started_at (cross-field). sample_count 0 is a gap in sampling.
    InternetSlaExportSource:
      type: object
      additionalProperties: false
      required:
      - probe
      - target
      - location
      properties:
        probe:
          enum:
          - icmp
          - tcp
          - dns
        target:
          type: string
          minLength: 1
          maxLength: 253
        location:
          oneOf:
          - type: 'null'
          - enum:
            - cloud-external
            - user-lan
            - server-vlan
            - branch
            - wifi
            - remote-site
    InternetSlaExportLink:
      type: object
      additionalProperties: false
      required:
      - link
      - isp
      - sources
      - windows
      - windows_truncated
      properties:
        link:
          $ref: '#/components/schemas/InternetSlaLink'
        isp:
          minLength: 1
          maxLength: 128
          type:
          - string
          - 'null'
        sources:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/InternetSlaExportSource'
        windows:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/InternetSlaExportWindow'
        windows_truncated:
          type: boolean
      allOf:
      - if:
          properties:
            link:
              properties:
                state:
                  enum:
                  - not-connected
                  - unknown
        then:
          properties:
            sources:
              maxItems: 0
            windows:
              maxItems: 0
            windows_truncated:
              const: false
    InternetSlaExport:
      description: GET /api/v1/internet/sla/export?format=json. Outage, degraded and unknown windows with probe sources and round counts; nothing is inferred beyond the samples.
      type: object
      additionalProperties: false
      required:
      - state
      - month
      - period_start
      - period_end
      - generated_at
      - basis
      - detail_redacted
      - links
      properties:
        state:
          enum:
          - not-connected
          - unknown
          - ok
        month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          minLength: 7
          maxLength: 7
        period_start:
          format: date-time
          type:
          - string
          - 'null'
        period_end:
          format: date-time
          type:
          - string
          - 'null'
        generated_at:
          type: string
          format: date-time
        basis:
          type: string
          minLength: 1
          maxLength: 1000
        detail_redacted:
          type: boolean
          description: "True when the caller lacks internet:read_detail: the ISP name is withheld (null)."
        links:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/InternetSlaExportLink'
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            links:
              maxItems: 0
            period_start:
              type: 'null'
            period_end:
              type: 'null'
        else:
          properties:
            period_start:
              type: string
            period_end:
              type: string
    IdentityEntityRef:
      type: object
      additionalProperties: false
      required:
      - type
      - id
      - label
      properties:
        type:
          enum:
          - person
          - account
          - device
          - ip
          - mac
          - switch
          - ap
          - port
          - vlan
          - hostname
        id:
          type: string
          minLength: 1
          maxLength: 128
        label:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
          pattern: \S
          description: Untrusted display text (a hostname, a user name). Rendered as data only.
      description: One node of Person -> Account -> Device -> IP -> MAC -> Switch/AP -> Port -> VLAN. Identity is (type, id); ids are canonical, never an e-mail address or a display name.
      allOf:
      - if:
          properties:
            type:
              const: person
          required:
          - type
        then:
          properties:
            id:
              pattern: ^person-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - if:
          properties:
            type:
              const: account
          required:
          - type
        then:
          properties:
            id:
              pattern: ^account-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - if:
          properties:
            type:
              const: device
          required:
          - type
        then:
          properties:
            id:
              pattern: ^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - if:
          properties:
            type:
              const: switch
          required:
          - type
        then:
          properties:
            id:
              pattern: ^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - if:
          properties:
            type:
              const: ap
          required:
          - type
        then:
          properties:
            id:
              pattern: ^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - if:
          properties:
            type:
              const: port
          required:
          - type
        then:
          properties:
            id:
              pattern: ^port-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - if:
          properties:
            type:
              const: ip
          required:
          - type
        then:
          properties:
            id:
              pattern: ^[0-9a-f:.]{2,45}$
      - if:
          properties:
            type:
              const: mac
          required:
          - type
        then:
          properties:
            id:
              pattern: ^([0-9a-f]{2}:){5}[0-9a-f]{2}$
      - if:
          properties:
            type:
              const: vlan
          required:
          - type
        then:
          properties:
            id:
              pattern: ^vlan-([1-9][0-9]{0,2}|[1-3][0-9]{3}|40[0-8][0-9]|409[0-4])$
      - if:
          properties:
            type:
              const: hostname
          required:
          - type
        then:
          properties:
            id:
              pattern: ^[a-z0-9]([a-z0-9._-]{0,126}[a-z0-9])?$
    IdentityEvidenceRef:
      type: object
      additionalProperties: false
      required:
      - id
      - source
      - kind
      - observed_at
      - valid_from
      - valid_to
      - confidence
      properties:
        id:
          type: string
          minLength: 3
          maxLength: 161
          pattern: ^[a-z0-9][a-z0-9_.-]{0,31}:.+$
        source:
          type: string
          pattern: ^[a-z0-9][a-z0-9_.-]{0,31}$
        kind:
          enum:
          - dhcp-lease
          - radius-session
          - vpn-session
          - wifi-association
          - switch-mac-table
          - endpoint-agent
          - directory-account
          - idp-signin
          - dns-record
          - asset-assignment
        observed_at:
          type: string
          format: date-time
        valid_from:
          type: string
          format: date-time
        valid_to:
          type:
          - string
          - 'null'
          format: date-time
          description: Null when the source recorded no end; the engine then trusts it only for a bounded time after observed_at.
        confidence:
          type: number
          minimum: 0
          maximum: 1
      description: A pointer to the evidence behind a link (drill-down). It names the source and the window, never the entities.
    IdentityCandidate:
      type: object
      additionalProperties: false
      required:
      - entity
      - basis
      - confidence
      - evidence
      properties:
        entity:
          $ref: '#/components/schemas/IdentityEntityRef'
        basis:
          enum:
          - observed
          - inferred
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/IdentityEvidenceRef'
      description: One entity a link or an attribution could point at. Its basis describes that candidate's own evidence only.
    IdentityLink:
      type: object
      additionalProperties: false
      required:
      - relation
      - source
      - target
      - basis
      - confidence
      - valid_from
      - valid_to
      - as_of
      - reason
      - evidence
      - ambiguous
      - candidates
      properties:
        relation:
          enum:
          - person-account
          - account-device
          - person-device
          - account-mac
          - account-ip
          - device-ip
          - device-mac
          - ip-mac
          - mac-switch
          - mac-ap
          - mac-port
          - mac-vlan
          - port-vlan
          - hostname-ip
          - hostname-device
          - identity
        source:
          $ref: '#/components/schemas/IdentityEntityRef'
        target:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IdentityEntityRef'
        basis:
          enum:
          - observed
          - inferred
          - unknown
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        valid_from:
          type:
          - string
          - 'null'
          format: date-time
        valid_to:
          type:
          - string
          - 'null'
          format: date-time
        as_of:
          type: string
          format: date-time
        reason:
          oneOf:
          - type: 'null'
          - enum:
            - conflicting-evidence
            - declared-assignment
            - expired
            - guest-network
            - indirect-evidence
            - ip-only
            - low-confidence
            - multiple-candidates
            - name-match
            - no-evidence
            - restricted
            - shared-address
            - source-unavailable
            - vpn-no-session
        evidence:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/IdentityEvidenceRef'
        ambiguous:
          type: boolean
        candidates:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/IdentityCandidate'
      description: 'One correlation, in walk order (source is nearer the subject). observed: a direct source saw it, with a target, confidence, window and evidence. inferred: a declaration or weak association, confidence capped at 0.7, with a reason. unknown: no target and no confidence; ambiguous when several candidates conflict (never silently picked).'
      allOf:
      - if:
          properties:
            basis:
              const: observed
          required:
          - basis
        then:
          properties:
            target:
              $ref: '#/components/schemas/IdentityEntityRef'
            confidence:
              type: number
              minimum: 0
              maximum: 1
            valid_from:
              type: string
              format: date-time
            valid_to:
              type: string
              format: date-time
            reason:
              type: 'null'
            evidence:
              minItems: 1
            ambiguous:
              const: false
            candidates:
              maxItems: 0
      - if:
          properties:
            basis:
              const: inferred
          required:
          - basis
        then:
          properties:
            target:
              $ref: '#/components/schemas/IdentityEntityRef'
            confidence:
              type: number
              minimum: 0
              maximum: 0.7
            valid_from:
              type: string
              format: date-time
            valid_to:
              type: string
              format: date-time
            reason:
              enum:
              - declared-assignment
              - indirect-evidence
              - low-confidence
              - name-match
              - conflicting-evidence
            evidence:
              minItems: 1
            ambiguous:
              const: false
            candidates:
              maxItems: 0
      - if:
          properties:
            basis:
              const: unknown
          required:
          - basis
        then:
          properties:
            target:
              type: 'null'
            confidence:
              type: 'null'
            valid_from:
              type: 'null'
            valid_to:
              type: 'null'
            reason:
              enum:
              - no-evidence
              - expired
              - conflicting-evidence
              - multiple-candidates
              - shared-address
              - vpn-no-session
              - guest-network
              - ip-only
              - source-unavailable
              - restricted
          allOf:
          - if:
              properties:
                ambiguous:
                  const: true
              required:
              - ambiguous
            then:
              properties:
                candidates:
                  minItems: 2
          - if:
              properties:
                ambiguous:
                  const: false
              required:
              - ambiguous
            then:
              properties:
                candidates:
                  maxItems: 0
    IdentitySession:
      type: object
      additionalProperties: false
      required:
      - kind
      - basis
      - confidence
      - valid_from
      - valid_to
      - links
      properties:
        kind:
          enum:
          - wired
          - wifi
          - vpn
          - network
        basis:
          enum:
          - observed
          - inferred
        confidence:
          type: number
          minimum: 0
          maximum: 1
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        links:
          type: array
          minItems: 2
          maxItems: 80
          items:
            allOf:
            - $ref: '#/components/schemas/IdentityLink'
            - properties:
                basis:
                  enum:
                  - observed
                  - inferred
          prefixItems:
          - allOf:
            - $ref: '#/components/schemas/IdentityLink'
            - properties:
                basis:
                  enum:
                  - observed
                  - inferred
                relation:
                  const: person-account
          - allOf:
            - $ref: '#/components/schemas/IdentityLink'
            - properties:
                basis:
                  enum:
                  - observed
                  - inferred
                relation:
                  enum:
                  - account-mac
                  - account-ip
      description: One current way a person is on the network, as an ordered link list. basis is the weakest link's basis and confidence the lowest link confidence (cross-field, checked by the model and the parsers).
    IdentityAttribution:
      type: object
      additionalProperties: false
      required:
      - basis
      - reason
      - ambiguous
      - links
      - candidates
      properties:
        basis:
          enum:
          - observed
          - inferred
          - unknown
        reason:
          oneOf:
          - type: 'null'
          - enum:
            - conflicting-evidence
            - declared-assignment
            - expired
            - guest-network
            - indirect-evidence
            - ip-only
            - low-confidence
            - multiple-candidates
            - name-match
            - no-evidence
            - restricted
            - shared-address
            - source-unavailable
            - vpn-no-session
        ambiguous:
          type: boolean
        links:
          type: array
          maxItems: 8
          items:
            allOf:
            - $ref: '#/components/schemas/IdentityLink'
            - properties:
                relation:
                  const: identity
        candidates:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/IdentityCandidate'
      description: 'Who is behind the subject. observed or inferred: one or more identity links, strongest first. unknown: no links, with a reason; ambiguous (two or more candidates, never picked) when the evidence names several persons or conflicts.'
      allOf:
      - if:
          properties:
            basis:
              const: observed
          required:
          - basis
        then:
          properties:
            reason:
              type: 'null'
            links:
              minItems: 1
            ambiguous:
              const: false
            candidates:
              maxItems: 0
      - if:
          properties:
            basis:
              const: inferred
          required:
          - basis
        then:
          properties:
            reason:
              enum:
              - declared-assignment
              - indirect-evidence
              - low-confidence
              - name-match
              - conflicting-evidence
            links:
              minItems: 1
            ambiguous:
              const: false
            candidates:
              maxItems: 0
      - if:
          properties:
            basis:
              const: unknown
          required:
          - basis
        then:
          properties:
            reason:
              enum:
              - no-evidence
              - expired
              - conflicting-evidence
              - multiple-candidates
              - shared-address
              - vpn-no-session
              - guest-network
              - ip-only
              - source-unavailable
              - restricted
            links:
              maxItems: 0
          allOf:
          - if:
              properties:
                ambiguous:
                  const: true
              required:
              - ambiguous
            then:
              properties:
                candidates:
                  minItems: 2
          - if:
              properties:
                ambiguous:
                  const: false
              required:
              - ambiguous
            then:
              properties:
                candidates:
                  maxItems: 0
    IdentitySourceStatus:
      type: object
      additionalProperties: false
      required:
      - source
      - state
      - record_count
      - truncated
      - freshness
      properties:
        source:
          type: string
          pattern: ^[a-z0-9][a-z0-9_.-]{0,31}$
        state:
          enum:
          - not-connected
          - unknown
          - ok
        record_count:
          type: integer
          minimum: 0
          maximum: 5000
        truncated:
          type: boolean
        freshness:
          $ref: '#/components/schemas/Freshness'
      description: The state of one evidence source. A source that is not configured is not-connected; one that failed is unknown, and absence of evidence from it is not evidence of absence.
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            record_count:
              const: 0
            truncated:
              const: false
    IdentityTimeWindow:
      type: object
      additionalProperties: false
      required:
      - from
      - to
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      description: The evidence window the server read (server-bounded, never caller-chosen).
    IdentityResolveResponse:
      type: object
      additionalProperties: false
      required:
      - state
      - subject
      - as_of
      - window
      - sources
      - attribution
      - endpoint
      - notes
      properties:
        state:
          enum:
          - not-connected
          - unknown
          - ok
        subject:
          type: object
          additionalProperties: false
          required:
          - kind
          - value
          properties:
            kind:
              enum:
              - ip
              - mac
              - hostname
            value:
              type: string
              minLength: 1
              maxLength: 128
        as_of:
          type: string
          format: date-time
        window:
          $ref: '#/components/schemas/IdentityTimeWindow'
        sources:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/IdentitySourceStatus'
        attribution:
          $ref: '#/components/schemas/IdentityAttribution'
        endpoint:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/IdentityLink'
        notes:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            enum:
            - register-is-current-state
          description: 'Server notes that qualify the answer. register-is-current-state: the answer is for an earlier time but rests on a register (NetBox) that records current state only.'
      description: 'GET /api/v1/identity/resolve. Who is behind an IP, MAC or hostname at a time, with the basis of every correlation. An IP address alone is never identity: without an account or an assignment the attribution is unknown.'
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
          required:
          - state
        then:
          properties:
            attribution:
              properties:
                basis:
                  const: unknown
                ambiguous:
                  const: false
            endpoint:
              maxItems: 0
    UserSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - display_name
      - account_count
      - assigned_device_count
      - session_count
      - presence
      - last_evidence_at
      properties:
        id:
          type: string
          pattern: ^person-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        display_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
          pattern: \S
        account_count:
          type: integer
          minimum: 0
          maximum: 1000
        assigned_device_count:
          type: integer
          minimum: 0
          maximum: 1000
        session_count:
          type: integer
          minimum: 0
          maximum: 1000
        presence:
          enum:
          - observed
          - inferred
          - unknown
          description: Basis of the person's current session evidence. unknown means no session is evidenced, which is not the same as offline.
        last_evidence_at:
          type:
          - string
          - 'null'
          format: date-time
      description: One person known to the evidence. Persons are keyed by canonical id, never by e-mail address or name.
      allOf:
      - if:
          properties:
            presence:
              const: unknown
          required:
          - presence
        then:
          properties:
            session_count:
              const: 0
    UserTrafficItem:
      type: object
      additionalProperties: false
      required:
      - address
      - bytes
      - covers_window
      properties:
        address:
          type: string
          minLength: 2
          maxLength: 45
          pattern: ^[0-9a-f:.]{2,45}$
        bytes:
          type:
          - integer
