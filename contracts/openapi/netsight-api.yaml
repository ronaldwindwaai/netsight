        freshness:
          $ref: '#/components/schemas/Freshness'
    SourceHealthResponse:
      type: object
      additionalProperties: false
      required: [source, status, reachable, latency_ms, checked_at, detail]
      properties:
        source:
          enum: [librenms, netbox]
        status:
          enum: [success, unavailable, forbidden, invalid-source-data]
        reachable:
          type: boolean
        latency_ms:
          type: [number, 'null']
          minimum: 0
        checked_at:
          type: string
          format: date-time
        detail:
          enum: [ok, unavailable, forbidden, invalid-source-data]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
              pattern: '^[A-Z0-9_]+$'
            message:
              type: string
            correlation_id:
              type: string
              minLength: 1
              maxLength: 64
    DiagnosticFinding:
      type: object
      additionalProperties: false
      required: [statement, evidence_ids]
      properties:
        statement:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '\S'
        evidence_ids:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 128
    DiagnosticProbeResult:
      type: object
      additionalProperties: false
      required: [id, kind, label, status, vantage, location, port, latency_ms, detail, observed_at, evidence_id]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        kind:
          enum: [identity, source-freshness, target-health, dns, icmp, tcp, http, https, service, dependencies, recent-changes, baseline]
        label: {type: string, minLength: 1, maxLength: 255, pattern: \S}
        status:
          enum: [pass, fail, unknown]
        vantage:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          pattern: \S
        location:
          enum: [cloud-external, user-lan, server-vlan, branch, wifi, remote-site, null]
        port:
          type: [integer, 'null']
          minimum: 1
          maximum: 65535
        latency_ms:
          type: [number, 'null']
          minimum: 0
          maximum: 3600000
        detail:
          type: [string, 'null']
          minLength: 1
          maxLength: 1000
          pattern: \S
        observed_at:
          type: [string, 'null']
          format: date-time
        evidence_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
      allOf:
      - if:
          properties:
            kind:
              not:
                enum: [tcp, http, https]
          required: [kind]
        then:
          properties:
            port: {type: 'null'}
    DiagnosticRun:
      type: object
      additionalProperties: false
      required: [id, target, target_id, symptom, vantage, started_at, completed_at, checks, facts, contradictions, unknowns, probable_fault_domain, confidence, alternative_hypotheses, recommended_next_checks, evidence_ids]
      properties:
        id:
          type: string
          minLength: 47
          maxLength: 47
          pattern: '^diagnostic-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        target:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
        target_id:
          type: [string, 'null']
          minLength: 43
          maxLength: 43
          pattern: '^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        symptom:
          type: [string, 'null']
          minLength: 1
          maxLength: 1000
          pattern: '\S'
        vantage:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          pattern: '\S'
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        checks:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/DiagnosticProbeResult'
        facts:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/DiagnosticFinding'
        contradictions:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/DiagnosticFinding'
        unknowns:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/DiagnosticFinding'
        probable_fault_domain:
          enum: [target, service, host, interface, access-device, core, firewall, wan-dns-external, null]
        confidence:
          enum: [low, medium, high, unknown]
        alternative_hypotheses:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/DiagnosticFinding'
        recommended_next_checks:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/DiagnosticFinding'
        evidence_ids:
          type: array
          maxItems: 256
          items:
            type: string
            minLength: 1
            maxLength: 128
    DiagnosticRunRequest:
      type: object
      additionalProperties: false
      required: [target, symptom, vantage, requested_checks]
      properties:
        target:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
        symptom:
          type: [string, 'null']
          minLength: 1
          maxLength: 1000
          pattern: '\S'
        vantage:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          pattern: '\S'
        requested_checks:
          type: array
          minItems: 1
          maxItems: 12
          items:
            enum: [identity, source-freshness, target-health, dns, icmp, tcp, http, https, service, dependencies, recent-changes, baseline]
    DiagnosticRunResponse:
      type: object
      additionalProperties: false
      required: [state, run, stored]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        run:
          oneOf:
          - {type: 'null'}
          - {$ref: '#/components/schemas/DiagnosticRun'}
        stored: {type: boolean}
      allOf:
      - if:
          properties:
            state: {const: ok}
          required: [state]
        then:
          properties:
            run: {type: object}
        else:
          properties:
            run: {type: 'null'}
      - if:
          properties:
            state: {const: ok}
          required: [state]
        else:
          properties:
            stored: {const: false}
    DiagnosticSession:
      type: object
      additionalProperties: false
      required: [run, locations, probable_cause, recent_changes, path]
      properties:
        run: {$ref: '#/components/schemas/DiagnosticRun'}
        locations:
          type: array
          minItems: 6
          maxItems: 6
          items: {$ref: '#/components/schemas/DiagnosticLocationResult'}
        probable_cause: {$ref: '#/components/schemas/DiagnosticProbableCause'}
        recent_changes: {$ref: '#/components/schemas/DiagnosticRecentChanges'}
        path: {$ref: '#/components/schemas/DiagnosticPath'}
    DiagnosticLocationResult:
      type: object
      additionalProperties: false
      required: [location, state, status, passed, failed, unknown_checks, check_ids]
      properties:
        location:
          enum: [cloud-external, user-lan, server-vlan, branch, wifi, remote-site]
        state:
          enum: [observed, unknown, not-connected]
        status:
          enum: [pass, fail, null]
        passed: {type: integer, minimum: 0, maximum: 64}
        failed: {type: integer, minimum: 0, maximum: 64}
        unknown_checks: {type: integer, minimum: 0, maximum: 64}
        check_ids:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 128}
    DiagnosticEvidenceItem:
      type: object
      additionalProperties: false
      required: [basis, statement, check_ids]
      properties:
        basis:
          enum: [observed, inferred, unknown]
        statement: {type: string, minLength: 1, maxLength: 1000, pattern: \S}
        check_ids:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 128}
    DiagnosticProbableCause:
      type: object
      additionalProperties: false
      required: [domain, confidence, basis, pattern, summary, evidence]
      properties:
        domain:
          enum: [target, service, host, interface, access-device, core, firewall, wan-dns-external, null]
        confidence:
          enum: [low, medium, high, unknown]
        basis:
          enum: [inferred, unknown]
        pattern:
          enum: [external-only-failure, service-failure, other, none]
        summary: {type: string, minLength: 1, maxLength: 1000, pattern: \S}
        evidence:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/DiagnosticEvidenceItem'}
    DiagnosticChangeSource:
      type: object
      additionalProperties: false
      required: [source, state]
      properties:
        source:
          enum: [incidents, alerts, configuration-changes]
        state:
          enum: [not-connected, ok, unknown]
    DiagnosticChangeItem:
      type: object
      additionalProperties: false
      required: [kind, ref_id, severity, title, title_redacted, occurred_at, scope, relation]
      properties:
        kind:
          enum: [incident, alert]
        ref_id: {type: string, minLength: 1, maxLength: 128}
        severity:
          enum: [low, medium, high, critical, null]
        title: {type: string, minLength: 1, maxLength: 255, pattern: \S}
        title_redacted: {type: boolean}
        occurred_at: {type: string, format: date-time}
        scope:
          enum: [target, time-window]
        relation: {const: may-correlate}
      description: >-
        An incident carries its severity; its title is never stored with the session. It is joined
        at read time only for a caller holding incidents:read, otherwise title is a fixed
        placeholder and title_redacted is true. An alert has no severity and a stored title.
      allOf:
      - if:
          properties:
            kind: {const: incident}
          required: [kind]
        then:
          properties:
            severity: {type: string}
        else:
          properties:
            severity: {type: 'null'}
            title_redacted: {const: false}
    DiagnosticRecentChanges:
      type: object
      additionalProperties: false
      required: [state, window_start, window_end, sources, items]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        sources:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: '#/components/schemas/DiagnosticChangeSource'}
        items:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/DiagnosticChangeItem'}
      allOf:
      - if:
          properties:
            state: {const: ok}
          required: [state]
        else:
          properties:
            items: {maxItems: 0}
    DiagnosticPathHop:
      type: object
      additionalProperties: false
      required: [tier, state, device_id, name, highlight]
      properties:
        tier:
          enum: [user, access-point, access-switch, core, firewall, server]
        state:
          enum: [known, unknown]
        device_id:
          type: [string, 'null']
          minLength: 43
          maxLength: 43
          pattern: ^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
          pattern: \S
        highlight:
          enum: [suspected, null]
    DiagnosticPathLink:
      type: object
      additionalProperties: false
      required: [from_tier, to_tier, state]
      properties:
        from_tier:
          enum: [user, access-point, access-switch, core, firewall, server]
        to_tier:
          enum: [user, access-point, access-switch, core, firewall, server]
        state:
          enum: [known, unknown]
    DiagnosticPath:
      type: object
      additionalProperties: false
