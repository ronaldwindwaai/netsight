        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      responses:
        '200':
          description: Stored sessions, or an explicit not-connected/unknown state without rows
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticSessionListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /diagnostics/{diagnostic_id}:
    get:
      summary: Read one stored, immutable diagnostic session by its run id
      operationId: getDiagnosticSession
      parameters:
        - in: path
          name: diagnostic_id
          required: true
          schema:
            type: string
            minLength: 47
            maxLength: 47
            pattern: '^diagnostic-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      responses:
        '200':
