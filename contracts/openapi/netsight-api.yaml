      - hostname
      properties:
        ip:
          minLength: 2
          maxLength: 45
          type:
          - string
          - 'null'
        mac:
          minLength: 17
          maxLength: 17
          pattern: ^(?:[0-9a-f]{2}:){5}[0-9a-f]{2}$
          type:
          - string
          - 'null'
        hostname:
          minLength: 1
          maxLength: 255
          type:
          - string
          - 'null'
      description: What was seen. At least one of the three is reported (checked by pydantic and the TS parser).
    UnknownDeviceCheck:
      type: object
      additionalProperties: false
      required:
      - field
      - result
      - detail
      properties:
        field:
          enum:
          - ip
          - mac
          - hostname
        result:
          enum:
          - match
          - no-match
          - not-checked
        detail:
          minLength: 1
          maxLength: 255
          type:
          - string
          - 'null'
      description: 'One comparison with NetBox. match: NetBox has it. no-match: NetBox was asked and does not. not-checked: it could not be asked (nothing observed, lookup limit, source error).'
    UnknownDeviceComparison:
      type: object
      additionalProperties: false
      required:
      - checks
      - checked_at
      properties:
        checks:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/UnknownDeviceCheck'
        checked_at:
          type: string
          format: date-time
      description: The comparison against NetBox, one check per field in the order ip, mac, hostname. A finding exists only when no check matched.
    UnknownDeviceProposedAction:
      type: object
      additionalProperties: false
      required:
      - action_type
      - state
      - risk
      - executable
      - awaiting
      - rationale
      properties:
        action_type:
          const: endpoint.isolate
        state:
          const: proposed
        risk:
          const: C
        executable:
          const: false
        awaiting:
          const: action-engine
        rationale:
          minLength: 1
          maxLength: 255
          type: string
      description: 'A recommendation only. No execution path exists: isolating an endpoint is owned by the action engine (Step 14) and needs step-up, a reason and human approval.'
    UnknownDeviceFinding:
      type: object
      additionalProperties: false
      required:
      - id
      - state
      - severity
      - severity_basis
      - assignee_id
      - first_seen_at
      - last_seen_at
      - seen_count
      - recurrence_of
      - endpoint
      - chain
      - comparison
      - proposed_action
      properties:
        id:
          minLength: 51
          maxLength: 51
          pattern: ^unknown-device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          type: string
        state:
          enum:
          - new
          - acknowledged
          - investigating
          - resolved
          - false-positive
        severity:
          enum:
          - low
          - medium
          - high
          - critical
          - unknown
        severity_basis:
          enum:
          - policy-rule
          - policy-default
          - no-policy
        assignee_id:
          minLength: 1
          maxLength: 255
          type:
          - string
          - 'null'
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        seen_count:
          minimum: 1
          maximum: 1000000
          type: integer
        recurrence_of:
          oneOf:
          - type: 'null'
          - minLength: 51
            maxLength: 51
            pattern: ^unknown-device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
            type: string
        endpoint:
          $ref: '#/components/schemas/UnknownDeviceEndpoint'
        chain:
          type: array
          minItems: 5
          maxItems: 5
          prefixItems:
          - allOf:
            - $ref: '#/components/schemas/UnknownDeviceLinkSlot'
            - properties:
                slot:
                  const: ip
          - allOf:
            - $ref: '#/components/schemas/UnknownDeviceLinkSlot'
            - properties:
                slot:
                  const: mac
          - allOf:
            - $ref: '#/components/schemas/UnknownDeviceLinkSlot'
            - properties:
                slot:
                  const: attachment
          - allOf:
            - $ref: '#/components/schemas/UnknownDeviceLinkSlot'
            - properties:
                slot:
                  const: port
          - allOf:
            - $ref: '#/components/schemas/UnknownDeviceLinkSlot'
            - properties:
                slot:
                  const: vlan
          items: false
        comparison:
          $ref: '#/components/schemas/UnknownDeviceComparison'
        proposed_action:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UnknownDeviceProposedAction'
      description: 'An unknown-device finding: something telemetry saw that NetBox does not know. The chain holds only the links actually observed; the rest are unknown. Severity comes from the operator''s policy, never from a guess.'
      allOf:
      - if:
          properties:
            severity:
              const: unknown
        then:
          properties:
            severity_basis:
              const: no-policy
      - if:
          properties:
            severity:
              enum:
              - low
              - medium
              - high
              - critical
        then:
          properties:
            severity_basis:
              enum:
              - policy-rule
              - policy-default
    UnknownDeviceStateCount:
