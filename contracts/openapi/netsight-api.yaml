  # <<< step8:p-unknown
components:
  headers:
    CorrelationId:
      description: Correlates the request, response and server-side workflow.
      schema:
        type: string
        minLength: 1
        maxLength: 64
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    DeviceStatusCount:
      type: object
      additionalProperties: false
      required: [status, count]
      properties:
        status:
          enum: [healthy, warning, degraded, critical, offline, unknown, maintenance]
        count:
          type: integer
          minimum: 0
    DeviceHealthSummary:
      type: object
      additionalProperties: false
      required: [total, by_status, freshness]
      properties:
        total:
          type: integer
          minimum: 0
        by_status:
          type: array
          items:
            $ref: '#/components/schemas/DeviceStatusCount'
        freshness:
          $ref: '#/components/schemas/Freshness'
    SourceState:
      type: object
      additionalProperties: false
      required: [configured, status]
      properties:
        configured:
          type: boolean
        status:
          enum: [success, unavailable, forbidden, invalid-source-data, not-configured]
    OverviewResponse:
      type: object
      additionalProperties: false
      required: [devices, sources]
      properties:
        devices:
          $ref: '#/components/schemas/DeviceHealthSummary'
        sources:
          type: object
          additionalProperties: false
          required: [librenms, netbox]
          properties:
            librenms:
              $ref: '#/components/schemas/SourceState'
            netbox:
              $ref: '#/components/schemas/SourceState'
    ProviderState:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured:
          type: boolean
    AuthProvidersResponse:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: object
          additionalProperties: false
          required: [microsoft, google]
          properties:
            microsoft:
              $ref: '#/components/schemas/ProviderState'
            google:
              $ref: '#/components/schemas/ProviderState'
    Freshness:
      $ref: '../json-schema/common.schema.json#/$defs/freshness'
    Device:
      $ref: '../json-schema/device.schema.json'
    TopologyNode:
      type: object
      additionalProperties: false
      required: [device_id]
      properties:
        device_id:
          type: string
          minLength: 1
    TopologyEdge:
      type: object
      additionalProperties: false
      required: [source_device_id, target_device_id, source]
      properties:
        source_device_id:
          type: string
        target_device_id:
          type: string
        source:
          enum: [lldp, cdp, routing, switching, netbox, manual]
        observed_at:
          type: [string, 'null']
          format: date-time
    TopologyResponse:
      type: object
      additionalProperties: false
      required: [state, nodes, edges, freshness]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TopologyNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/TopologyEdge'
        freshness:
          $ref: '#/components/schemas/Freshness'
    ReconciliationFinding:
      type: object
      additionalProperties: false
      required: [kind, netbox_device_id, discovered_device_id, detail]
      properties:
        kind:
          enum: [missing-discovered, unknown-discovered, status-mismatch]
        netbox_device_id:
          type: [string, 'null']
        discovered_device_id:
          type: [string, 'null']
        detail:
          type: string
    ReconciliationFindingsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationFinding'
    TrafficTimeRange:
      type: object
      additionalProperties: false
      required: [from, to, preset]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        preset:
          type: [string, 'null']
          enum: [1h, 6h, 24h, 7d, null]
    TrafficItem:
      type: object
      additionalProperties: false
      required: [rank, subject_kind, subject_id, label, bytes, packets, share]
      properties:
        rank:
          type: integer
          minimum: 1
          maximum: 1000
        subject_kind:
          enum: [device, ip, user, application, domain, asn, interface]
        subject_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        label:
          type: string
          minLength: 1
          maxLength: 255
        bytes:
          type: integer
          minimum: 0
        packets:
          type: [integer, 'null']
          minimum: 0
        share:
          type: [number, 'null']
          minimum: 0
          maximum: 1
    TrafficTopResponse:
      type: object
      additionalProperties: false
      required: [state, dimension, time_range, items, freshness]
      properties:
        state:
          enum: [not-connected, ok, unknown]
        dimension:
          enum: [talkers, destinations]
        time_range:
          $ref: '#/components/schemas/TrafficTimeRange'
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/TrafficItem'
        freshness:
          $ref: '#/components/schemas/Freshness'
    TrafficFlowFilters:
      description: The filters that were applied, echoed from the request (allow-listed fields only).
      type: object
      additionalProperties: false
      required:
      - source_ip
      - destination_ip
      - device
      - vlan
      - application
      - protocol
      - port
      - country
      - asn
      - direction
      properties:
        source_ip:
          type:
          - string
          - 'null'
          minLength: 2
          maxLength: 45
        destination_ip:
          type:
          - string
          - 'null'
          minLength: 2
          maxLength: 45
        device:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
        vlan:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 4094
        application:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
        protocol:
          enum:
          - tcp
          - udp
          - icmp
          - other
          - null
        port:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 65535
        country:
          type:
          - string
          - 'null'
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
        asn:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 4294967295
        direction:
          enum:
          - inbound
          - outbound
          - internal
          - null
    TrafficPersonRef:
      description: A person as the identity service names them; the label is untrusted text.
      type: object
      additionalProperties: false
      required:
      - id
      - label
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^person-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        label:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
    TrafficDeviceRef:
      description: The endpoint's device as the identity service names it; the label is untrusted text.
      type: object
      additionalProperties: false
      required:
      - id
      - label
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        label:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
    TrafficAttributionStatus:
      description: 'What the caller may be told about the person behind an address, and whether the identity service answered. withheld: the role holds no users permission; not-evaluated: there were no rows to attribute.'
      type: object
      additionalProperties: false
      required:
      - level
      - state
      - as_of
      properties:
        level:
          enum:
          - person
          - endpoint
          - none
        state:
          enum:
          - ok
          - not-connected
          - unknown
          - withheld
          - not-evaluated
        as_of:
          type:
          - string
          - 'null'
          format: date-time
      allOf:
      - if:
          properties:
            level:
              const: none
          required:
          - level
        then:
          properties:
            state:
              enum:
              - withheld
              - not-evaluated
      - if:
          properties:
            state:
              const: withheld
          required:
          - state
        then:
          properties:
            level:
              const: none
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
              - withheld
              - not-evaluated
          required:
          - state
        then:
          properties:
            as_of:
              type: 'null'
      - if:
          properties:
            state:
              const: ok
          required:
          - state
        then:
          properties:
            as_of:
              type: string
    TrafficFlowAttribution:
      description: 'Who was behind the source address when the flow was seen, with its basis. An address alone is never identity: unknown carries no person; inferred is capped at 0.7.'
      type: object
      additionalProperties: false
      required:
      - basis
      - reason
      - confidence
      - ambiguous
      - person
      - device
      properties:
        basis:
          enum:
          - observed
          - inferred
          - unknown
        reason:
          enum:
          - declared-assignment
          - indirect-evidence
          - low-confidence
          - name-match
          - conflicting-evidence
          - no-evidence
          - expired
          - multiple-candidates
          - shared-address
          - vpn-no-session
          - guest-network
          - ip-only
          - source-unavailable
          - restricted
          - null
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        ambiguous:
          type: boolean
        person:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TrafficPersonRef'
        device:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TrafficDeviceRef'
      allOf:
      - if:
          properties:
            basis:
              const: unknown
          required:
          - basis
        then:
          properties:
            person:
              type: 'null'
            confidence:
              type: 'null'
            reason:
              enum:
              - no-evidence
              - expired
              - conflicting-evidence
              - multiple-candidates
              - shared-address
              - vpn-no-session
              - guest-network
              - ip-only
              - source-unavailable
              - restricted
      - if:
          properties:
            basis:
              const: observed
          required:
          - basis
        then:
          properties:
            person:
              type: object
            confidence:
              type: number
            reason:
              type: 'null'
            ambiguous:
              const: false
      - if:
          properties:
            basis:
              const: inferred
          required:
          - basis
        then:
          properties:
            person:
              type: object
            confidence:
              type: number
              maximum: 0.7
            reason:
              enum:
              - declared-assignment
              - indirect-evidence
              - low-confidence
              - name-match
              - conflicting-evidence
            ambiguous:
              const: false
    TrafficFlow:
      type: object
      additionalProperties: false
      required:
      - observed_at
      - source_ip
      - source_device_id
      - destination_ip
      - destination_host
      - protocol
      - destination_port
      - bytes
      - packets
      - direction
      - application
      - attribution
      properties:
        observed_at:
          type: string
          format: date-time
        source_ip:
          type: string
          minLength: 1
          maxLength: 45
        source_device_id:
          description: Canonical device ID when resolvable; null otherwise.
          type:
          - string
          - 'null'
          pattern: ^device-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        destination_ip:
          type: string
          minLength: 1
          maxLength: 45
        destination_host:
          description: rDNS/domain as reported by the source; never inferred.
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        protocol:
          enum:
          - tcp
          - udp
          - icmp
          - other
        destination_port:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 65535
        bytes:
          type: integer
          minimum: 0
        packets:
          type:
          - integer
          - 'null'
          minimum: 0
        direction:
          description: Derived only from the source's own interface boundary classification; unknown otherwise.
          enum:
          - inbound
          - outbound
          - internal
          - unknown
        application:
          description: Source-reported application/enrichment metadata only.
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        attribution:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TrafficFlowAttribution'
    TrafficTimelineBucket:
      type: object
      additionalProperties: false
      required:
      - start
      - bytes
      - packets
      - flows
      properties:
        start:
          type: string
          format: date-time
        bytes:
          type: integer
          minimum: 0
        packets:
          type:
          - integer
          - 'null'
          minimum: 0
        flows:
          type: integer
          minimum: 0
    TrafficVolume:
      description: Totals over the filtered window, summed from the source's own counters.
      type: object
      additionalProperties: false
      required:
      - bytes
      - packets
      - flows
      - source_addresses
      - destination_addresses
      properties:
        bytes:
          type: integer
          minimum: 0
        packets:
          type:
          - integer
          - 'null'
          minimum: 0
        flows:
          type: integer
          minimum: 0
        source_addresses:
          type: integer
          minimum: 0
        destination_addresses:
          type: integer
          minimum: 0
    TrafficApplicationMixItem:
      type: object
      additionalProperties: false
      required:
      - application
      - bytes
      - share
      properties:
        application:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        bytes:
          type: integer
          minimum: 0
        share:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
    TrafficApplicationMix:
