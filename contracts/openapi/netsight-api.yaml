          minimum: 0
        total_bytes:
          type: integer
          minimum: 0
    TrafficDestinationShare:
      type: object
      additionalProperties: false
      required:
      - address
      - host
      - scope
      - bytes
      - share
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 45
        host:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        scope:
          enum:
          - external
          - internal
          description: 'internal: a private, loopback, link-local, shared or multicast address. The aggregate tier is never told about internal destinations.'
        bytes:
          type: integer
          minimum: 0
        share:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
    TrafficAggregations:
      description: Bounded aggregations over the whole filtered window (not over the listed rows).
      type: object
      additionalProperties: false
      required:
      - bucket_seconds
      - timeline
      - volume
      - application_mix
      - destinations
      properties:
        bucket_seconds:
          type: integer
          minimum: 60
          maximum: 86400
        timeline:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/TrafficTimelineBucket'
        volume:
          $ref: '#/components/schemas/TrafficVolume'
        application_mix:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TrafficApplicationMix'
        destinations:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/TrafficDestinationShare'
    TrafficCohort:
      description: 'The small-cohort rule as applied to this answer. not-applied: the caller holds the detail tier (or nothing was read). sufficient: the aggregate tier, and the figures describe at least minimum source addresses. too-few-sources: the aggregate tier, and something was withheld because fewer than minimum source addresses stood behind it.'
      type: object
      additionalProperties: false
      required:
      - state
      - minimum
      properties:
        state:
          enum:
          - not-applied
          - sufficient
          - too-few-sources
        minimum:
          type:
          - integer
          - 'null'
          minimum: 2
          maximum: 1000
      allOf:
      - if:
          properties:
            state:
              const: not-applied
          required:
          - state
        then:
          properties:
            minimum:
              type: 'null'
        else:
          properties:
            minimum:
              type: integer
    TrafficFlowsResponse:
      type: object
      required:
