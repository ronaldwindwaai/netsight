          $ref: '#/components/schemas/Freshness'
    AlertListResponse:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, freshness]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        page:
