    UnknownDeviceEvidenceRef:
      type: object
      additionalProperties: false
      required:
      - id
      - source
      - kind
      - observed_at
      - confidence
      properties:
        id:
          minLength: 1
          maxLength: 128
          type: string
        source:
          minLength: 1
          maxLength: 32
          pattern: ^[a-z0-9][a-z0-9_.-]{0,31}$
          type: string
        kind:
          minLength: 1
          maxLength: 40
          pattern: ^[a-z0-9][a-z0-9-]{0,39}$
          type: string
        observed_at:
          type: string
          format: date-time
        confidence:
          minimum: 0
          maximum: 1
          type:
          - number
          - 'null'
      description: 'A pointer to the observation behind a link: which source, what kind, when. confidence is the source''s own, or null when it reported none.'
    UnknownDeviceLinkSlot:
      type: object
      additionalProperties: false
      required:
      - slot
      - basis
      - value
      - label
      - attachment_kind
      - confidence
      - reason
      - evidence
      properties:
        slot:
          enum:
          - ip
          - mac
          - attachment
          - port
          - vlan
        basis:
          enum:
          - observed
          - inferred
          - unknown
        value:
          minLength: 1
          maxLength: 128
          type:
          - string
          - 'null'
        label:
          minLength: 1
          maxLength: 128
          type:
          - string
          - 'null'
        attachment_kind:
          oneOf:
          - type: 'null'
          - enum:
            - switch
            - ap
        confidence:
          minimum: 0
          maximum: 1
          type:
          - number
          - 'null'
        reason:
          oneOf:
          - type: 'null'
          - enum:
            - declared-assignment
            - indirect-evidence
            - low-confidence
            - name-match
            - no-evidence
            - expired
            - conflicting-evidence
            - source-unavailable
            - guest-network
        evidence:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/UnknownDeviceEvidenceRef'
      description: One hop of the chain IP, MAC, switch or AP, port, VLAN. observed and inferred name a value and the evidence behind it; unknown names nothing and says why. label is untrusted display text.
      allOf:
      - if:
          properties:
            basis:
              const: unknown
        then:
          properties:
            value:
              type: 'null'
            label:
              type: 'null'
            attachment_kind:
              type: 'null'
            confidence:
              type: 'null'
            reason:
              type: string
            evidence:
              maxItems: 0
      - if:
          properties:
            basis:
              const: observed
        then:
          properties:
            value:
              type: string
            reason:
              type: 'null'
            evidence:
              minItems: 1
      - if:
          properties:
            basis:
              const: inferred
        then:
          properties:
            value:
              type: string
            reason:
              type: string
            evidence:
              minItems: 1
            confidence:
              type: number
              maximum: 0.7
      - if:
          properties:
            slot:
              enum:
              - ip
              - mac
              - port
              - vlan
        then:
          properties:
            attachment_kind:
              type: 'null'
    UnknownDeviceEndpoint:
      type: object
