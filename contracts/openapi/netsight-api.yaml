      summary: Internet/WAN status from LibreNMS interface metrics and stored probe samples (explicit source state)
      operationId: getInternet
      responses:
        '200':
          description: Per-link status, throughput, quality and availability, or an explicit not-connected/unknown state without links
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternetResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /internet/sla:
    get:
      summary: Monthly uptime, downtime, degraded periods and violations computed from stored probe samples
      operationId: getInternetSla
      parameters:
        - in: query
          name: month
          description: UTC calendar month; the current month back to 24 months ago (default the current month)
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: The month's figures per link, or an explicit not-connected/unknown state without links
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternetSlaResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /internet/sla/export:
    get:
      summary: Bounded read-only evidence export of outage, degraded and unknown windows for an ISP dispute
      operationId: exportInternetSla
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        - in: query
          name: format
          schema:
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: The evidence as JSON or CSV (one row per window); gaps in sampling are unknown windows
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternetSlaExport'
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users:
    get:
      summary: List the people known to the identity evidence, bounded and paged (per-user data; audited)
      operationId: listUsers
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: One page of people with the basis of their current presence, or an explicit not-connected/unknown state without rows
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /users/summary:
    get:
      summary: Aggregate counts of people by presence basis (no names, no identifiers; the only users surface for Management)
      operationId: getUsersSummary
      responses:
        '200':
          description: Counts only, or an explicit not-connected/unknown state without counts
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersAggregateResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '429':
          $ref: '#/components/responses/RateLimited'
  /users/{user_id}:
    get:
      summary: One person's profile, current sessions and activity attributed by time-bounded correlation (per-user data; audited)
      operationId: getUser
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 43
            pattern: '^person-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      responses:
        '200':
          description: The profile, or an explicit not-connected/unknown state without one
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          description: No such person in the evidence
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /identity/resolve:
    get:
      summary: Who is behind an IP address, MAC address or hostname at a time, with the basis of every correlation (an IP address alone is never identity)
      operationId: resolveIdentity
      parameters:
        - in: query
          name: ip
          description: Exactly one of ip, mac and hostname is required. An IPv4 or IPv6 address (no prefix, no zone id); IPv4-mapped IPv6 is treated as the IPv4
          schema:
            type: string
            maxLength: 64
        - in: query
          name: mac
          description: Six octets separated by colons or hyphens, three dotted groups of four digits, or twelve digits
          schema:
            type: string
            maxLength: 64
        - in: query
          name: hostname
          description: Letters, digits, dots, hyphens and underscores, at most 128 characters (a trailing dot is ignored; compared in lower case)
          schema:
            type: string
            maxLength: 256
        - in: query
          name: at
          description: Point in time to answer for (RFC 3339); not in the future and at most 7 days ago. Default now.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The attribution and the endpoint's network links, or an explicit not-connected/unknown state without links
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolveResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /diagnostics:
    post:
      summary: Start a bounded read-only diagnostic run and return its result
