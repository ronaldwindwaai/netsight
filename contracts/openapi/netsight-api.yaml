            state_to:
              type: string
      - if:
          properties:
            kind:
              enum:
              - detected
              - evidence-updated
              - action-proposed
              - assignee-changed
              - comment
        then:
          properties:
            state_from:
              type: 'null'
            state_to:
              type: 'null'
      - if:
          properties:
            kind:
              const: comment
        then:
          properties:
            message:
              type: string
