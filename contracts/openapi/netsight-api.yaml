openapi: 3.1.0
info:
  title: Netsight Platform API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /auth/providers:
    get:
      summary: Public sign-in provider configuration state
      security: []
      responses:
        '200':
          description: Which identity providers are connected (never exposes secrets)
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvidersResponse'
  /topology:
    get:
      summary: Explicit topology state (not connected until a topology source is configured)
      operationId: getTopology
      responses:
        '200':
          description: Topology state without fabricated nodes/edges
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /overview:
    get:
      summary: Aggregate operational summary for the network overview page
      operationId: getOverview
      responses:
        '200':
          description: Canonical device health counts and per-source state
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /health:
    get:
      summary: Platform health
      security: []
      responses:
        '200':
          description: Healthy
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /sources/librenms/health:
    get:
      summary: Get the protected LibreNMS source health state
      operationId: getLibrenmsSourceHealth
      responses:
        '200':
          description: Current source health observation
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceHealthResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /sources/netbox/health:
    get:
      summary: Get the protected NetBox source health state
      operationId: getNetboxSourceHealth
      responses:
        '200':
          description: Current source health observation
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceHealthResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /netbox/devices:
    get:
      summary: List canonical NetBox devices
      operationId: listNetboxDevices
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Bounded page of canonical NetBox devices
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /netbox/devices/{device_id}:
    get:
      summary: Get a canonical NetBox device
      operationId: getNetboxDevice
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Canonical NetBox device detail
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetailResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /reconcile/findings:
    get:
      summary: NetBox vs discovered LibreNMS reconciliation findings
      operationId: listReconciliationFindings
      responses:
        '200':
          description: Reconciliation findings between intended NetBox state and discovered LibreNMS devices
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationFindingsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /traffic/top-talkers:
    get:
      summary: Top traffic talkers for a bounded time window (explicit source state)
      operationId: getTrafficTopTalkers
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Top talkers, or an explicit not-connected/unknown state without items
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficTopResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /traffic/top-destinations:
    get:
      summary: Top traffic destinations for a bounded time window (explicit source state)
      operationId: getTrafficTopDestinations
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Top destinations, or an explicit not-connected/unknown state without items
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficTopResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /traffic/flows:
    get:
      summary: Recent high-volume flows for a bounded time window (explicit source state)
      operationId: getTrafficFlows
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: High-volume flows, or an explicit not-connected/unknown state without flows
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficFlowsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /security/events:
    get:
      summary: Security events for a bounded time window (explicit source state)
      operationId: getSecurityEvents
      parameters:
        - in: query
          name: preset
          schema:
            enum: [1h, 6h, 24h, 7d]
            default: 24h
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: Security events, or an explicit not-connected/unknown state without events
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityEventsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /devices:
    get:
      summary: List canonical devices
      operationId: listDevices
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Bounded page of canonical devices
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /devices/{device_id}:
    get:
      summary: Get a canonical device
      operationId: getDevice
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Canonical device detail
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetailResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /devices/{device_id}/interfaces:
    get:
      summary: List canonical interfaces for a device
      operationId: listDeviceInterfaces
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Canonical interface records
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterfaceListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /alerts:
    get:
      summary: List canonical alerts
      operationId: listAlerts
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Bounded page of canonical alerts
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InvalidSourceData'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /incidents:
    get:
      summary: List incidents (newest first; explicit store state)
      operationId: listIncidents
      parameters:
      - in: query
        name: state
        schema:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
      - in: query
        name: severity
        schema:
          enum:
          - low
          - medium
          - high
          - critical
      - in: query
        name: assignee_id
        schema:
          type: string
          minLength: 1
          maxLength: 255
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      responses:
        '200':
          description: Incident page, or an explicit not-connected/unknown state without rows
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /incidents/summary:
    get:
      summary: List incident summaries (Management view, newest first; explicit store state)
      description: Reduced rows for incidents:read-summary. No evidence ids, resolution text, timeline or
        assignee identity are ever returned; assigned only says whether somebody holds the incident.
      operationId: listIncidentSummaries
      parameters:
      - in: query
        name: state
        schema:
          enum:
          - open
          - acknowledged
          - investigating
          - mitigated
          - resolved
          - closed
      - in: query
        name: severity
        schema:
          enum:
          - low
          - medium
          - high
          - critical
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      responses:
        '200':
          description: Summary page, or an explicit not-connected/unknown state without rows
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentSummaryListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /incidents/{incident_id}:
    get:
      summary: Get one incident (explicit store state)
      operationId: getIncident
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      responses:
        '200':
          description: The incident, or an explicit not-connected/unknown state without it
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetailResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /incidents/{incident_id}/timeline:
    get:
      summary: Append-only incident timeline (bounded page)
      operationId: getIncidentTimeline
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - in: query
        name: after_seq
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
      responses:
        '200':
          description: Timeline page, or an explicit not-connected/unknown state without events
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentTimelineResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /incidents/{incident_id}/acknowledge:
    post:
      summary: Acknowledge an open incident
      operationId: acknowledgeIncident
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - in: header
        name: X-CSRF-Token
        required: true
        description: Session CSRF token from GET /auth/csrf. Required for cookie-authenticated writes.
        schema:
          type: string
      responses:
        '200':
          description: Updated incident
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '409':
          $ref: '#/components/responses/IncidentConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /incidents/{incident_id}/transition:
    post:
      summary: Progress an incident one step (not resolve or reopen)
      operationId: transitionIncident
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - in: header
        name: X-CSRF-Token
        required: true
        description: Session CSRF token from GET /auth/csrf. Required for cookie-authenticated writes.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentTransitionRequest'
      responses:
        '200':
          description: Updated incident
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '409':
          $ref: '#/components/responses/IncidentConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /incidents/{incident_id}/assign:
    post:
      summary: Assign or unassign an incident
      operationId: assignIncident
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - in: header
        name: X-CSRF-Token
        required: true
        description: Session CSRF token from GET /auth/csrf. Required for cookie-authenticated writes.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentAssignRequest'
      responses:
        '200':
          description: Updated incident
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '409':
          $ref: '#/components/responses/IncidentConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /incidents/{incident_id}/comment:
    post:
      summary: Append a comment to the incident timeline
      operationId: commentIncident
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
          maxLength: 45
          pattern: ^incident-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - in: header
        name: X-CSRF-Token
        required: true
        description: Session CSRF token from GET /auth/csrf. Required for cookie-authenticated writes.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentCommentRequest'
      responses:
        '201':
          description: The appended timeline event
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentTimelineEvent'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '409':
          $ref: '#/components/responses/IncidentConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /incidents/{incident_id}/evidence:
    post:
      summary: Attach an evidence reference (idempotent)
      operationId: addIncidentEvidence
      parameters:
      - in: path
        name: incident_id
        required: true
        schema:
          type: string
          minLength: 45
