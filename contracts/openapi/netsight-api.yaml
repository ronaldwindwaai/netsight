        counts:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IpamCounts'
      description: 'GET /api/v1/ipam: what is known, from where, and counts only (Management''s rung). state is NetBox IPAM''s: not-connected when NetBox is not configured, unknown when none of its IPAM reads worked.'
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            counts:
              type: 'null'
    IpamCounts:
      type: object
      additionalProperties: false
      required:
      - prefixes
      - vlans
      - addresses
      - reserved_ranges
      - active_addresses
      - stale_addresses
      - unknown_activity_addresses
      - discovered_only_addresses
      properties:
        prefixes:
          minimum: 0
          maximum: 1000000
          type:
          - integer
          - 'null'
        vlans:
          minimum: 0
          maximum: 1000000
          type:
          - integer
          - 'null'
        addresses:
          minimum: 0
          maximum: 1000000
          type:
          - integer
          - 'null'
        reserved_ranges:
          minimum: 0
          maximum: 1000000
          type:
          - integer
          - 'null'
        active_addresses:
          minimum: 0
          maximum: 1000000
          type:
          - integer
          - 'null'
        stale_addresses:
          minimum: 0
          maximum: 1000000
          type:
          - integer
          - 'null'
        unknown_activity_addresses:
          minimum: 0
          maximum: 1000000
          type:
          - integer
          - 'null'
        discovered_only_addresses:
          minimum: 0
          maximum: 1000000
          type:
          - integer
          - 'null'
      description: Counts only. null is not reported (that NetBox read failed or telemetry is unavailable), never zero.
    IpamTelemetry:
      type: object
      additionalProperties: false
      required:
      - state
      - window_seconds
      - sources
      properties:
        state:
          enum:
          - not-connected
          - unknown
          - ok
        window_seconds:
          minimum: 3600
          maximum: 604800
          type: integer
        sources:
          type: array
          maxItems: 2
          items:
            enum:
            - librenms
            - wazuh
      description: Which telemetry decides whether an address was seen within the window. state ok means at least one source was read; it then lists those that were. Stale and active are only judged when it is ok.
      allOf:
      - if:
          properties:
            state:
              enum:
              - not-connected
              - unknown
        then:
          properties:
            sources:
              maxItems: 0
      - if:
          properties:
            state:
              const: ok
        then:
          properties:
            sources:
              minItems: 1
    IpamUtilisation:
      type: object
      additionalProperties: false
      required:
      - state
      - basis
      - capacity
      - netbox_addresses
      - discovered_only
      - used
      - reserved
      - free
      - percent
      properties:
        state:
          enum:
          - ok
          - unknown
        basis:
          enum:
          - netbox-addresses
          - netbox-and-discovered
          - marked-utilized
          - capacity-not-meaningful
          - addresses-unavailable
        capacity:
          minimum: 0
          maximum: 4294967296
          type:
          - integer
          - 'null'
        netbox_addresses:
          minimum: 0
          maximum: 1000000
          type:
          - integer
          - 'null'
        discovered_only:
          minimum: 0
          maximum: 1000000
          type:
          - integer
          - 'null'
        used:
          minimum: 0
          maximum: 2000000
          type:
          - integer
          - 'null'
        reserved:
          minimum: 0
          maximum: 4294967296
          type:
          - integer
          - 'null'
        free:
          minimum: 0
          maximum: 4294967296
          type:
          - integer
          - 'null'
        percent:
          minimum: 0
          maximum: 100
          type:
          - number
          - 'null'
      description: Utilisation with its basis. used = NetBox address records inside the prefix + addresses telemetry saw that NetBox lacks; reserved = addresses of reserved ranges not otherwise used; percent = used over capacity (100 at most). marked-utilized is NetBox's own flag for a prefix the operator declared full. unknown carries no figure.
      allOf:
      - if:
          properties:
            state:
              const: unknown
        then:
          properties:
            netbox_addresses:
              type: 'null'
            discovered_only:
              type: 'null'
            used:
              type: 'null'
            reserved:
              type: 'null'
            free:
              type: 'null'
            percent:
              type: 'null'
      - if:
          properties:
            basis:
              enum:
              - capacity-not-meaningful
              - addresses-unavailable
        then:
          properties:
            state:
              const: unknown
      - if:
          properties:
            basis:
              enum:
              - capacity-not-meaningful
        then:
          properties:
            capacity:
              type: 'null'
      - if:
          properties:
            basis:
              const: marked-utilized
        then:
          properties:
            state:
              const: ok
            percent:
              const: 100
      - if:
          properties:
            basis:
              const: netbox-addresses
        then:
          properties:
            state:
              const: ok
            discovered_only:
              const: 0
